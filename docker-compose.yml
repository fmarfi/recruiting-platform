# Local development stack: PostgreSQL 17 + pgvector, and Mailpit (catches all outgoing e-mail).
# Usage: cp .env.example .env && docker compose up -d
# Mailpit UI: http://localhost:8025   SMTP: localhost:1025
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: recruiting-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruiting}
      POSTGRES_USER: ${POSTGRES_USER:-recruiting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruiting}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: recruiting-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  mailpit-data:
