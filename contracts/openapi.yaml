  /job-orders/{id}/applications:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Pipeline]
      operationId: listJobOrderApplications
      summary: Candidates on the board of a job order (UX-04)
      description: All applications of the job order, including rejected ones; the board groups them by `stage` in the order of `ReferenceData.stageOrder`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      parameters:
        - name: stage
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/PipelineStage' }
          style: form
          explode: true
        - name: list
          in: query
          description: Since 1.3.0. Only applications on this list (derived from the stage, see `CandidateList`), ordered by `rank`.
          schema: { $ref: '#/components/schemas/CandidateList' }
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Pipeline]
      operationId: addCandidateToJobOrder
      summary: Put a person on the job order (stage SOURCED)
      description: |
        Guards: the job order must be open and its account not CLOSED (409 `TRANSITION_GUARD_FAILED`); the same person twice gives 409 `DUPLICATE`.

        Since 1.2.0 (ADR 0011):
        - **Off-limits guard.** If the person's current company (person `company`, or an employment
          without `endDate`) matches an active off-limits rule, 409 `OFF_LIMITS` with the rules in
          `blockingItems` (type OFF_LIMITS_RULE, `reasonCode` an `OffLimitsReason`). Rules of the job
          order's own account are ignored. A MANAGER/ADMIN may add the person anyway with
          `offLimitsOverrideReason` (kept on the application, audited); a consultant sending it gets 403.
        - **Warnings.** 201 may carry `warnings`: `PREVIOUSLY_PRESENTED_TO_ACCOUNT` (with the exposures)
          and `ACTIVE_IN_OTHER_PROCESS`. They never block.
        - Consent is not needed to add a person (research is allowed); it is needed to move them into a
          client-facing stage (see `PATCH /applications/{id}/stage`), where off-limits is checked again.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationCreateRequest' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
