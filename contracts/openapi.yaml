              schema:
                type: array
                items: { $ref: '#/components/schemas/ClientReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Client reports]
      operationId: generateClientReport
      summary: Generate a branded PDF (shortlist, progress or candidate profile; SX-021/022, PB-021)
      description: |
        SHORTLIST: the shortlist in rank order (or `personIds`, which must be on it), with evaluation blocks
        allowed by `reportBlocks`/`internalOnly`, interview notes marked `includeInReport`, reference status
        and summary. PROGRESS: counts (targets researched and approached, longlist and shortlist sizes,
        client feedback, next steps) and no candidate names. CANDIDATE_PROFILE: one person (`personIds`
        with one id). People without valid consent are left out and listed in `excluded` (sharing guard
        via `ShareGuard`; never overridable); private notes and referee details never appear.
        `blind=true` replaces name, employer, photo, contact data, links and exact dates with an alias
        ("Candidate A") and returns `blindWarnings` where free text still contains the person's name or
        employer (advisory; the consultant checks). The file is stored (version per job order and kind) and
        downloaded with `GET /client-reports/{id}/content`. Generating is not sending: exposure is recorded
        by `POST /client-reports/{id}/sent`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline (report service); sharing guard by security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientReportRequest' }
      responses:
        '201':
          description: Generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /client-reports/{id}/content:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Client reports]
      operationId: downloadClientReport
      summary: Download the PDF (access-log DOWNLOAD, entity CLIENT_REPORT)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
  /client-reports/{id}/sent:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Client reports]
      operationId: markClientReportSent
      summary: Mark the report as sent to the client
      description: |
        Re-checks consent for every included person (409 `CONSENT_REQUIRED` if one lost it since
        generation: generate again). Writes one `candidate_exposure` row per included person (channel
        REPORT) and, for the first SHORTLIST report of the search, fires SHORTLIST_DELIVERED fee items.
        Sending twice returns the report unchanged.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientReportSentRequest' }
      responses:
        '200':
          description: Marked sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie set by `POST /auth/login`. With the mock server any value works (e.g. `JSESSIONID=mock`).
  headers:
    Location:
      description: URL of the created resource
      schema: { type: string, format: uri-reference }
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    FileIdPath:
      name: fileId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Q:
      name: q
      in: query
      description: Free-text filter (accent- and case-insensitive).
      schema: { type: string, maxLength: 200 }
    Page:
      name: page
      in: query
      description: Page number, 0-based.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: '`property,asc|desc`; repeat for several keys.'
      schema:
        type: array
        items: { type: string, pattern: '^[A-Za-z]+(,(asc|desc))?$' }
      style: form
      explode: true
    OwnerId:
      name: ownerId
      in: query
      description: Responsible user.
      schema: { $ref: '#/components/schemas/Id' }
    AccountIdQuery:
      name: accountId
      in: query
      schema: { $ref: '#/components/schemas/Id' }
    PersonIdQuery:
      name: personId
      in: query
      schema: { $ref: '#/components/schemas/Id' }
    JobOrderIdQuery:
      name: jobOrderId
      in: query
      schema: { $ref: '#/components/schemas/Id' }
    TagPath:
      name: tag
      in: path
      required: true
      description: The tag, URL-encoded; matched lower-case.
      schema: { $ref: '#/components/schemas/Tag' }
    Archived:
      name: archived
      in: query
      description: 'Since 1.3.0 (ADR 0013). Omitted or `false`: only records that are not archived (the 1.2 behaviour, because nothing was archived before); `true`: only archived records (the "Archived" view).'
      schema: { type: boolean, default: false }
  responses:
    BadRequest:
      description: Validation failed (`VALIDATION_FAILED`) or a reason is missing (`REASON_REQUIRED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:reason-required
            title: Reason required
            status: 400
            detail: A reason is required to move to Rejected.
            code: REASON_REQUIRED
            requestedStatus: REJECTED
            errors:
              - { field: reason, code: REQUIRED, message: A reason is required. }
    Unauthorized:
      description: Not logged in, session expired (`UNAUTHENTICATED`) or wrong credentials (`BAD_CREDENTIALS`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:unauthenticated
            title: Not logged in
            status: 401
            code: UNAUTHENTICATED
    Forbidden:
      description: The role does not allow this action (`FORBIDDEN`). Never returned for record ownership; any consultant may change any record (ADR 0007).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:forbidden
            title: Not allowed
            status: 403
            detail: Only managers and admins can close an account.
            code: FORBIDDEN
    NotFound:
      description: No such record (`NOT_FOUND`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:not-found
            title: Not found
            status: 404
            detail: Account 0192a5b8-0000-7000-8000-000000000001 does not exist.
            code: NOT_FOUND
    Conflict:
      description: |
        `ILLEGAL_TRANSITION` (with `currentStatus`, `requestedStatus`, `allowed`),
        `TRANSITION_GUARD_FAILED` (with `blockingItems` where records block the move), `VERSION_CONFLICT`,
        `DUPLICATE` (with `existingId`) or `STATE_CONFLICT`; since 1.2.0 also `CONSENT_REQUIRED` (sharing
        guard) and `OFF_LIMITS` (off-limits guard), both with `blockingItems[].reasonCode`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          examples:
            consentRequired:
              summary: Presenting a person without valid consent (sharing guard, 1.2.0)
              value:
                type: urn:recruiting:problem:consent-required
                title: Consent required
                status: 409
                detail: This person has not given consent yet. Send the consent request first.
                code: CONSENT_REQUIRED
                blockingItems:
                  - id: 0192a5b8-0000-7000-8000-000000000102
                    title: Elif Yıldırım
                    type: PERSON
                    reasonCode: CONSENT_PENDING
            offLimits:
              summary: Adding a person who works at an off-limits company (1.2.0)
              value:
                type: urn:recruiting:problem:off-limits
                title: Off-limits company
                status: 409
                detail: The person works at an off-limits company.
                code: OFF_LIMITS
                blockingItems:
                  - id: 0192a5b8-0000-7000-8000-00000000d001
                    title: Anadolu Lojistik
                    type: OFF_LIMITS_RULE
                    reasonCode: CLIENT_AGREEMENT
            illegalTransition:
              summary: Move outside the transition table
              value:
                type: urn:recruiting:problem:illegal-transition
                title: Illegal status change
                status: 409
                detail: Cannot move from Filled to Sourcing.
                code: ILLEGAL_TRANSITION
                currentStatus: FILLED
                requestedStatus: SOURCING
                allowed: []
            closeAccountBlocked:
              summary: Closing an account that still has open job orders (A-02)
              value:
                type: urn:recruiting:problem:transition-guard-failed
                title: Move not allowed
                status: 409
                detail: The account has 1 open job order. Close or cancel it first.
                code: TRANSITION_GUARD_FAILED
                currentStatus: ACTIVE
                requestedStatus: CLOSED
                blockingItems:
                  - id: 0192a5b8-0000-7000-8000-0000000000a1
                    title: Chief Financial Officer
                    type: JOB_ORDER
    Gone:
      description: The resource has expired or was removed for good (`GONE`), e.g. an expired consent link, an expired export file, or a client report deleted by an erasure
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Problem:
      description: Other error (see `code`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
  schemas:
    # ---------- common ----------
    Id:
      type: string
      format: uuid
      description: UUID v7 (ADR 0004)
      examples: [0192a5b8-6f1e-7c3a-9b2d-3f4e5a6b7c8d]
    Version:
      type: integer
      format: int64
      minimum: 0
      description: Optimistic-lock version; send it back on updates.
    Reason:
      type: [string, 'null']
      minLength: 3
      maxLength: 500
      description: Why the status changes. Trimmed by the server; after trimming it must be 3 to 500 characters. Required for some moves (see API description).
    PageMeta:
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size: { type: integer, examples: [20] }
        number: { type: integer, description: 0-based page number, examples: [0] }
        totalElements: { type: integer, format: int64, examples: [42] }
        totalPages: { type: integer, examples: [3] }
    ProblemDetail:
      type: object
      description: RFC 9457 problem details with extension members.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, examples: [urn:recruiting:problem:validation-failed] }
        title: { type: string, examples: [Validation failed] }
        status: { type: integer, examples: [400] }
        detail: { type: string }
        instance: { type: string, format: uri-reference, description: Request path }
        code: { $ref: '#/components/schemas/ErrorCode' }
        errors:
          type: array
          description: Field errors for VALIDATION_FAILED and REASON_REQUIRED.
          items: { $ref: '#/components/schemas/FieldError' }
        currentStatus: { type: string, description: ILLEGAL_TRANSITION and TRANSITION_GUARD_FAILED }
        requestedStatus: { type: string, description: 'ILLEGAL_TRANSITION, TRANSITION_GUARD_FAILED and REASON_REQUIRED' }
        allowed:
          type: array
          items: { type: string }
          description: ILLEGAL_TRANSITION — the statuses the record may move to.
        existingId:
          $ref: '#/components/schemas/Id'
          description: DUPLICATE — the record that already exists.
        blockingItems:
          type: array
          description: TRANSITION_GUARD_FAILED — the records that block the move (e.g. open job orders when closing an account).
          items:
            type: object
            required: [id, title, type]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              title: { type: string, examples: [Chief Financial Officer] }
              type: { type: string, description: Entity kind, examples: [JOB_ORDER] }
              reasonCode:
                type: string
                description: 'Since 1.2.0. CONSENT_REQUIRED: a `ShareBlockReason` (type PERSON); OFF_LIMITS: an `OffLimitsReason` (type OFF_LIMITS_RULE).'
                examples: [CONSENT_PENDING]
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, examples: [name] }
        code: { type: string, description: 'Bean Validation constraint, e.g. REQUIRED, SIZE, EMAIL, PATTERN', examples: [REQUIRED] }
        message: { type: string, examples: [must not be blank] }
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Deniz Aksoy] }
    AccountRef:
      type: object
      required: [id, name, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Örnek Gıda A.Ş.] }
        status: { $ref: '#/components/schemas/AccountStatus' }
    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Elif Yıldırım] }
    JobOrderRef:
      type: object
      required: [id, title, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string, examples: [Chief Financial Officer] }
        status: { $ref: '#/components/schemas/JobOrderStatus' }
    # ---------- enums (contracts/enums) ----------
    AccountStatus:
      type: string
      enum: [LEAD, PROPOSAL_SENT, ACTIVE, ON_HOLD, CLOSED]
    ProposalStatus:
      type: string
      enum: [DRAFT, SENT, ACCEPTED, REJECTED]
    JobOrderStatus:
      type: string
      enum: [OPEN, SOURCING, SHORTLIST_SENT, INTERVIEWING, OFFER, FILLED, CANCELLED]
    PipelineStage:
      type: string
      enum: [SOURCED, SCREENED, PRESENTED, CLIENT_INTERVIEW, OFFER, PLACED, REJECTED]
    ConsentStatus:
      type: string
      enum: [NOT_SENT, SENT, GIVEN, REFUSED, WITHDRAWN]
    DataSubjectRequestStatus:
      type: string
      enum: [RECEIVED, IN_PROGRESS, COMPLETED, REJECTED]
    DataSubjectRequestType:
      type: string
      enum: [ACCESS, CORRECTION, DELETION, OTHER]
    PersonType:
      type: string
      enum: [EXECUTIVE, CLIENT_CONTACT, REFERRER, CANDIDATE]
    ActivityType:
      type: string
      enum: [CALL, VISIT, MEETING, EMAIL, NOTE]
    LinkType:
      type: string
      enum: [KNOWS, WORKED_WITH, INTRODUCED, REFERRED, REPORTS_TO]
    Role:
      type: string
      enum: [CONSULTANT, MANAGER, ADMIN]
    ConsentDecision:
      type: string
      enum: [GIVEN, REFUSED, WITHDRAWN]
    ConsentChannel:
      type: string
      enum: [EMAIL_LINK, WEBSITE_FORM, IN_PERSON, PHONE, IMPORT]
    EmailDeliveryStatus:
      type: string
      enum: [QUEUED, SENT, FAILED]
    RetentionStatus:
      type: string
      enum: [ACTIVE, FLAGGED, ANONYMISED]
    RetentionBasis:
      type: string
      enum: [FROM_CREATED, FROM_LAST_CONTACT, FROM_LAST_CONSENT]
    RetentionAction:
      type: string
      enum: [ANONYMISE, DELETE]
    ImportKind:
      type: string
      enum: [ACCOUNTS, CONTACTS, PEOPLE]
    ImportStatus:
      type: string
      enum: [VALIDATED, IMPORTING, COMPLETED, FAILED, DISCARDED, ROLLED_BACK]
    TimelineKind:
      type: string
      enum: [ACCOUNT, ACCOUNT_STATUS, CONTACT, ACTIVITY, PROPOSAL, JOB_ORDER, CANDIDATE, ARCHIVE, MERGE, PLACEMENT]
    EntityType:
      type: string
      enum: [ACCOUNT, PERSON, CONTACT, NETWORK_LINK, JOB_ORDER, APPLICATION, PROPOSAL, ACTIVITY, NEXT_ACTION, USER, CONSENT_RECORD, CONSENT_REQUEST, PRIVACY_NOTICE, DATA_SUBJECT_REQUEST, IMPORT_JOB, PERSON_FILE, CV_INTAKE_ITEM, OFF_LIMITS_RULE, TAG, EVALUATION, INTERVIEW_NOTE, CANDIDATE_REFERENCE, CLIENT_FEEDBACK, TARGET_COMPANY, AGREEMENT, FEE_SCHEDULE_ITEM, PLACEMENT, CONFLICT_CHECK, EXPORT_JOB, CLIENT_REPORT]
    AccessAction:
      type: string
      enum: [VIEW, EXPORT, DOWNLOAD]
    RevisionType:
      type: string
      enum: [ADD, MOD, DEL]
    Language:
      type: string
      enum: [TR, EN]
    SearchType:
      type: string
      enum: [ACCOUNT, PERSON, JOB_ORDER]
    Tone:
      type: string
      enum: [NEUTRAL, INFO, PROGRESS, GOOD, WARN, BAD, MUTED]
    ErrorCode:
      type: string
      enum: [VALIDATION_FAILED, REASON_REQUIRED, UNAUTHENTICATED, BAD_CREDENTIALS, FORBIDDEN, NOT_FOUND, ILLEGAL_TRANSITION, TRANSITION_GUARD_FAILED, VERSION_CONFLICT, DUPLICATE, STATE_CONFLICT, CONSENT_REQUIRED, OFF_LIMITS, ARCHIVED, GONE, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, TOO_MANY_REQUESTS, INTERNAL_ERROR]
    # ---------- auth and users ----------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, examples: [deniz.aksoy@example.com] }
        password: { type: string, format: password, minLength: 1, maxLength: 200 }
    CurrentUser:
      type: object
      required: [id, email, name, role, language, mustChangePassword]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email, examples: [deniz.aksoy@example.com] }
        name: { type: string, examples: [Deniz Aksoy] }
        role: { $ref: '#/components/schemas/Role' }
        language: { $ref: '#/components/schemas/Language' }
        mustChangePassword: { type: boolean, examples: [false] }
    CurrentUserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        language: { $ref: '#/components/schemas/Language' }
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 12, maxLength: 200 }
    PasswordResetRequest:
      type: object
      required: [initialPassword]
      properties:
        initialPassword: { type: string, format: password, minLength: 12, maxLength: 200 }
    User:
      type: object
      required: [id, email, name, role, active, language, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        name: { type: string, examples: [Deniz Aksoy] }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean, examples: [true] }
        language: { $ref: '#/components/schemas/Language' }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    UserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { $ref: '#/components/schemas/PageMeta' }
    UserCreateRequest:
      type: object
      required: [email, name, role, initialPassword]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
        language: { $ref: '#/components/schemas/Language' }
        initialPassword: { type: string, format: password, minLength: 12, maxLength: 200 }
    UserUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
        language: { $ref: '#/components/schemas/Language' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- reference data ----------
    StatusDefinition:
      type: object
      required: [value, labelEn, labelTr, tone, terminal, next]
      properties:
        value: { type: string, examples: [ON_HOLD] }
        labelEn: { type: string, examples: [On hold] }
        labelTr: { type: string, examples: [Beklemede] }
        tone: { $ref: '#/components/schemas/Tone' }
        terminal: { type: boolean }
        next:
          type: array
          description: Allowed next statuses with their rules.
          items: { $ref: '#/components/schemas/TransitionDefinition' }
    TransitionDefinition:
      type: object
      required: [to, reasonRequired, managerOnly]
      properties:
        to: { type: string, examples: [CLOSED] }
        reasonRequired: { type: boolean, examples: [true] }
        managerOnly: { type: boolean, description: Only MANAGER and ADMIN may make this move., examples: [true] }
    LifecycleDefinition:
      type: object
      required: [initial, statuses]
      properties:
        initial: { type: string, examples: [LEAD] }
        statuses:
          type: array
          description: In display order.
          items: { $ref: '#/components/schemas/StatusDefinition' }
    ReferenceData:
      type: object
      required: [today, lifecycles, stageOrder, vocabularies, sectors]
      properties:
        today: { type: string, format: date, description: Server date (Europe/Istanbul). }
        lifecycles:
          type: object
          required: [account, proposal, jobOrder, pipelineStage, consent, dataSubjectRequest]
          properties:
            account: { $ref: '#/components/schemas/LifecycleDefinition' }
            proposal: { $ref: '#/components/schemas/LifecycleDefinition' }
            jobOrder: { $ref: '#/components/schemas/LifecycleDefinition' }
            pipelineStage: { $ref: '#/components/schemas/LifecycleDefinition' }
            consent: { $ref: '#/components/schemas/LifecycleDefinition' }
            dataSubjectRequest: { $ref: '#/components/schemas/LifecycleDefinition' }
        stageOrder:
          type: array
          description: Board columns, left to right (REJECTED last).
          items: { $ref: '#/components/schemas/PipelineStage' }
        vocabularies:
          type: object
          description: Values of the plain enums; labels come from the frontend i18n files.
          required: [personType, activityType, linkType, role, consentChannel, dataSubjectRequestType, language]
          properties:
            personType: { type: array, items: { $ref: '#/components/schemas/PersonType' } }
            activityType: { type: array, items: { $ref: '#/components/schemas/ActivityType' } }
            linkType: { type: array, items: { $ref: '#/components/schemas/LinkType' } }
            role: { type: array, items: { $ref: '#/components/schemas/Role' } }
            consentChannel: { type: array, items: { $ref: '#/components/schemas/ConsentChannel' } }
            dataSubjectRequestType: { type: array, items: { $ref: '#/components/schemas/DataSubjectRequestType' } }
            language: { type: array, items: { $ref: '#/components/schemas/Language' } }
        sectors:
          type: array
          description: Distinct sectors in use, sorted (free text on the account, suggested in pickers).
          items: { type: string }
          examples: [[Finance, FMCG, Retail, Technology]]
    # ---------- accounts ----------
    Account:
      type: object
      required: [id, name, sector, owner, status, statusChangedAt, openedOn, openJobCount, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Örnek Gıda A.Ş.] }
        sector: { type: [string, 'null'], description: 'Null only for organisations that are neither CLIENT nor PROSPECT (since 1.3.0, R63).', examples: [FMCG] }
        roles:
          type: array
          uniqueItems: true
          minItems: 1
          description: Since 1.3.0 (R63). The organisation's roles; `status` is the client lifecycle and matters for CLIENT and PROSPECT.
          items: { $ref: '#/components/schemas/OrganisationRole' }
        aliases:
          type: array
          description: Since 1.3.0 (R63). Former names, brands, abbreviations; matched like the name.
          items: { type: string }
        normalizedName: { type: string, description: 'Since 1.3.0 (R63). Read-only; lower case, accents and legal forms removed (`schema.md`). Unique among non-archived organisations.', examples: [ornek gida] }
        city: { type: [string, 'null'], examples: [İstanbul] }
        website: { type: [string, 'null'], format: uri }
        notes: { type: [string, 'null'] }
        owner: { $ref: '#/components/schemas/UserRef' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        statusChangedAt: { type: string, format: date-time }
        openedOn: { type: string, format: date }
        openJobCount: { type: integer, minimum: 0, description: Job orders not FILLED or CANCELLED., examples: [2] }
        lastActivityAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
        archive:
          oneOf: [{ $ref: '#/components/schemas/ArchiveInfo' }, { type: 'null' }]
          description: Since 1.3.0. Null while not archived.
        legalName: { type: [string, 'null'], description: 'Since 1.3.0. Registered name (ticari unvan), used on invoices.', examples: [Örnek Gıda Sanayi ve Ticaret A.Ş.] }
        taxId: { type: [string, 'null'], description: 'Since 1.3.0. VKN, TCKN or a foreign tax id as entered; no format check in 1.3.' }
        taxOffice: { type: [string, 'null'], examples: [Boğaziçi Kurumlar] }
        mersisNo: { type: [string, 'null'] }
        einvoiceStatus: { $ref: '#/components/schemas/EInvoiceStatus' }
        einvoiceAlias: { type: [string, 'null'] }
        billingAddress: { type: [string, 'null'] }
        billingEmails:
          type: array
          items: { type: string, format: email }
        billingCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        vatExempt: { type: boolean }
        withholdingApplies: { type: boolean }
        parentAccount:
          oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }]
          description: Since 1.3.0. Group parent; the group is this account, its parent chain and children.
        groupName: { type: [string, 'null'], description: Group name when the parent is not in the CRM., examples: [Marmara Holding] }
        employeeBand:
          oneOf: [{ $ref: '#/components/schemas/EmployeeBand' }, { type: 'null' }]
        hqCountry: { type: [string, 'null'], pattern: '^[A-Z]{2}$', description: 'ISO 3166-1 alpha-2; `city` is the HQ city.', examples: [TR] }
        confidentialityLevel: { $ref: '#/components/schemas/ConfidentialityLevel' }
        preferredLanguage:
          oneOf: [{ $ref: '#/components/schemas/Language' }, { type: 'null' }]
        missingForActive:
          type: array
          description: |
            Since 1.3.0. Profile fields still empty that an active client needs (PB-014, CO-019):
            `legalName`, `taxId`, `taxOffice`, `billingAddress`, `billingEmails`, `signedAgreement`,
            `conflictCheck`. Informational in 1.3 (no status guard yet, ADR 0013).
          items: { type: string }
    AccountPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        page: { $ref: '#/components/schemas/PageMeta' }
    AccountCreateRequest:
      type: object
      required: [name]
      description: |
        `sector` is required (400) unless `roles` holds only TARGET and/or EMPLOYER (since 1.3.0, R63).
        A name or alias whose normalised form matches a non-archived organisation's name or alias gives
        409 `DUPLICATE` with `existingId`.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        sector: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        roles:
          type: array
          uniqueItems: true
          minItems: 1
          description: Since 1.3.0. Default [PROSPECT].
          items: { $ref: '#/components/schemas/OrganisationRole' }
        aliases:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 100 }
        website: { type: [string, 'null'], format: uri, maxLength: 300 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        ownerId:
          $ref: '#/components/schemas/Id'
          description: Defaults to the current user.
        legalName: { type: [string, 'null'], maxLength: 300 }
        taxId: { type: [string, 'null'], maxLength: 20, description: Plain string; no check-digit validation in 1.3 (VWC). }
        taxOffice: { type: [string, 'null'], maxLength: 100 }
        mersisNo: { type: [string, 'null'], maxLength: 16 }
        einvoiceStatus: { $ref: '#/components/schemas/EInvoiceStatus' }
        einvoiceAlias: { type: [string, 'null'], maxLength: 100 }
        billingAddress: { type: [string, 'null'], maxLength: 500 }
        billingEmails:
          type: array
          maxItems: 5
          items: { type: string, format: email, maxLength: 254 }
        billingCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        vatExempt: { type: boolean, description: Default false. }
        withholdingApplies: { type: boolean, description: Default false. }
        parentAccountId:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
          description: No cycles and a chain of at most 5 (400 `VALIDATION_FAILED`, field `parentAccountId`); not an archived account (409 `ARCHIVED`).
        groupName: { type: [string, 'null'], maxLength: 200 }
        employeeBand:
          oneOf: [{ $ref: '#/components/schemas/EmployeeBand' }, { type: 'null' }]
        hqCountry: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
        confidentialityLevel: { $ref: '#/components/schemas/ConfidentialityLevel' }
        preferredLanguage:
          oneOf: [{ $ref: '#/components/schemas/Language' }, { type: 'null' }]
    AccountUpdateRequest:
      type: object
      description: Since 1.3.0 also takes the profile fields, `roles` and `aliases` of `AccountCreateRequest` (same rules; `aliases` replaces the whole list). CLIENT is also set by the server when the status becomes ACTIVE or when a job order is created for the organisation, TARGET when it becomes a target company, EMPLOYER on an employment link. Removing CLIENT while the organisation has open job orders gives 409 `TRANSITION_GUARD_FAILED` with the job orders as `blockingItems`; removing the other roles is always allowed.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        sector: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        roles:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: '#/components/schemas/OrganisationRole' }
        aliases:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 100 }
        website: { type: [string, 'null'], format: uri, maxLength: 300 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        ownerId: { $ref: '#/components/schemas/Id' }
        version: { $ref: '#/components/schemas/Version' }
        legalName: { type: [string, 'null'], maxLength: 300 }
        taxId: { type: [string, 'null'], maxLength: 20 }
        taxOffice: { type: [string, 'null'], maxLength: 100 }
        mersisNo: { type: [string, 'null'], maxLength: 16 }
        einvoiceStatus: { $ref: '#/components/schemas/EInvoiceStatus' }
        einvoiceAlias: { type: [string, 'null'], maxLength: 100 }
        billingAddress: { type: [string, 'null'], maxLength: 500 }
        billingEmails:
          type: array
          maxItems: 5
          items: { type: string, format: email, maxLength: 254 }
        billingCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        vatExempt: { type: boolean }
        withholdingApplies: { type: boolean }
        parentAccountId:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
        groupName: { type: [string, 'null'], maxLength: 200 }
        employeeBand:
          oneOf: [{ $ref: '#/components/schemas/EmployeeBand' }, { type: 'null' }]
        hqCountry: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
        confidentialityLevel: { $ref: '#/components/schemas/ConfidentialityLevel' }
        preferredLanguage:
          oneOf: [{ $ref: '#/components/schemas/Language' }, { type: 'null' }]
    AccountStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AccountStatus' }
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    AccountConnection:
      type: object
      required: [contact, person, linkType, direction]
      properties:
        contact:
          $ref: '#/components/schemas/PersonRef'
          description: The account's contact.
        person: { $ref: '#/components/schemas/PersonSummary' }
        linkType: { $ref: '#/components/schemas/LinkType' }
        direction: { $ref: '#/components/schemas/LinkDirection' }
    # ---------- people ----------
    PersonSummary:
      type: object
      required: [id, name, type, owner, consentStatus, retentionStatus]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Elif Yıldırım] }
        title: { type: [string, 'null'], examples: [Finance Director] }
        company: { type: [string, 'null'], examples: [Marmara Holding] }
        type: { $ref: '#/components/schemas/PersonType' }
        city: { type: [string, 'null'], examples: [Ankara] }
        email: { type: [string, 'null'], format: email }
        owner: { $ref: '#/components/schemas/UserRef' }
        lastContactAt: { type: [string, 'null'], format: date-time }
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
        retentionStatus: { $ref: '#/components/schemas/RetentionStatus' }
        tags:
          type: array
          description: Since 1.2.0 (optional for 1.1.x servers). Lower-case; a tag can stand for a talent pool.
          items: { $ref: '#/components/schemas/Tag' }
        sourceChannel:
          oneOf: [{ $ref: '#/components/schemas/SourceChannel' }, { type: 'null' }]
          description: Since 1.2.0.
        shareable:
          type: boolean
          description: Since 1.2.0. May be shared with a client (consent GIVEN, not anonymised); from the copies on `person`, for badges only — the server guard decides.
        cvMatch:
          type: [string, 'null']
          maxLength: 300
          description: Since 1.2.0. Only with the `cv` filter — a short excerpt of the current CV around the match (`ts_headline`), match marked with `«` and `»`.
        archive:
          oneOf: [{ $ref: '#/components/schemas/ArchiveInfo' }, { type: 'null' }]
          description: Since 1.3.0. Null while not archived.
        skills:
          type: array
          description: Since 1.3.0. Lower-case skill keywords (same rules as tags, at most 30).
          items: { $ref: '#/components/schemas/Tag' }
        functionArea:
          oneOf: [{ $ref: '#/components/schemas/JobFunction' }, { type: 'null' }]
          description: Since 1.3.0.
        seniority:
          oneOf: [{ $ref: '#/components/schemas/Seniority' }, { type: 'null' }]
          description: Since 1.3.0.
    PersonSummaryPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/PersonSummary' }
        page: { $ref: '#/components/schemas/PageMeta' }
    Employment:
      type: object
      required: [company]
      properties:
        company: { type: string, maxLength: 200, description: 'Free text, the fallback when no organisation is linked; when `organisationId` is set the server stores the organisation''s name here.', examples: [Marmara Holding] }
        title: { type: [string, 'null'], maxLength: 200, examples: [Finance Director] }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date, description: '`null` = current' }
        organisationId:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
          description: Since 1.3.0 (R63). The employer organisation (an account); sets its EMPLOYER role. Unknown id → 400.
        organisation:
          oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }]
          readOnly: true
          description: Since 1.3.0. Response only.
    Person:
      allOf:
        - $ref: '#/components/schemas/PersonSummary'
        - $ref: '#/components/schemas/CandidateProfileFields'
        - type: object
          properties:
            currentCv:
              oneOf: [{ $ref: '#/components/schemas/PersonFile' }, { type: 'null' }]
              description: Since 1.2.0. The current CV, if any; all files via `GET /people/{id}/files`.
            compensationRestricted:
              type: boolean
              description: Since 1.2.0. True when `compensation` is hidden from the current user (not MANAGER/ADMIN and not the owner).
            offLimits:
              type: array
              description: Since 1.2.0. Active off-limits rules that match the person's current company (the pipeline guard uses the same match).
              items: { $ref: '#/components/schemas/OffLimitsRule' }
        - type: object
          required: [employments, anonymised, createdAt, updatedAt, version]
          properties:
            phone: { type: [string, 'null'], examples: ['+90 555 000 00 00'] }
            linkedinUrl: { type: [string, 'null'], format: uri, description: Profile URL entered by hand; no scraping. }
            howWeKnow: { type: [string, 'null'], examples: [Met at a CFO roundtable] }
            notes: { type: [string, 'null'] }
            employments:
              type: array
              description: Company history, most recent first.
              items: { $ref: '#/components/schemas/Employment' }
            anonymised: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            version: { $ref: '#/components/schemas/Version' }
    PersonCreateRequest:
      type: object
      required: [name, type]
      description: Since 1.2.0 also takes the candidate profile fields (`sourceChannel`, `noticePeriodDays`, `mobility`, `compensation`, `languages`, `educations`; see `CandidateProfileFields`).
      properties:
        sourceChannel: { oneOf: [{ $ref: '#/components/schemas/SourceChannel' }, { type: 'null' }] }
        noticePeriodDays: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        mobility: { oneOf: [{ $ref: '#/components/schemas/Mobility' }, { type: 'null' }] }
        compensation: { oneOf: [{ $ref: '#/components/schemas/Compensation' }, { type: 'null' }] }
        skills:
          type: array
          maxItems: 30
          description: Since 1.3.0. Replaces the whole list when sent; trimmed and lower-cased.
          items: { $ref: '#/components/schemas/Tag' }
        functionArea: { oneOf: [{ $ref: '#/components/schemas/JobFunction' }, { type: 'null' }] }
        seniority: { oneOf: [{ $ref: '#/components/schemas/Seniority' }, { type: 'null' }] }
        languages:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/LanguageSkill' }
        educations:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Education' }
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/PersonType' }
        title: { type: [string, 'null'], maxLength: 200 }
        company: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 50 }
        city: { type: [string, 'null'], maxLength: 100 }
        linkedinUrl: { type: [string, 'null'], format: uri, maxLength: 300 }
        howWeKnow: { type: [string, 'null'], maxLength: 1000 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        ownerId:
          $ref: '#/components/schemas/Id'
          description: Defaults to the current user.
        employments:
          type: array
          items: { $ref: '#/components/schemas/Employment' }
    PersonUpdateRequest:
      type: object
      description: Since 1.2.0 also takes the candidate profile fields; `languages` and `educations` replace the whole list when sent, `compensation` replaces the whole value (`null` clears it).
      properties:
        sourceChannel: { oneOf: [{ $ref: '#/components/schemas/SourceChannel' }, { type: 'null' }] }
        noticePeriodDays: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        mobility: { oneOf: [{ $ref: '#/components/schemas/Mobility' }, { type: 'null' }] }
        compensation: { oneOf: [{ $ref: '#/components/schemas/Compensation' }, { type: 'null' }] }
        skills:
          type: array
          maxItems: 30
          description: Since 1.3.0. Replaces the whole list when sent; trimmed and lower-cased.
          items: { $ref: '#/components/schemas/Tag' }
        functionArea: { oneOf: [{ $ref: '#/components/schemas/JobFunction' }, { type: 'null' }] }
        seniority: { oneOf: [{ $ref: '#/components/schemas/Seniority' }, { type: 'null' }] }
        languages:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/LanguageSkill' }
        educations:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Education' }
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/PersonType' }
        title: { type: [string, 'null'], maxLength: 200 }
        company: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 50 }
        city: { type: [string, 'null'], maxLength: 100 }
        linkedinUrl: { type: [string, 'null'], format: uri, maxLength: 300 }
        howWeKnow: { type: [string, 'null'], maxLength: 1000 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        ownerId: { $ref: '#/components/schemas/Id' }
        employments:
          type: array
          items: { $ref: '#/components/schemas/Employment' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- contacts ----------
    Contact:
      type: object
      required: [id, account, person, primary, active, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/AccountRef' }
        person: { $ref: '#/components/schemas/PersonSummary' }
        role: { type: [string, 'null'], examples: [HR Director] }
        primary: { type: boolean }
        endedOn: { type: [string, 'null'], format: date, description: Set when the contact was ended (DELETE). }
        active: { type: boolean, readOnly: true, description: 'True while `endedOn` is empty.' }
        createdAt: { type: string, format: date-time }
    ContactCreateRequest:
      type: object
      description: Exactly one of `personId` and `person`.
      properties:
        personId: { $ref: '#/components/schemas/Id' }
        person: { $ref: '#/components/schemas/PersonCreateRequest' }
        role: { type: [string, 'null'], maxLength: 200 }
        primary: { type: boolean, default: false }
    ContactUpdateRequest:
      type: object
      properties:
        role: { type: [string, 'null'], maxLength: 200 }
        primary: { type: boolean }
    # ---------- network links ----------
    LinkDirection:
      type: string
      description: Seen from the person whose links are listed. Symmetric types are always BOTH.
      enum: [OUTGOING, INCOMING, BOTH]
    NetworkLink:
      type: object
      required: [id, from, to, type, createdAt, createdBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        from: { $ref: '#/components/schemas/PersonRef' }
        to: { $ref: '#/components/schemas/PersonRef' }
        type: { $ref: '#/components/schemas/LinkType' }
        note: { type: [string, 'null'], examples: [Introduced at a dinner in 2024] }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
    NetworkLinkCreateRequest:
      type: object
      required: [fromPersonId, toPersonId, type]
      properties:
        fromPersonId: { $ref: '#/components/schemas/Id' }
        toPersonId: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/LinkType' }
        note: { type: [string, 'null'], maxLength: 1000 }
    NetworkLinkUpdateRequest:
      type: object
      properties:
        type: { $ref: '#/components/schemas/LinkType' }
        note: { type: [string, 'null'], maxLength: 1000 }
    PersonConnection:
      type: object
      required: [linkId, type, direction, person]
      properties:
        linkId: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/LinkType' }
        direction: { $ref: '#/components/schemas/LinkDirection' }
        person: { $ref: '#/components/schemas/PersonSummary' }
        note: { type: [string, 'null'] }
    # ---------- import ----------
    ImportRowError:
      type: object
      required: [row, message]
      properties:
        row: { type: integer, description: 1-based data row (header excluded), examples: [7] }
        column: { type: [string, 'null'], examples: [email] }
        message: { type: string, examples: [Not a valid e-mail address] }
    ImportJob:
      type: object
      required: [id, kind, status, fileName, totalRows, validRows, duplicateRows, importedRows, errors, createdAt, createdBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/ImportKind' }
        status: { $ref: '#/components/schemas/ImportStatus' }
        fileName: { type: string, examples: [accounts.csv] }
        totalRows: { type: integer, examples: [120] }
        validRows: { type: integer, examples: [115] }
        duplicateRows: { type: integer, description: Rows matching an existing record; skipped., examples: [3] }
        importedRows: { type: integer, examples: [0] }
        errors:
          type: array
          description: First 500 row errors.
          items: { $ref: '#/components/schemas/ImportRowError' }
        failureReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        completedAt: { type: [string, 'null'], format: date-time }
        mapping:
          type: [object, 'null']
          description: Since 1.3.0. The column mapping sent with the upload.
          additionalProperties: { type: string }
        rollbackUntil:
          type: [string, 'null']
          format: date-time
          description: Since 1.3.0. COMPLETED imports can be rolled back until `completedAt` + 30 days.
        rolledBackAt: { type: [string, 'null'], format: date-time, description: Since 1.3.0. }
    ImportJobPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ImportJob' }
        page: { $ref: '#/components/schemas/PageMeta' }
    # ---------- search ----------
    SearchResults:
      type: object
      required: [query, accounts, people, jobOrders, totals]
      properties:
        query: { type: string, examples: [ozturk] }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        people:
          type: array
          items: { $ref: '#/components/schemas/PersonSummary' }
        jobOrders:
          type: array
          items: { $ref: '#/components/schemas/JobOrder' }
        totals:
          type: object
          required: [accounts, people, jobOrders]
          properties:
            accounts: { type: integer }
            people: { type: integer }
            jobOrders: { type: integer }
    # ---------- job orders and pipeline ----------
    StageCounts:
      type: object
      description: Applications per stage; every stage present.
      required: [SOURCED, SCREENED, PRESENTED, CLIENT_INTERVIEW, OFFER, PLACED, REJECTED]
      properties:
        SOURCED: { type: integer, examples: [3] }
        SCREENED: { type: integer, examples: [2] }
        PRESENTED: { type: integer, examples: [1] }
        CLIENT_INTERVIEW: { type: integer, examples: [1] }
        OFFER: { type: integer, examples: [0] }
        PLACED: { type: integer, examples: [0] }
        REJECTED: { type: integer, examples: [2] }
    JobOrder:
      type: object
      required: [id, account, title, status, owner, openedOn, daysOpen, activeCandidates, stageCounts, statusChangedAt, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/AccountRef' }
        title: { type: string, examples: [Chief Financial Officer] }
        location: { type: [string, 'null'], examples: [İstanbul] }
        seniority: { type: [string, 'null'], examples: [C-level] }
        description: { type: [string, 'null'] }
        feeTerms: { type: [string, 'null'], examples: ['33% of first-year salary, retained'] }
        openings: { type: integer, minimum: 1, default: 1, description: Number of positions to fill. }
        status: { $ref: '#/components/schemas/JobOrderStatus' }
        statusChangedAt: { type: string, format: date-time }
        owner: { $ref: '#/components/schemas/UserRef' }
        openedOn: { type: string, format: date }
        closedOn: { type: [string, 'null'], format: date, description: Set on FILLED or CANCELLED. }
        daysOpen: { type: integer, description: From openedOn to closedOn or today., examples: [21] }
        activeCandidates: { type: integer, description: Applications not PLACED or REJECTED., examples: [7] }
        stageCounts: { $ref: '#/components/schemas/StageCounts' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
        archive:
          oneOf: [{ $ref: '#/components/schemas/ArchiveInfo' }, { type: 'null' }]
          description: Since 1.3.0. Null while not archived.
        confidentialityLevel:
          $ref: '#/components/schemas/ConfidentialityLevel'
          description: Since 1.3.0. Stored and shown as a badge; list visibility rules follow in a later contract (ADR 0013).
    JobOrderPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/JobOrder' }
        page: { $ref: '#/components/schemas/PageMeta' }
    JobOrderCreateRequest:
      type: object
      required: [accountId, title]
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        title: { type: string, minLength: 1, maxLength: 200 }
        location: { type: [string, 'null'], maxLength: 200 }
        seniority: { type: [string, 'null'], maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 10000 }
        feeTerms: { type: [string, 'null'], maxLength: 2000 }
        openings: { type: integer, minimum: 1, default: 1 }
        openedOn: { type: string, format: date, description: Defaults to today. }
        ownerId:
          $ref: '#/components/schemas/Id'
          description: Defaults to the current user.
        confidentialityLevel:
          $ref: '#/components/schemas/ConfidentialityLevel'
          description: Since 1.3.0. Defaults to the account's level.
    JobOrderUpdateRequest:
      type: object
      properties:
        confidentialityLevel: { $ref: '#/components/schemas/ConfidentialityLevel' }
        title: { type: string, minLength: 1, maxLength: 200 }
        location: { type: [string, 'null'], maxLength: 200 }
        seniority: { type: [string, 'null'], maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 10000 }
        feeTerms: { type: [string, 'null'], maxLength: 2000 }
        openings: { type: integer, minimum: 1 }
        openedOn: { type: string, format: date }
        ownerId: { $ref: '#/components/schemas/Id' }
        version: { $ref: '#/components/schemas/Version' }
    JobOrderStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/JobOrderStatus' }
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    Application:
      type: object
      required: [id, jobOrder, account, person, stage, stageChangedAt, addedAt, addedBy, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        jobOrder: { $ref: '#/components/schemas/JobOrderRef' }
        account: { $ref: '#/components/schemas/AccountRef' }
        person: { $ref: '#/components/schemas/PersonSummary' }
        stage: { $ref: '#/components/schemas/PipelineStage' }
        rejectionReason: { type: [string, 'null'], description: Set while the stage is REJECTED. }
        closeReason:
          oneOf: [{ $ref: '#/components/schemas/CloseReason' }, { type: 'null' }]
          description: Since 1.3.0 (R65). Set while the stage is REJECTED (1.2 rejections are backfilled as OTHER).
        stageChangedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time }
        addedBy: { $ref: '#/components/schemas/UserRef' }
        version: { $ref: '#/components/schemas/Version' }
        offLimitsOverrideReason:
          type: [string, 'null']
          description: Since 1.2.0. Set when a manager added the person despite an off-limits rule.
        warnings:
          type: array
          description: Since 1.2.0. Only in the responses of `POST /job-orders/{id}/applications` and `PATCH /applications/{id}/stage`; non-blocking.
          items: { $ref: '#/components/schemas/PipelineWarning' }
        list:
          oneOf: [{ $ref: '#/components/schemas/CandidateList' }, { type: 'null' }]
          description: Since 1.3.0. Derived from `stage` (`PipelineStage.candidateList()`); null when REJECTED.
        rank:
          type: [integer, 'null']
          minimum: 1
          description: |
            Since 1.3.0. Position on its list, unique and gapless per job order and list among the **ranked** applications:
            the active ones (`PipelineStage.isActive()`). PLACED applications are on the SHORTLIST (`list` = SHORTLIST)
            but unranked (`rank` null) and are listed after the ranked ones; REJECTED ones are on no list.
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5, description: 'Since 1.3.0. 1 reject, 3 maybe, 5 outstanding.' }
        rationale: { type: [string, 'null'], maxLength: 2000, description: Since 1.3.0. Why this person is on the list; internal unless put in a report. }
        outreachStatus:
          $ref: '#/components/schemas/OutreachStatus'
          description: Since 1.3.0. Longlist call status (SX-013); default TO_CALL.
        latestClientFeedback:
          oneOf: [{ $ref: '#/components/schemas/ClientFeedback' }, { type: 'null' }]
          description: Since 1.3.0. The newest feedback round, if any.
    ApplicationCreateRequest:
      type: object
      required: [personId]
      properties:
        personId: { $ref: '#/components/schemas/Id' }
        offLimitsOverrideReason:
          $ref: '#/components/schemas/Reason'
          description: Since 1.2.0. MANAGER/ADMIN only (403 for consultants); adds the person despite matching off-limits rules.
    StageChangeRequest:
      type: object
      required: [stage]
      properties:
        stage: { $ref: '#/components/schemas/PipelineStage' }
        reason: { $ref: '#/components/schemas/Reason' }
        closeReason:
          $ref: '#/components/schemas/CloseReason'
          description: Since 1.3.0 (R65). Only with `stage` REJECTED (400 otherwise); default OTHER. `reason` stays required for REJECTED.
        version: { $ref: '#/components/schemas/Version' }
        offLimitsOverrideReason:
          $ref: '#/components/schemas/Reason'
          description: |
            Since 1.2.0. Same semantics as on `ApplicationCreateRequest`: MANAGER/ADMIN only (403 for
            consultants), 3 to 500 characters, stored on the application (`offLimitsOverrideReason`,
            audited by Envers). Only lifts the off-limits check on the first move into a client-facing
            stage (e.g. a rule created after the person was added); ignored when the application already
            has an override. It never lifts `CONSENT_REQUIRED`, which cannot be overridden.
        rating:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: Since 1.3.0. Saved on the application with the move (needed to enter the shortlist).
        rationale:
          type: [string, 'null']
          maxLength: 2000
          description: Since 1.3.0. Saved with the move; at least 20 characters to enter the shortlist.
    Proposal:
      type: object
      required: [id, account, title, status, statusChangedAt, owner, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/AccountRef' }
        title: { type: string, examples: [Executive search — CFO] }
        terms: { type: [string, 'null'], examples: ['Retainer in three instalments, 90-day guarantee'] }
        feeAmount: { type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$', description: Decimal as string to avoid rounding., examples: ['450000.00'] }
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$', examples: [TRY] }
        status: { $ref: '#/components/schemas/ProposalStatus' }
        statusChangedAt: { type: string, format: date-time }
        statusReason: { type: [string, 'null'], description: Reason of the last status change (e.g. why rejected). }
        sentOn: { type: [string, 'null'], format: date }
        decidedOn: { type: [string, 'null'], format: date, description: Set on ACCEPTED or REJECTED. }
        owner: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    ProposalPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Proposal' }
        page: { $ref: '#/components/schemas/PageMeta' }
    ProposalCreateRequest:
      type: object
      required: [accountId, title]
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        title: { type: string, minLength: 1, maxLength: 200 }
        terms: { type: [string, 'null'], maxLength: 10000 }
        feeAmount: { type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$' }
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        ownerId: { $ref: '#/components/schemas/Id' }
    ProposalUpdateRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        terms: { type: [string, 'null'], maxLength: 10000 }
        feeAmount: { type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$' }
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        ownerId: { $ref: '#/components/schemas/Id' }
        version: { $ref: '#/components/schemas/Version' }
    ProposalStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ProposalStatus' }
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- activities and next actions ----------
    Activity:
      type: object
      required: [id, type, note, occurredAt, user, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/ActivityType' }
        note: { type: string, examples: [Discussed the CFO search timeline.] }
        occurredAt: { type: string, format: date-time }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        person: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        jobOrder: { oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }] }
        user: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
        outcome:
          oneOf: [{ $ref: '#/components/schemas/ActivityOutcome' }, { type: 'null' }]
          description: Since 1.3.0 (R70).
        direction:
          oneOf: [{ $ref: '#/components/schemas/ActivityDirection' }, { type: 'null' }]
          description: Since 1.3.0. Null for NOTE.
        attendees:
          type: array
          description: Since 1.3.0. Other people present (not the main `person`).
          items: { $ref: '#/components/schemas/PersonRef' }
        durationMin: { type: [integer, 'null'], minimum: 0, maximum: 1440, description: Since 1.3.0. }
        source:
          $ref: '#/components/schemas/ActivitySource'
          description: Since 1.3.0. MANUAL for 1.2 rows.
        externalMessageId: { type: [string, 'null'], description: 'Since 1.3.0. E-mail `Message-ID` when `source` is EMAIL.' }
    ActivityPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        page: { $ref: '#/components/schemas/PageMeta' }
    ActivityCreateRequest:
      type: object
      required: [type, note]
      description: At least one of `accountId` and `personId`.
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        note: { type: string, minLength: 1, maxLength: 4000 }
        occurredAt: { type: string, format: date-time, description: Defaults to now; may not be in the future. }
        accountId: { $ref: '#/components/schemas/Id' }
        personId: { $ref: '#/components/schemas/Id' }
        jobOrderId: { $ref: '#/components/schemas/Id' }
        outcome: { $ref: '#/components/schemas/ActivityOutcome' }
        direction:
          $ref: '#/components/schemas/ActivityDirection'
          description: Since 1.3.0. Not with NOTE (400).
        attendeePersonIds:
          type: array
          maxItems: 20
          uniqueItems: true
          description: Since 1.3.0 (R70). Other people present; not `personId`, not anonymised people (400).
          items: { $ref: '#/components/schemas/Id' }
        durationMin: { type: integer, minimum: 0, maximum: 1440 }
        source:
          $ref: '#/components/schemas/ActivitySource'
          description: Since 1.3.0. Default MANUAL.
        externalMessageId:
          type: string
          minLength: 1
          maxLength: 300
          description: Since 1.3.0. Only with `source` EMAIL (400 otherwise). Unique; a second activity with the same id gives 409 `DUPLICATE` with `existingId` (idempotent capture).
    ActivityUpdateRequest:
      type: object
      description: Since 1.3.0 `attendeePersonIds` replaces the whole attendee list; `source` and `externalMessageId` cannot change.
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        note: { type: string, minLength: 1, maxLength: 4000 }
        occurredAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
        outcome:
          oneOf: [{ $ref: '#/components/schemas/ActivityOutcome' }, { type: 'null' }]
        direction:
          oneOf: [{ $ref: '#/components/schemas/ActivityDirection' }, { type: 'null' }]
        attendeePersonIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
        durationMin: { type: [integer, 'null'], minimum: 0, maximum: 1440 }
    NextAction:
