  /people/{id}/consent/requests:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Consent]
      operationId: sendConsentRequest
      summary: Send (or resend) the KVKK information notice and consent request e-mail (S-01)
      description: |
        Queues one e-mail with the current notice for the chosen language and a one-time link
        (valid 30 days). This is an action, not a status transition: the status moves to SENT from NOT_SENT, REFUSED or WITHDRAWN, and when it is already SENT the e-mail is re-sent and the status stays SENT. Not allowed (409 `STATE_CONFLICT`) when GIVEN. The person needs an e-mail
        address (else 409 `STATE_CONFLICT`). Delivery is asynchronous: watch `deliveryStatus`.

        Since 1.2.0 (ADR 0011): this is also the **one-click resend** of the sharing guard (409
        `CONSENT_REQUIRED`). `purpose: RENEWAL` sends the renewal e-mail and is allowed only while the
        status is GIVEN (otherwise 409 `STATE_CONFLICT`); the status stays GIVEN, and a GIVEN answer
        restarts the retention clock (`RetentionRenewed`). Without `purpose`, INITIAL is used. The
        nightly job sends RENEWAL requests itself at `renewalReminderDays` (default 60 and 14 days)
        before `retainUntil`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: privacy / security-privacy
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequestCreateRequest' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
