        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Commercial]
      operationId: createAgreement
      summary: Record a fee agreement with its fee schedule (PB-007/008/009)
      description: |
        `jobOrderId` null = the account's framework terms (kind TERMS_OF_BUSINESS); set = the engagement
        for that search (ENGAGEMENT_LETTER; its schedule items are the ones that become due and are
        invoiced). Rules (400 `VALIDATION_FAILED`): FLAT_FEE needs `flatFeeAmount`; percent models need
        `feePercent` (0-100) and at least one `feeBasis` component; `feeMinimum <= feeCap`; each schedule
        item has exactly one of `percent` and `amount`; DATE_OFFSET items need `offsetDays`; for
        RETAINED_THIRDS the item percents sum to 100. `billingAccountId` defaults to the account (a group
        parent may pay). The job order must belong to the account (400). Archived account or job order →
        409 `ARCHIVED`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
