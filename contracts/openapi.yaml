      description: |
        Criteria: items with an `id` are updated, items without one are created, criteria not in the list
        are marked removed (`removedAt`; kept because evaluations score them, SX-017). `briefVersion` goes
        up by one when the criteria, compensation band or timeline change (the history is in Envers).
        `compMin <= compMax` and `compCurrency` required with either (400). Missing fields never block a
        stage or status change (SX-001: warning only, shown by the UI from `missingFields`). Archived job
        order → 409 `ARCHIVED`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchBriefRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchBrief' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
