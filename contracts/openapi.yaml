        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  # ---------- 1.3.0: import rollback, exports, client reports (ADR 0013) ----------
  /imports/{id}/rollback:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Import]
      operationId: rollbackImport
      summary: Undo a completed import within 30 days (CO-014)
      description: |
        Archives every account and person the import created (reason IMPORT_ROLLBACK; records listed in
        `import_job_record`) and ends every contact it created. Records changed since the import stay
        archived too; records that are now on a job order, have activities or are anonymised are skipped
        and counted in `skipped` (the user decides by hand). Status ROLLED_BACK. Not COMPLETED or past
        `rollbackUntil` → 409 `STATE_CONFLICT`.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRollbackRequest' }
      responses:
        '200':
          description: Rolled back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRollbackResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /exports:
    get:
      tags: [Exports]
      operationId: listExports
      summary: My exports; for MANAGER/ADMIN every export (approval queue with `status=PENDING_APPROVAL`)
      description: |
        Sortable: `requestedAt` (default `requestedAt,desc`), `status`, `rowCount`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: security / security-privacy
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/ExportStatus' }
          style: form
          explode: true
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of exports, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJobPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Exports]
      operationId: requestExport
      summary: Export a list view as CSV, with audit and approval (CO-013)
      description: |
        `filters` and `columns` are a `ViewDefinition` of the entity (same validation). The server counts
        the rows: up to the approval threshold (default 25 people or accounts, setting
        `app.exports.approval-threshold`; job orders have none) or when the caller is
        MANAGER/ADMIN, the file is built at once (READY); otherwise PENDING_APPROVAL until a manager
        approves. `includeCompensation` is MANAGER/ADMIN only (403) and PEOPLE only. Every export writes
        an access-log EXPORT row per exported person (entity PERSON) and one EXPORT row for the job
        (entity EXPORT_JOB) with filter keys, row count, columns and purpose. The CSV starts with a
        watermark line (user, date, purpose) and expires 24 hours after it is ready. Exports of a client
        report or a person's KVKK export are not done here. `entity` PROPOSALS gives 400
        `VALIDATION_FAILED` (proposal exports are cut from 1.3; R7/R75 move proposals to opportunities).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: security / security-privacy (job, approval, audit); `ExportSource` beans in accounts (PEOPLE, ACCOUNTS) and pipeline (JOB_ORDERS)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '201':
          description: READY or PENDING_APPROVAL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
