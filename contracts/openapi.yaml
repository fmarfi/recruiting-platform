    post:
      tags: [Consent]
      operationId: recordConsentDecision
      summary: Record a decision collected in person, by phone or from the old system
      description: Stores text version, timestamp, channel and evidence (NFR-02). Records are append-only; a withdrawal is a new record.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
