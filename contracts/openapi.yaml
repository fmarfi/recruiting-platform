      description: |
        Either `personId` (attach as the person's new current CV) or `person` (create, exactly like
        `POST /people`, then attach). The file becomes a `person_file` (kind CV) and the item ATTACHED;
        its text and detected values are removed from the intake row. Publishes `PersonCreated` (new
        person) and `PersonFileUploaded`, so the consent e-mail rule of `POST /people/{id}/files`
        applies. A new person whose e-mail exists gives 409 `DUPLICATE` with `existingId` (attach to that
        person instead). Not PENDING gives 409 `STATE_CONFLICT`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
