          type: array
          items: { $ref: '#/components/schemas/FieldChange' }
    RevisionPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Revision' }
        page: { $ref: '#/components/schemas/PageMeta' }
    # ---------- saved views (1.1.0, ADR 0010) ----------
    ListEntity:
      type: string
      description: The grid a saved view or a bulk action belongs to (`contracts/enums/ListEntity.java`).
      enum: [PEOPLE, ACCOUNTS, JOB_ORDERS, PROPOSALS]
    ViewVisibility:
      type: string
      description: PRIVATE is seen only by its owner; SHARED by every user (`contracts/enums/ViewVisibility.java`).
      enum: [PRIVATE, SHARED]
    FilterValue:
      description: One filter value, or several (OR) as an array.
      oneOf:
        - { type: string, maxLength: 200 }
        - { type: number }
        - { type: boolean }
        - type: array
          maxItems: 50
          items:
            oneOf:
              - { type: string, maxLength: 200 }
              - { type: number }
              - { type: boolean }
        - { type: 'null' }
    ViewDefinition:
      type: object
      description: |
        What a grid shows. The client turns `filters` and `sort` into the query of the matching list
        endpoint (`GET /people`, `/accounts`, `/job-orders`, `/proposals`), so the allowed filter keys are
        that endpoint's query parameters except `page`, `size` and `sort`:
        - PEOPLE: `q`, `type`, `ownerId`, `consentStatus`, `lastContactBefore`, `lastContactAfter`, `city`,
          `company` (since 1.1.1), `tag`, `sourceChannel`, `cv`, `shareable` (since 1.2.0). A saved search
          is a PEOPLE view; a talent pool is a tag plus a SHARED view with `tag` (ADR 0011). Since 1.3.0
          also `archived`, `skill`, `functionArea`, `seniority`, `language`, `noticeMaxDays`, `mobility`,
          `hasCv`; the salary filters are never stored in SHARED views (they would expose pay ranges).
        - ACCOUNTS: `q`, `status`, `sector`, `ownerId`; since 1.3.0 `archived`, `parentAccountId`
        - JOB_ORDERS: `q`, `accountId`, `status`, `open`, `ownerId`; since 1.3.0 `archived`
        - PROPOSALS: `accountId`, `status`, `ownerId`
        Values are validated like the query parameters (enum names, UUIDs, dates). `ownerId` may also be
        `"me"`, which the client replaces with the current user's id when it runs the view (so one shared
        "My accounts" view works for everybody). The server rejects unknown keys and bad values with 400
        `VALIDATION_FAILED` (`field = definition.filters.<key>`). `columns`, `sort` and `groupBy` use the
        property names of the list item schema; unknown names give 400 as well.
      required: [filters, columns, sort]
      properties:
        filters:
          type: object
          maxProperties: 20
          propertyNames: { pattern: '^[A-Za-z][A-Za-z0-9]{0,49}$' }
          additionalProperties: { $ref: '#/components/schemas/FilterValue' }
          examples: [{ status: [ACTIVE, ON_HOLD], ownerId: me }]
        columns:
          type: array
          description: Visible columns in display order.
          maxItems: 50
          items: { type: string, pattern: '^[A-Za-z][A-Za-z0-9.]{0,99}$' }
          examples: [[name, status, sector, owner, lastActivityAt]]
        sort:
          type: array
          description: '`property,asc|desc`, like the `sort` query parameter; first key wins.'
          maxItems: 5
          items: { type: string, pattern: '^[A-Za-z]+(,(asc|desc))?$' }
          examples: [['lastActivityAt,desc']]
        groupBy:
          type: [string, 'null']
          pattern: '^[A-Za-z][A-Za-z0-9.]{0,99}$'
          description: Property to group rows by, or null.
          examples: [sector]
    SavedView:
      type: object
      required: [id, entity, name, visibility, owner, definition, editable, createdAt, updatedAt, version]
      examples:
        - id: 0192a5b8-0000-7000-8000-00000000c001
          entity: ACCOUNTS
          name: My active accounts by sector
          visibility: SHARED
          owner: { id: 0192a5b8-6f1e-7c3a-9b2d-3f4e5a6b7c8d, name: Deniz Aksoy }
          definition:
            filters: { status: [ACTIVE, ON_HOLD], ownerId: me }
            columns: [name, status, sector, owner, lastActivityAt]
            sort: ['lastActivityAt,desc']
            groupBy: sector
          editable: true
          createdAt: '2026-10-20T09:30:00Z'
          updatedAt: '2026-10-21T14:05:00Z'
          version: 2
      properties:
        id: { $ref: '#/components/schemas/Id' }
        entity: { $ref: '#/components/schemas/ListEntity' }
        name: { type: string, examples: [Active accounts in Izmir] }
        visibility: { $ref: '#/components/schemas/ViewVisibility' }
        owner: { $ref: '#/components/schemas/UserRef' }
        definition: { $ref: '#/components/schemas/ViewDefinition' }
        editable: { type: boolean, description: Whether the current user may change or delete this view. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    SavedViewCreateRequest:
      type: object
      required: [entity, name, definition]
      properties:
        entity: { $ref: '#/components/schemas/ListEntity' }
        name: { type: string, minLength: 1, maxLength: 120 }
        visibility:
          $ref: '#/components/schemas/ViewVisibility'
          description: Defaults to PRIVATE. SHARED is MANAGER/ADMIN only (ASSUMPTION).
        definition: { $ref: '#/components/schemas/ViewDefinition' }
    SavedViewUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        visibility: { $ref: '#/components/schemas/ViewVisibility' }
        definition: { $ref: '#/components/schemas/ViewDefinition' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- bulk actions (1.1.0, ADR 0010) ----------
    BulkActionType:
      type: string
      description: '`contracts/enums/BulkActionType.java`'
      enum: [REASSIGN_OWNER, CHANGE_STATUS, ADD_TAG, REMOVE_TAG, SET_NEXT_ACTION, REQUEST_CONSENT]
    BulkOutcome:
      type: string
      description: OK = done; SKIPPED = nothing done on purpose (no change needed, consent gate); FAILED = could not be done (`contracts/enums/BulkOutcome.java`).
      enum: [OK, SKIPPED, FAILED]
    BulkResultCode:
      type: string
      description: Why a record was SKIPPED or FAILED (`contracts/enums/BulkResultCode.java`).
      enum: [NO_CHANGE, NOT_FOUND, FORBIDDEN, ILLEGAL_TRANSITION, TRANSITION_GUARD_FAILED, REASON_REQUIRED, STATE_CONFLICT, VERSION_CONFLICT, NO_EMAIL, CONSENT_GIVEN, CONSENT_REFUSED, CONSENT_WITHDRAWN, REQUEST_PENDING, ANONYMISED, NO_CONSENT_BASIS, TOO_MANY_TAGS, INTERNAL_ERROR]
    Tag:
      type: string
      description: Trimmed, stored lower-case, 1 to 50 characters; at most 20 tags per record. No personal data in tags.
      minLength: 1
      maxLength: 50
      pattern: '^\S(.*\S)?$'
      examples: [cfo-network]
    ReassignOwnerParams:
      type: object
      additionalProperties: false
      required: [ownerId]
      properties:
        ownerId: { $ref: '#/components/schemas/Id' }
    ChangeStatusParams:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          description: Target status from the entity's lifecycle (`AccountStatus`, `JobOrderStatus` or `ProposalStatus`); another value gives 400.
          examples: [ON_HOLD]
        reason:
          $ref: '#/components/schemas/Reason'
          description: Stored on each record's status change (timeline, Envers) like a single move; never stored in the bulk audit row (1.1.1).
    TagParams:
      type: object
      additionalProperties: false
      required: [tag]
      properties:
        tag: { $ref: '#/components/schemas/Tag' }
    SetNextActionParams:
      type: object
      additionalProperties: false
      required: [title, dueOn]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Written to each created next action (scrubbed there on anonymisation); never stored in the bulk audit row (1.1.1).
        dueOn: { type: string, format: date }
        ownerId:
          $ref: '#/components/schemas/Id'
          description: Defaults to the current user.
    RequestConsentParams:
      type: object
      additionalProperties: false
      properties:
        language:
          $ref: '#/components/schemas/Language'
          description: Defaults to TR.
    BulkActionTarget:
      type: object
      required: [entity, ids]
      properties:
        entity: { $ref: '#/components/schemas/ListEntity' }
        ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
    BulkActionRequest:
      description: One action with its typed `params`, chosen by `action`.
      oneOf:
        - $ref: '#/components/schemas/ReassignOwnerBulkRequest'
        - $ref: '#/components/schemas/ChangeStatusBulkRequest'
        - $ref: '#/components/schemas/AddTagBulkRequest'
        - $ref: '#/components/schemas/RemoveTagBulkRequest'
        - $ref: '#/components/schemas/SetNextActionBulkRequest'
        - $ref: '#/components/schemas/RequestConsentBulkRequest'
      discriminator:
        propertyName: action
        mapping:
          REASSIGN_OWNER: '#/components/schemas/ReassignOwnerBulkRequest'
          CHANGE_STATUS: '#/components/schemas/ChangeStatusBulkRequest'
          ADD_TAG: '#/components/schemas/AddTagBulkRequest'
          REMOVE_TAG: '#/components/schemas/RemoveTagBulkRequest'
          SET_NEXT_ACTION: '#/components/schemas/SetNextActionBulkRequest'
          REQUEST_CONSENT: '#/components/schemas/RequestConsentBulkRequest'
    ReassignOwnerBulkRequest:
      allOf:
        - $ref: '#/components/schemas/BulkActionTarget'
        - type: object
          required: [action, params]
          properties:
            action: { type: string, const: REASSIGN_OWNER }
            params: { $ref: '#/components/schemas/ReassignOwnerParams' }
    ChangeStatusBulkRequest:
      allOf:
        - $ref: '#/components/schemas/BulkActionTarget'
        - type: object
          required: [action, params]
          properties:
            action: { type: string, const: CHANGE_STATUS }
            params: { $ref: '#/components/schemas/ChangeStatusParams' }
    AddTagBulkRequest:
      allOf:
        - $ref: '#/components/schemas/BulkActionTarget'
        - type: object
          required: [action, params]
          properties:
            action: { type: string, const: ADD_TAG }
            params: { $ref: '#/components/schemas/TagParams' }
    RemoveTagBulkRequest:
      allOf:
        - $ref: '#/components/schemas/BulkActionTarget'
        - type: object
          required: [action, params]
          properties:
            action: { type: string, const: REMOVE_TAG }
            params: { $ref: '#/components/schemas/TagParams' }
    SetNextActionBulkRequest:
      allOf:
        - $ref: '#/components/schemas/BulkActionTarget'
        - type: object
          required: [action, params]
          properties:
            action: { type: string, const: SET_NEXT_ACTION }
            params: { $ref: '#/components/schemas/SetNextActionParams' }
    RequestConsentBulkRequest:
      allOf:
        - $ref: '#/components/schemas/BulkActionTarget'
        - type: object
          required: [action, params]
          properties:
            action: { type: string, const: REQUEST_CONSENT }
            params: { $ref: '#/components/schemas/RequestConsentParams' }
    BulkRecordResult:
      type: object
      required: [id, outcome, code, message]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        outcome: { $ref: '#/components/schemas/BulkOutcome' }
        code:
          oneOf: [{ $ref: '#/components/schemas/BulkResultCode' }, { type: 'null' }]
          description: Null when OK; always set when SKIPPED or FAILED.
        message:
          type: [string, 'null']
          description: |
            Null when OK; otherwise exactly `BulkResultCode.message()`, the one fixed English text of the
            code (the UI translates `code`). Never a name, e-mail, record value or exception message, and
            not stored: the audit row keeps the code only (since 1.1.1, ADR 0010).
    BulkActionResult:
      type: object
      required: [id, entity, action, requested, ok, skipped, failed, results]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: The `bulk_action` audit row.
        entity: { $ref: '#/components/schemas/ListEntity' }
        action: { $ref: '#/components/schemas/BulkActionType' }
        requested: { type: integer, examples: [3] }
        ok: { type: integer, examples: [1] }
        skipped: { type: integer, examples: [2] }
        failed: { type: integer, examples: [0] }
        results:
          type: array
          description: One entry per requested id, in request order.
          items: { $ref: '#/components/schemas/BulkRecordResult' }
    # ---------- candidate pool and consent engine (1.2.0, ADR 0011) ----------
    SourceChannel:
      type: string
      description: How the candidate reached the firm (B-03, `contracts/enums/SourceChannel.java`).
      enum: [LINKEDIN_AD, LINKEDIN_DIRECT, WEBSITE, REFERRAL, EXISTING_POOL, EMAIL, CV_UPLOAD]
    Mobility:
      type: string
      enum: [NONE, WITHIN_COUNTRY, INTERNATIONAL]
    CompensationPeriod:
      type: string
      enum: [MONTHLY, ANNUAL]
    SalaryBasis:
      type: string
      enum: [GROSS, NET]
    LanguageLevel:
      type: string
      enum: [BASIC, INTERMEDIATE, FLUENT, NATIVE]
    PersonFileKind:
      type: string
      enum: [CV, DOCUMENT]
    TextExtractionStatus:
      type: string
      description: Tika text extraction (no AI, no OCR), `contracts/enums/TextExtractionStatus.java`.
      enum: [PENDING, DONE, NO_TEXT, FAILED]
    CvIntakeStatus:
      type: string
      enum: [PENDING, ATTACHED, DISCARDED]
    DuplicateMatchReason:
      type: string
      enum: [EMAIL, PHONE, LINKEDIN_URL, NAME_COMPANY]
    DuplicateStatus:
      type: string
      enum: [OPEN, MERGED, DISMISSED]
    ConsentRequestPurpose:
      type: string
      enum: [INITIAL, RENEWAL]
    ShareBlockReason:
      type: string
      description: Why a person may not be shared with a client (`contracts/enums/ShareBlockReason.java`).
      enum: [CONSENT_NOT_REQUESTED, CONSENT_PENDING, CONSENT_REFUSED, CONSENT_WITHDRAWN, ANONYMISED]
    ExposureChannel:
      type: string
      description: PIPELINE now; REPORT and SHARE_LINK are reserved for Wave 2d.
      enum: [PIPELINE, REPORT, SHARE_LINK]
    OffLimitsReason:
      type: string
      enum: [CLIENT_AGREEMENT, GUARANTEE_PERIOD, CLIENT_REQUEST, OTHER]
    PipelineWarningCode:
      type: string
      enum: [PREVIOUSLY_PRESENTED_TO_ACCOUNT, ACTIVE_IN_OTHER_PROCESS, SHORTLIST_LONG]
    Compensation:
      type: object
      description: |
        Stored encrypted as one value (field-level encryption, AES-256-GCM, key outside the database;
        ADR 0011), so it cannot be filtered or sorted. Amounts are in `currency` per `period`.
        **Who may read it:** only MANAGER/ADMIN and the person's relationship owner. For other users
        `GET /people/{id}` returns `compensation: null` and `compensationRestricted: true`, and they
        cannot write it (403 if sent). It is never in lists, search, exports to clients or events. Every
        read goes with the VIEW access-log entry of `GET /people/{id}`; the DSR export includes it.
      required: [currency, period, basis]
      properties:
        currentBase: { type: [number, 'null'], minimum: 0, examples: [250000] }
        currentVariable: { type: [number, 'null'], minimum: 0, description: Bonus and other variable pay per period. }
        expected: { type: [number, 'null'], minimum: 0, examples: [300000] }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: ISO 4217, examples: [TRY] }
        period: { $ref: '#/components/schemas/CompensationPeriod' }
        basis: { $ref: '#/components/schemas/SalaryBasis' }
        benefits: { type: [string, 'null'], maxLength: 500, examples: ['Car, private health insurance'] }
        updatedOn: { type: [string, 'null'], format: date, description: When the candidate gave these figures. }
    LanguageSkill:
      type: object
      required: [language, level]
      properties:
        language: { type: string, pattern: '^[a-z]{2}$', description: ISO 639-1 code, examples: [en] }
        level: { $ref: '#/components/schemas/LanguageLevel' }
    Education:
      type: object
      required: [school]
      properties:
        school: { type: string, minLength: 1, maxLength: 200, examples: [Boğaziçi Üniversitesi] }
        degree: { type: [string, 'null'], maxLength: 100, examples: [MBA] }
        field: { type: [string, 'null'], maxLength: 200, examples: [Finance] }
        startYear: { type: [integer, 'null'], minimum: 1940, maximum: 2100 }
        endYear: { type: [integer, 'null'], minimum: 1940, maximum: 2100, description: '`null` = ongoing' }
    CandidateProfileFields:
      type: object
      description: Candidate profile fields on the person (1.2.0). All optional; any person type may have them.
      properties:
        sourceChannel: { oneOf: [{ $ref: '#/components/schemas/SourceChannel' }, { type: 'null' }] }
        noticePeriodDays: { type: [integer, 'null'], minimum: 0, maximum: 365, examples: [60] }
        mobility: { oneOf: [{ $ref: '#/components/schemas/Mobility' }, { type: 'null' }] }
        compensation: { oneOf: [{ $ref: '#/components/schemas/Compensation' }, { type: 'null' }] }
        skills:
          type: array
          maxItems: 30
          description: Since 1.3.0. Replaces the whole list when sent; trimmed and lower-cased.
          items: { $ref: '#/components/schemas/Tag' }
        functionArea: { oneOf: [{ $ref: '#/components/schemas/JobFunction' }, { type: 'null' }] }
        seniority: { oneOf: [{ $ref: '#/components/schemas/Seniority' }, { type: 'null' }] }
        languages:
          type: array
          maxItems: 20
          description: Replaces the whole list when sent.
          items: { $ref: '#/components/schemas/LanguageSkill' }
        educations:
          type: array
          maxItems: 20
          description: Most recent first; replaces the whole list when sent (like `employments`).
          items: { $ref: '#/components/schemas/Education' }
    PersonFile:
      type: object
      required: [id, personId, kind, version, current, fileName, contentType, sizeBytes, textStatus, uploadedAt, uploadedBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        personId: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/PersonFileKind' }
        version: { type: integer, minimum: 1, description: CV version per person; 1 for documents. }
        current: { type: boolean, description: The current CV (newest CV version); false for older CVs and for documents. }
        fileName: { type: string, examples: [cv-2026.pdf] }
        contentType: { type: string, description: Detected by Tika from the bytes., examples: [application/pdf] }
        sizeBytes: { type: integer, format: int64 }
        textStatus: { $ref: '#/components/schemas/TextExtractionStatus' }
        uploadedAt: { type: string, format: date-time }
        uploadedBy: { $ref: '#/components/schemas/UserRef' }
    DetectedContacts:
      type: object
      description: Found in the extracted text with plain patterns (no AI). Suggestions only.
      required: [emails, phones, linkedinUrls]
      properties:
        emails: { type: array, maxItems: 5, items: { type: string } }
        phones: { type: array, maxItems: 5, items: { type: string } }
        linkedinUrls: { type: array, maxItems: 5, items: { type: string } }
    CvIntakeItem:
      type: object
      required: [id, batchId, status, textStatus, detected, duplicates, uploadedAt, uploadedBy, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        batchId: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/CvIntakeStatus' }
        fileName: { type: [string, 'null'], description: Null once ATTACHED or DISCARDED (minimised). }
        contentType: { type: [string, 'null'] }
        sizeBytes: { type: [integer, 'null'], format: int64 }
        textStatus: { $ref: '#/components/schemas/TextExtractionStatus' }
        detected: { $ref: '#/components/schemas/DetectedContacts' }
        duplicates:
          type: array
          description: Duplicate check on the detected values (empty until the text is extracted).
          items: { $ref: '#/components/schemas/DuplicateMatch' }
        sourceChannel: { oneOf: [{ $ref: '#/components/schemas/SourceChannel' }, { type: 'null' }] }
        uploadedAt: { type: string, format: date-time }
        uploadedBy: { $ref: '#/components/schemas/UserRef' }
        expiresAt: { type: string, format: date-time, description: uploadedAt + 14 days; a PENDING item is deleted then. }
        attachedPerson: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
    CvIntakeItemPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/CvIntakeItem' }
        page: { $ref: '#/components/schemas/PageMeta' }
    CvIntakeBatch:
      type: object
      required: [batchId, items, rejected]
      properties:
        batchId: { $ref: '#/components/schemas/Id' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CvIntakeItem' }
        rejected:
          type: array
          description: Files not accepted, with the reason.
          items:
            type: object
            required: [fileName, code]
            properties:
              fileName: { type: string }
              code:
                type: string
                enum: [PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE]
    CvIntakeAttachRequest:
      description: Attach to an existing person, or create a new one.
      oneOf:
        - type: object
          additionalProperties: false
          required: [personId]
          properties:
            personId: { $ref: '#/components/schemas/Id' }
        - type: object
          additionalProperties: false
          required: [person]
          properties:
            person: { $ref: '#/components/schemas/PersonCreateRequest' }
    CvIntakeAttachResult:
      type: object
      required: [person, file]
      properties:
        person: { $ref: '#/components/schemas/Person' }
        file: { $ref: '#/components/schemas/PersonFile' }
    DuplicateCheckRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: [string, 'null'], maxLength: 200 }
        company: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 50 }
        linkedinUrl: { type: [string, 'null'], maxLength: 300 }
        excludePersonId:
          $ref: '#/components/schemas/Id'
          description: Leave this person out (when editing an existing person).
    DuplicateMatch:
      type: object
      required: [person, reasons]
      properties:
        person: { $ref: '#/components/schemas/PersonSummary' }
        reasons:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DuplicateMatchReason' }
    DuplicateCandidate:
      type: object
      required: [id, personA, personB, reasons, status, detectedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        personA: { $ref: '#/components/schemas/PersonSummary' }
        personB: { $ref: '#/components/schemas/PersonSummary' }
        reasons:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DuplicateMatchReason' }
        status: { $ref: '#/components/schemas/DuplicateStatus' }
        detectedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
    DuplicateCandidatePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/DuplicateCandidate' }
        page: { $ref: '#/components/schemas/PageMeta' }
    PersonMergeRequest:
      type: object
      required: [mergedPersonId, version]
      properties:
        mergedPersonId:
          $ref: '#/components/schemas/Id'
          description: The person that is merged into the survivor and then deleted.
        takeFromMerged:
          type: array
          uniqueItems: true
          description: Fields whose value comes from the merged person even when the survivor has one.
          items:
            type: string
            enum: [name, type, title, company, email, phone, city, linkedinUrl, howWeKnow, notes, ownerId, sourceChannel, noticePeriodDays, mobility, compensation]
        version:
          $ref: '#/components/schemas/Version'
          description: Survivor's version (optimistic lock, required because a merge cannot be undone).
    ExposureEntry:
      type: object
      required: [id, account, jobOrder, applicationId, channel, presentedAt, presentedBy, stage]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/AccountRef' }
        jobOrder: { $ref: '#/components/schemas/JobOrderRef' }
        applicationId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        channel: { $ref: '#/components/schemas/ExposureChannel' }
        presentedAt: { type: string, format: date-time }
        presentedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        stage:
          oneOf: [{ $ref: '#/components/schemas/PipelineStage' }, { type: 'null' }]
          description: Current stage of the application (the outcome so far); null if it was removed.
    OtherProcessRef:
      type: object
      required: [applicationId, jobOrder, account, stage]
      properties:
        applicationId: { $ref: '#/components/schemas/Id' }
        jobOrder: { $ref: '#/components/schemas/JobOrderRef' }
        account: { $ref: '#/components/schemas/AccountRef' }
        stage: { $ref: '#/components/schemas/PipelineStage' }
    PipelineWarning:
      type: object
      description: Non-blocking hint shown with the result of adding or presenting a person.
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/PipelineWarningCode' }
        message: { type: string, description: Fixed English text per code; the UI translates `code`., examples: ['Already presented to this account for another job order.'] }
        exposures:
          type: array
          description: PREVIOUSLY_PRESENTED_TO_ACCOUNT — the earlier presentations to this account.
          items: { $ref: '#/components/schemas/ExposureEntry' }
        otherProcesses:
          type: array
          description: ACTIVE_IN_OTHER_PROCESS — the other open applications.
          items: { $ref: '#/components/schemas/OtherProcessRef' }
    OffLimitsRule:
      type: object
      required: [id, account, companyName, reason, startsOn, endsOn, active, createdAt, createdBy, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        companyName: { type: [string, 'null'], description: Set when the company is not an account., examples: [Anadolu Lojistik] }
        includeSubsidiaries: { type: boolean, description: 'Since 1.3.0 (R63). The rule also covers every organisation below `account` in the group tree. Always false for a `companyName` rule.' }
        reason: { $ref: '#/components/schemas/OffLimitsReason' }
        note: { type: [string, 'null'], description: No personal data., examples: [Retained search agreement until end of 2027] }
        startsOn: { type: string, format: date }
        endsOn: { type: [string, 'null'], format: date, description: Last day in force; null = open-ended. }
        active: { type: boolean, description: In force today. }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        version: { $ref: '#/components/schemas/Version' }
    OffLimitsRulePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/OffLimitsRule' }
        page: { $ref: '#/components/schemas/PageMeta' }
    OffLimitsRuleCreateRequest:
      type: object
      required: [reason]
      description: Exactly one of `accountId` and `companyName` (else 400).
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        companyName: { type: string, minLength: 1, maxLength: 200 }
        includeSubsidiaries: { type: boolean, description: 'Since 1.3.0. Default false; true with `companyName` gives 400.' }
        reason: { $ref: '#/components/schemas/OffLimitsReason' }
        note: { type: [string, 'null'], maxLength: 500 }
        startsOn: { type: string, format: date, description: Defaults to today. }
        endsOn: { type: [string, 'null'], format: date, description: Not before `startsOn`. }
    OffLimitsRuleUpdateRequest:
      type: object
      minProperties: 1
      properties:
        reason: { $ref: '#/components/schemas/OffLimitsReason' }
        includeSubsidiaries: { type: boolean, description: Since 1.3.0; account rules only (400 otherwise). }
        note: { type: [string, 'null'], maxLength: 500 }
        startsOn: { type: string, format: date }
        endsOn: { type: [string, 'null'], format: date }
        version: { $ref: '#/components/schemas/Version' }
    ShareCheckRequest:
      type: object
      required: [personIds]
      properties:
        personIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
    ShareCheckResult:
      type: object
      required: [personId, shareable, reason]
      properties:
        personId: { $ref: '#/components/schemas/Id' }
        shareable: { type: boolean }
        reason:
          oneOf: [{ $ref: '#/components/schemas/ShareBlockReason' }, { type: 'null' }]
          description: Null when shareable.
    # ---------- 1.3.0: archive and merge (ADR 0013) ----------
    ArchiveReason:
      type: string
      description: '`contracts/enums/ArchiveReason.java`. MERGED and IMPORT_ROLLBACK are set by the server only.'
      enum: [DUPLICATE, CREATED_BY_MISTAKE, NO_LONGER_RELEVANT, MERGED, IMPORT_ROLLBACK, OTHER]
    ArchiveInfo:
      type: object
      required: [archivedAt, archivedBy, reason]
      properties:
        archivedAt: { type: string, format: date-time }
        archivedBy: { $ref: '#/components/schemas/UserRef' }
        reason: { $ref: '#/components/schemas/ArchiveReason' }
        note: { type: [string, 'null'], maxLength: 500 }
        mergedInto:
          oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }]
          description: Accounts only; set when `reason` is MERGED.
    ArchiveRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/ArchiveReason'
          description: MERGED and IMPORT_ROLLBACK give 400 `VALIDATION_FAILED`.
        note: { type: [string, 'null'], maxLength: 500, description: Required when `reason` is OTHER (400). }
        version: { $ref: '#/components/schemas/Version' }
    RestoreRequest:
      type: object
      properties:
        version: { $ref: '#/components/schemas/Version' }
    AccountMergeRequest:
      type: object
      required: [mergedId, version]
      properties:
        mergedId:
          $ref: '#/components/schemas/Id'
          description: The account to merge into the path account.
        takeFromMerged:
          type: array
          description: Survivor fields to overwrite with the merged account's value (others are kept; empty ones are filled).
          uniqueItems: true
          items:
            type: string
            enum: [sector, city, website, notes, ownerId, legalName, taxId, taxOffice, mersisNo, billingAddress, billingEmails, parentAccountId, employeeBand]
        version:
          $ref: '#/components/schemas/Version'
          description: The survivor's version (required, 409 on mismatch).
    AccountMergeResult:
      type: object
      required: [survivor, mergedId, moved]
      properties:
        survivor: { $ref: '#/components/schemas/Account' }
        mergedId: { $ref: '#/components/schemas/Id' }
        moved:
          type: object
          description: Moved row counts per kind, e.g. contacts, jobOrders, proposals, activities, nextActions, offLimitsRules, agreements, placements.
          additionalProperties: { type: integer, minimum: 0 }
          examples: [{ contacts: 3, jobOrders: 2, activities: 14 }]
    # ---------- 1.3.0: account profile ----------
    OrganisationRole:
      type: string
      description: '`contracts/enums/OrganisationRole.java` (R63, since 1.3.0).'
      enum: [CLIENT, PROSPECT, TARGET, EMPLOYER]
    ConfidentialityLevel:
      type: string
      description: '`contracts/enums/ConfidentialityLevel.java`; default NORMAL. RESTRICTED = named team; CONFIDENTIAL = hidden from non-team users (rule in a later contract, ADR 0013).'
      enum: [NORMAL, RESTRICTED, CONFIDENTIAL]
    EInvoiceStatus:
      type: string
      description: '`contracts/enums/EInvoiceStatus.java`; default UNKNOWN.'
      enum: [UNKNOWN, E_FATURA, E_ARSIV]
    EmployeeBand:
      type: string
      enum: [B1_50, B51_250, B251_1000, B1001_5000, B5000_PLUS]
    # ---------- 1.3.0: candidate search ----------
    JobFunction:
      type: string
      description: '`contracts/enums/JobFunction.java`.'
      enum: [GENERAL_MANAGEMENT, FINANCE, HR, SALES, MARKETING, OPERATIONS, SUPPLY_CHAIN, PROCUREMENT, ENGINEERING, IT, RND, LEGAL, OTHER]
    Seniority:
      type: string
      description: '`contracts/enums/Seniority.java`, highest first.'
      enum: [BOARD, C_LEVEL, VP_DIRECTOR, HEAD, MANAGER, SPECIALIST]
    # ---------- 1.3.0: tags ----------
    TagColour:
      type: string
      description: '`contracts/enums/TagColour.java`; the frontend maps each to a design token.'
      enum: [GREY, BLUE, GREEN, AMBER, RED, PURPLE, TEAL]
    TagChangeKind:
      type: string
      enum: [RENAMED, MERGED, DELETED]
    TagSummary:
      type: object
      required: [name, colour, talentPool, defined, counts, total]
      properties:
        name: { $ref: '#/components/schemas/Tag' }
        colour: { $ref: '#/components/schemas/TagColour' }
        description: { type: [string, 'null'] }
        talentPool: { type: boolean, description: 'A talent pool is a tag with this flag; open it with `GET /people?tag=<name>`.' }
        defined: { type: boolean, description: A `tag_definition` row exists. }
        counts:
          type: object
          description: Records carrying the tag per entity (all four keys always present).
          required: [PEOPLE, ACCOUNTS, JOB_ORDERS, PROPOSALS]
          properties:
            PEOPLE: { type: integer, minimum: 0 }
            ACCOUNTS: { type: integer, minimum: 0 }
            JOB_ORDERS: { type: integer, minimum: 0 }
            PROPOSALS: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    TagSummaryPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/TagSummary' }
        page: { $ref: '#/components/schemas/PageMeta' }
    TagDefinitionRequest:
      type: object
      properties:
        colour: { $ref: '#/components/schemas/TagColour' }
        description: { type: [string, 'null'], maxLength: 200 }
        talentPool: { type: boolean }
    TagRenameRequest:
      type: object
      required: [newName]
      properties:
        newName: { $ref: '#/components/schemas/Tag' }
    TagMergeRequest:
      type: object
      required: [into]
      properties:
        into: { $ref: '#/components/schemas/Tag' }
    TagChangeResult:
      type: object
      required: [change, tag, updated]
      properties:
        change: { $ref: '#/components/schemas/TagChangeKind' }
        tag: { $ref: '#/components/schemas/Tag' }
        newTag:
          oneOf: [{ $ref: '#/components/schemas/Tag' }, { type: 'null' }]
          description: RENAMED and MERGED.
        updated:
          type: object
          description: Records rewritten synchronously (PEOPLE, ACCOUNTS, views); JOB_ORDERS and PROPOSALS follow through `TagChanged` within seconds.
          additionalProperties: { type: integer, minimum: 0 }
    # ---------- 1.3.0: longlist and shortlist ----------
    CandidateList:
      type: string
      description: '`contracts/enums/CandidateList.java`; derived from the stage: SOURCED, SCREENED = LONGLIST; PRESENTED, CLIENT_INTERVIEW, OFFER, PLACED = SHORTLIST.'
      enum: [LONGLIST, SHORTLIST]
    OutreachStatus:
      type: string
      description: '`contracts/enums/OutreachStatus.java`; not a lifecycle. A move to stage SCREENED sets SCREENED.'
      enum: [TO_CALL, CALLED, INTERESTED, NOT_INTERESTED, NOT_NOW, SCREENED]
    CloseReason:
      type: string
      description: '`contracts/enums/CloseReason.java` (R65). Coded reason on every move to REJECTED; internal only.'
      enum: [CLIENT_DECLINED, CANDIDATE_WITHDREW, NOT_INTERESTED, NOT_QUALIFIED, COMPENSATION_MISMATCH, OFF_LIMITS, NO_RESPONSE, HIRED_ELSEWHERE, SEARCH_CLOSED, OTHER]
    ActivityOutcome:
      type: string
      description: '`contracts/enums/ActivityOutcome.java` (R70).'
      enum: [CONNECTED, NO_ANSWER, LEFT_MESSAGE, CALLBACK_REQUESTED, INTERESTED, NOT_INTERESTED, MEETING_BOOKED, WRONG_CONTACT, COMPLETED]
    ActivityDirection:
      type: string
      description: '`contracts/enums/ActivityDirection.java` (R70). Null for NOTE.'
      enum: [INBOUND, OUTBOUND]
    ActivitySource:
      type: string
      description: '`contracts/enums/ActivitySource.java` (R70).'
      enum: [MANUAL, EMAIL, CALL_SHEET]
    ClientFeedbackOutcome:
      type: string
      enum: [ADVANCE, HOLD, DECLINE]
    DeclineReason:
      type: string
      enum: [EXPERIENCE, COMPENSATION, CULTURE_FIT, LOCATION, TIMING, OTHER_CANDIDATE, OTHER]
    ApplicationUpdateRequest:
      type: object
      minProperties: 1
      properties:
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        rationale: { type: [string, 'null'], maxLength: 2000 }
        outreachStatus: { $ref: '#/components/schemas/OutreachStatus' }
        version: { $ref: '#/components/schemas/Version' }
    RankingRequest:
      type: object
      required: [list, applicationIds]
      properties:
        list: { $ref: '#/components/schemas/CandidateList' }
        applicationIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          description: Exactly the **active** applications of the job order on this list (PLACED and REJECTED excluded), first = rank 1. A missing, extra, PLACED or REJECTED id gives 409 `STATE_CONFLICT` (stale view; reload).
          items: { $ref: '#/components/schemas/Id' }
    ClientFeedback:
      type: object
      required: [id, applicationId, round, feedbackOn, outcome, recordedBy, recordedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        applicationId: { $ref: '#/components/schemas/Id' }
        round: { type: integer, minimum: 1 }
        feedbackOn: { type: string, format: date }
        participants: { type: [string, 'null'], description: 'Roles of the client people present, not names (UI hint; third-party data, see `contracts/personal-data.md`).', examples: ['CFO, HR director'] }
        outcome: { $ref: '#/components/schemas/ClientFeedbackOutcome' }
        declineReason:
          oneOf: [{ $ref: '#/components/schemas/DeclineReason' }, { type: 'null' }]
        reasonText: { type: [string, 'null'] }
        candidateFeedback: { type: [string, 'null'], description: What to relay to the candidate. }
        recordedBy: { $ref: '#/components/schemas/UserRef' }
        recordedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    ClientFeedbackCreateRequest:
      type: object
      required: [feedbackOn, outcome]
      properties:
        round: { type: integer, minimum: 1, maximum: 20 }
        feedbackOn: { type: string, format: date }
        participants: { type: [string, 'null'], maxLength: 500 }
        outcome: { $ref: '#/components/schemas/ClientFeedbackOutcome' }
        declineReason:
          oneOf: [{ $ref: '#/components/schemas/DeclineReason' }, { type: 'null' }]
        reasonText: { type: [string, 'null'], maxLength: 1000, description: Required when `declineReason` is OTHER. }
        candidateFeedback: { type: [string, 'null'], maxLength: 2000 }
    ClientFeedbackUpdateRequest:
      type: object
      minProperties: 1
      properties:
        feedbackOn: { type: string, format: date }
        participants: { type: [string, 'null'], maxLength: 500 }
        declineReason:
          oneOf: [{ $ref: '#/components/schemas/DeclineReason' }, { type: 'null' }]
        reasonText: { type: [string, 'null'], maxLength: 1000 }
        candidateFeedback: { type: [string, 'null'], maxLength: 2000 }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- 1.3.0: evaluation ----------
    InterviewType:
      type: string
      enum: [PHONE, VIDEO, IN_PERSON]
    Recommendation:
      type: string
      enum: [SHORTLIST, HOLD, REJECT]
    MotivationTag:
      type: string
      enum: [GROWTH, PAY, STABILITY, RELOCATION, PUSH_FACTOR]
    EvaluationBlock:
      type: string
      description: Blocks that may go into a client report; private notes never do.
      enum: [SUMMARY, ACHIEVEMENTS, MOTIVATION, CONCERNS, CRITERIA, REFERENCES]
    ReferenceStatus:
      type: string
      enum: [TO_REQUEST, REQUESTED, RECEIVED, DECLINED]
    CriterionScore:
      type: object
      required: [criterionId, score]
      properties:
        criterionId: { $ref: '#/components/schemas/Id' }
        criterionText: { type: string, readOnly: true, description: In responses only (the criterion as it is now). }
        score: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'], maxLength: 500 }
    EvaluationFields:
      type: object
      properties:
        evaluatedOn: { type: string, format: date, description: Defaults to today. }
        interviewType: { $ref: '#/components/schemas/InterviewType' }
        overallRating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        recommendation: { $ref: '#/components/schemas/Recommendation' }
        recommendationReason: { type: [string, 'null'], maxLength: 500 }
        summary: { type: [string, 'null'], maxLength: 600 }
        keyAchievements:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 200 }
        motivation: { type: [string, 'null'], maxLength: 400 }
        motivationTags:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/MotivationTag' }
        concerns: { type: [string, 'null'], maxLength: 400 }
        otherProcesses: { type: [string, 'null'], maxLength: 1000, description: Competing offers or processes. }
        scores:
          type: array
          maxItems: 30
          description: One per brief criterion (SX-017); replaces the whole list when sent.
          items: { $ref: '#/components/schemas/CriterionScore' }
        privateNotes: { type: [string, 'null'], maxLength: 4000, description: Never in reports. }
        internalOnly: { type: boolean, description: When true no block of this evaluation goes into a report. }
        reportBlocks:
          type: array
          uniqueItems: true
          description: Default SUMMARY, ACHIEVEMENTS, MOTIVATION, CONCERNS.
          items: { $ref: '#/components/schemas/EvaluationBlock' }
    Evaluation:
      allOf:
        - $ref: '#/components/schemas/EvaluationFields'
        - type: object
          required: [id, person, evaluator, evaluatedOn, interviewType, recommendation, createdAt, updatedAt, version]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            person: { $ref: '#/components/schemas/PersonRef' }
            jobOrder:
              oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }]
            applicationId:
              oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
              description: Set by the server when the person is on the job order.
            evaluator: { $ref: '#/components/schemas/UserRef' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            version: { $ref: '#/components/schemas/Version' }
    EvaluationCreateRequest:
      allOf:
        - $ref: '#/components/schemas/EvaluationFields'
        - type: object
          required: [interviewType, recommendation]
          properties:
            jobOrderId:
              oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
            evaluatorId:
              $ref: '#/components/schemas/Id'
              description: Defaults to the current user.
    EvaluationUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/EvaluationFields'
        - type: object
          properties:
            version: { $ref: '#/components/schemas/Version' }
    InterviewNote:
      type: object
      required: [id, person, interviewer, heldOn, interviewType, body, includeInReport, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        person: { $ref: '#/components/schemas/PersonRef' }
        jobOrder:
          oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }]
        interviewer: { $ref: '#/components/schemas/UserRef' }
        heldOn: { type: string, format: date }
        interviewType: { $ref: '#/components/schemas/InterviewType' }
        body: { type: string }
        includeInReport: { type: boolean, description: Default false; notes reach a report only when true (SX-009). }
        createdAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    InterviewNoteRequest:
      type: object
      required: [interviewType, body]
      properties:
        jobOrderId:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
        interviewerId: { $ref: '#/components/schemas/Id' }
        heldOn: { type: string, format: date, description: Defaults to today. }
        interviewType: { $ref: '#/components/schemas/InterviewType' }
        body: { type: string, minLength: 1, maxLength: 20000 }
        includeInReport: { type: boolean, description: Default false. }
    InterviewNoteUpdateRequest:
      type: object
      minProperties: 1
      properties:
        heldOn: { type: string, format: date }
        interviewType: { $ref: '#/components/schemas/InterviewType' }
        body: { type: string, minLength: 1, maxLength: 20000 }
        includeInReport: { type: boolean }
        version: { $ref: '#/components/schemas/Version' }
    CandidateReference:
      type: object
      required: [id, person, refereeName, status, includeInReport, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        person: { $ref: '#/components/schemas/PersonRef' }
        jobOrder:
          oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }]
        refereeName: { type: string }
        refereeRelationship: { type: [string, 'null'], examples: [Former line manager] }
        refereeCompany: { type: [string, 'null'] }
        refereeEmail: { type: [string, 'null'], format: email }
        refereePhone: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ReferenceStatus' }
        summary: { type: [string, 'null'] }
        checkedOn: { type: [string, 'null'], format: date }
        checkedBy:
          oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }]
        includeInReport: { type: boolean, description: 'Only status and summary go into a report, never the referee details.' }
        createdAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    CandidateReferenceRequest:
      type: object
      required: [refereeName]
      properties:
        jobOrderId:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
        refereeName: { type: string, minLength: 1, maxLength: 200 }
        refereeRelationship: { type: [string, 'null'], maxLength: 200 }
        refereeCompany: { type: [string, 'null'], maxLength: 200 }
        refereeEmail: { type: [string, 'null'], format: email, maxLength: 254 }
        refereePhone: { type: [string, 'null'], maxLength: 50 }
        status: { $ref: '#/components/schemas/ReferenceStatus' }
        summary: { type: [string, 'null'], maxLength: 4000 }
        checkedOn: { type: [string, 'null'], format: date }
        includeInReport: { type: boolean, description: Default false. }
    CandidateReferenceUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/CandidateReferenceRequest'
        - type: object
          properties:
            version: { $ref: '#/components/schemas/Version' }
    # ---------- 1.3.0: search brief ----------
    CriterionKind:
      type: string
      enum: [MUST_HAVE, NICE_TO_HAVE]
    SearchTeamRole:
      type: string
      enum: [LEAD, CONSULTANT, RESEARCHER]
    TargetTier:
      type: string
      enum: [A, B, C]
    TargetCompanyStatus:
      type: string
      description: EXCLUDED = the client asked not to approach this company for this search.
      enum: [TO_MAP, MAPPED, APPROACHED, CLOSED, EXCLUDED]
    SearchCriterion:
      type: object
      required: [id, kind, text, sortOrder]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/CriterionKind' }
        text: { type: string, examples: ['IFRS reporting in a listed company'] }
        sortOrder: { type: integer, minimum: 0 }
        removedAt: { type: [string, 'null'], format: date-time, description: Only in `removedCriteria`. }
    SearchCriterionRequest:
      type: object
      required: [kind, text]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: Omit for a new criterion.
        kind: { $ref: '#/components/schemas/CriterionKind' }
        text: { type: string, minLength: 1, maxLength: 300 }
    SearchBriefFields:
      type: object
      properties:
        reportingLine: { type: [string, 'null'], maxLength: 200, examples: [Reports to the CEO] }
        purpose: { type: [string, 'null'], maxLength: 4000, description: Why the role exists and what success looks like. }
        idealProfile: { type: [string, 'null'], maxLength: 4000 }
        seniorityLevel:
          oneOf: [{ $ref: '#/components/schemas/Seniority' }, { type: 'null' }]
        functionArea:
          oneOf: [{ $ref: '#/components/schemas/JobFunction' }, { type: 'null' }]
        teamSize: { type: [integer, 'null'], minimum: 0, maximum: 100000, description: 'Since R73. People in the team the hire will lead (0 = individual contributor).' }
        compMin: { type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$', description: 'Decimal as string. Since R73 the band (`compMin`, `compMax`, `compCurrency`, `compPeriod`, `compBonusNote`) is stored encrypted as one value (`search_brief.comp_band_enc`, like person compensation); read access is unchanged.' }
        compMax: { type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$' }
        compCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        compPeriod:
          oneOf: [{ $ref: '#/components/schemas/CompensationPeriod' }, { type: 'null' }]
        compBonusNote: { type: [string, 'null'], maxLength: 300, examples: ['Target bonus 30%, car'] }
        languages:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/LanguageSkill' }
        kickoffOn: { type: [string, 'null'], format: date }
        longlistDueOn: { type: [string, 'null'], format: date }
        shortlistDueOn: { type: [string, 'null'], format: date }
        targetStartOn: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 4000 }
    SearchBrief:
      allOf:
        - $ref: '#/components/schemas/SearchBriefFields'
        - type: object
          required: [jobOrderId, briefVersion, criteria, removedCriteria, team, offLimitsRules, missingFields]
          properties:
            jobOrderId: { $ref: '#/components/schemas/Id' }
            briefVersion: { type: integer, minimum: 0 }
            criteria:
              type: array
              description: Current criteria, MUST_HAVE first, then by `sortOrder`.
              items: { $ref: '#/components/schemas/SearchCriterion' }
            removedCriteria:
              type: array
              description: Criteria removed from the brief; old evaluation scores still point at them.
              items: { $ref: '#/components/schemas/SearchCriterion' }
            team:
              type: array
              items: { $ref: '#/components/schemas/SearchTeamMember' }
            offLimitsRules:
              type: array
              items: { $ref: '#/components/schemas/OffLimitsRule' }
            missingFields:
              type: array
              description: 'Brief fields still empty that SX-001 expects (e.g. `purpose`, `compMin`, `shortlistDueOn`, `criteria`); a warning only.'
              items: { type: string }
            updatedAt: { type: [string, 'null'], format: date-time }
            updatedBy:
              oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }]
            version:
              oneOf: [{ $ref: '#/components/schemas/Version' }, { type: 'null' }]
              description: Null until the brief is first saved.
    SearchBriefRequest:
      allOf:
        - $ref: '#/components/schemas/SearchBriefFields'
        - type: object
          required: [criteria]
          properties:
            criteria:
              type: array
              maxItems: 30
              items: { $ref: '#/components/schemas/SearchCriterionRequest' }
            version: { $ref: '#/components/schemas/Version' }
    SearchTeamMember:
      type: object
      required: [user, role]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        role: { $ref: '#/components/schemas/SearchTeamRole' }
    SearchTeamMemberRequest:
      type: object
      required: [userId, role]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        role: { $ref: '#/components/schemas/SearchTeamRole' }
    TargetCompany:
      type: object
      required: [id, jobOrderId, account, companyName, tier, status, offLimits, owner, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        jobOrderId: { $ref: '#/components/schemas/Id' }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        companyName: { type: [string, 'null'], description: Set when the company is not an account. }
        sector: { type: [string, 'null'] }
        tier: { $ref: '#/components/schemas/TargetTier' }
        status: { $ref: '#/components/schemas/TargetCompanyStatus' }
        rationale: { type: [string, 'null'] }
        source: { type: [string, 'null'], examples: [Client list] }
        notes: { type: [string, 'null'] }
        offLimits: { type: boolean, description: Matches an active off-limits rule today. }
        offLimitsOverrideReason: { type: [string, 'null'] }
        owner: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    TargetCompanyCreateRequest:
      type: object
      required: [tier]
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        companyName: { type: string, minLength: 1, maxLength: 200 }
        sector: { type: [string, 'null'], maxLength: 100 }
        tier: { $ref: '#/components/schemas/TargetTier' }
        status:
          $ref: '#/components/schemas/TargetCompanyStatus'
          description: Defaults to TO_MAP; APPROACHED runs the off-limits guard.
        rationale: { type: [string, 'null'], maxLength: 1000 }
        source: { type: [string, 'null'], maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        ownerId: { $ref: '#/components/schemas/Id' }
    TargetCompanyUpdateRequest:
      type: object
      minProperties: 1
      properties:
        sector: { type: [string, 'null'], maxLength: 100 }
        tier: { $ref: '#/components/schemas/TargetTier' }
        status: { $ref: '#/components/schemas/TargetCompanyStatus' }
        rationale: { type: [string, 'null'], maxLength: 1000 }
        source: { type: [string, 'null'], maxLength: 200 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        ownerId: { $ref: '#/components/schemas/Id' }
        offLimitsOverrideReason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- 1.3.0: commercial ----------
    Money:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      description: Decimal amount as string (no rounding).
      examples: ['450000.00']
    AgreementKind:
      type: string
      enum: [TERMS_OF_BUSINESS, ENGAGEMENT_LETTER, AMENDMENT]
    AgreementStatus:
      type: string
      enum: [DRAFT, SENT, SIGNED, EXPIRED, TERMINATED]
    FeeModel:
      type: string
      description: 'PB-008: retained in thirds, retained with custom instalments, percent of first-year cash (success), flat fee, hybrid (retainer + success).'
      enum: [RETAINED_THIRDS, RETAINED_CUSTOM, PERCENT_FIRST_YEAR_CASH, FLAT_FEE, HYBRID]
    FeeBasisComponent:
      type: string
      description: Cash components the percent fee is computed on (PB-008 toggles).
      enum: [BASE, TARGET_BONUS, PAID_BONUS, ALLOWANCES, SIGN_ON, CAR, OTHER_CASH]
    Exclusivity:
      type: string
      enum: [EXCLUSIVE, NON_EXCLUSIVE]
    FeeTrigger:
      type: string
      description: |
        When an instalment becomes DUE (PB-009, CO-020): SIGNING (agreement SIGNED), DATE_OFFSET
        (`signedOn` + `offsetDays`, nightly), SHORTLIST_DELIVERED (first move of the job order into a
        client-facing stage, or a SHORTLIST report marked sent), OFFER_ACCEPTED (placement created),
        START_DATE (placement `startDate` reached, nightly), EXPENSES (manual), ABORT (job order CANCELLED).
      enum: [SIGNING, DATE_OFFSET, SHORTLIST_DELIVERED, OFFER_ACCEPTED, START_DATE, EXPENSES, ABORT]
    InvoiceState:
      type: string
      enum: [NOT_DUE, DUE, INVOICED, PAID, CANCELLED]
    GuaranteeStartBasis:
      type: string
      description: '`contracts/enums/GuaranteeStartBasis.java` (R67). The date the guarantee months count from.'
      enum: [START_DATE, OFFER_ACCEPTED]
    PlacementStatus:
      type: string
      enum: [ACTIVE, LEFT_IN_GUARANTEE, GUARANTEE_ENDED, REPLACED, CANCELLED]
    ConflictHitKind:
      type: string
      enum: [CURRENT_CLIENT, GUARANTEE_PERIOD, OFF_LIMITS_RULE, PLACED_CANDIDATE, COMPETING_SEARCH]
    ConflictDecision:
      type: string
      enum: [CLEAR, PROCEED, BLOCKED]
    FeeScheduleItemFields:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 200, examples: [Retainer 1/3] }
        trigger: { $ref: '#/components/schemas/FeeTrigger' }
        offsetDays: { type: [integer, 'null'], minimum: 0, maximum: 730 }
        percent: { type: [string, 'null'], pattern: '^\d{1,3}(\.\d{1,2})?$', description: 'Percent of the fee (estimated fee before placement, placement fee after).' }
        amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        dueDays: { type: integer, minimum: 0, maximum: 180, description: Payment term in days after the trigger (default 30). }
        vatApplies: { type: boolean, description: 'Since R67. VAT (KDV) is added to this item; default `not account.vatExempt`. Amounts are always net.' }
    FeeScheduleItem:
      allOf:
        - $ref: '#/components/schemas/FeeScheduleItemFields'
        - type: object
          required: [id, agreementId, seq, label, trigger, dueDays, invoiceState, version]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            agreementId: { $ref: '#/components/schemas/Id' }
            account: { $ref: '#/components/schemas/AccountRef' }
            jobOrder:
              oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }]
            seq: { type: integer, minimum: 1 }
            computedAmount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: '`amount`, or `percent` of the current fee; null when not computable yet.' }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            invoiceState: { $ref: '#/components/schemas/InvoiceState' }
            triggeredAt: { type: [string, 'null'], format: date-time }
            dueOn: { type: [string, 'null'], format: date }
            einvoiceRef: { type: [string, 'null'], description: e-Fatura or e-Arşiv reference. }
            invoicedOn: { type: [string, 'null'], format: date }
            invoicedAmount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
            paidOn: { type: [string, 'null'], format: date }
            stateReason: { type: [string, 'null'] }
            version: { $ref: '#/components/schemas/Version' }
    FeeScheduleItemPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/FeeScheduleItem' }
        page: { $ref: '#/components/schemas/PageMeta' }
    FeeScheduleItemRequest:
      allOf:
        - $ref: '#/components/schemas/FeeScheduleItemFields'
        - type: object
          required: [label, trigger]
          properties:
            id:
              $ref: '#/components/schemas/Id'
              description: Omit for a new item.
    FeeScheduleItemUpdateRequest:
      type: object
      required: [invoiceState]
      properties:
        invoiceState: { $ref: '#/components/schemas/InvoiceState' }
        einvoiceRef: { type: [string, 'null'], maxLength: 100 }
        invoicedOn: { type: [string, 'null'], format: date }
        invoicedAmount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        paidOn: { type: [string, 'null'], format: date }
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    AgreementFields:
      type: object
      properties:
        status: { $ref: '#/components/schemas/AgreementStatus' }
        title: { type: [string, 'null'], maxLength: 200 }
        signedOn: { type: [string, 'null'], format: date }
        validFrom: { type: [string, 'null'], format: date }
        validUntil: { type: [string, 'null'], format: date }
        language: { oneOf: [{ $ref: '#/components/schemas/Language' }, { type: 'null' }] }
        governingLaw: { type: [string, 'null'], maxLength: 100, examples: [Turkish law, Istanbul courts] }
        exclusivity: { oneOf: [{ $ref: '#/components/schemas/Exclusivity' }, { type: 'null' }] }
        feeModel: { $ref: '#/components/schemas/FeeModel' }
        feePercent: { type: [string, 'null'], pattern: '^\d{1,3}(\.\d{1,2})?$', examples: ['33.33'] }
        feeBasis:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/FeeBasisComponent' }
        flatFeeAmount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        estimatedFee: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: Basis for percent instalments before a placement exists (retainers). }
        feeMinimum: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        feeCap: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        currency: { type: string, pattern: '^[A-Z]{3}$', examples: [TRY] }
        paymentTermsDays: { type: integer, minimum: 0, maximum: 180, description: Default 30. }
        guaranteeMonths: { type: integer, minimum: 0, maximum: 36, description: Default 6. }
        guaranteeStartBasis:
          $ref: '#/components/schemas/GuaranteeStartBasis'
          description: Since R67. Default START_DATE; a placement's `guaranteeEndOn` = that date + `guaranteeMonths`.
        guaranteeTerms: { type: [string, 'null'], maxLength: 2000, description: 'Triggers, exclusions, client obligations (PB-011).' }
        expensePolicy: { type: [string, 'null'], maxLength: 1000 }
        offLimitsMonths: { type: [integer, 'null'], minimum: 0, maximum: 60, description: Non-solicitation term after the engagement. }
        confidentialityTerms: { type: [string, 'null'], maxLength: 2000 }
        signatoryContactId:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
          description: An active contact of the account (400 otherwise).
        billingAccountId:
          $ref: '#/components/schemas/Id'
          description: The account invoiced (billing entity); defaults to the account.
        notes: { type: [string, 'null'], maxLength: 4000 }
    Agreement:
      allOf:
        - $ref: '#/components/schemas/AgreementFields'
        - type: object
          required: [id, account, kind, status, feeModel, currency, paymentTermsDays, guaranteeMonths, billingAccount, scheduleItems, createdAt, updatedAt, version]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            account: { $ref: '#/components/schemas/AccountRef' }
            jobOrder:
              oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }]
            kind: { $ref: '#/components/schemas/AgreementKind' }
            billingAccount: { $ref: '#/components/schemas/AccountRef' }
            signedFile:
              description: Since R67. Set by `PUT /agreements/{id}/signed-file`.
              oneOf:
                - type: object
                  required: [id, fileName, sizeBytes, uploadedAt, uploadedBy]
                  properties:
                    id: { $ref: '#/components/schemas/Id' }
                    fileName: { type: string }
                    sizeBytes: { type: integer, minimum: 1 }
                    uploadedAt: { type: string, format: date-time }
                    uploadedBy: { $ref: '#/components/schemas/UserRef' }
                - type: 'null'
            signatory:
              oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }]
              description: Null when not set or when the signatory's contact was removed by a person deletion (`on delete set null`).
            scheduleItems:
              type: array
              items: { $ref: '#/components/schemas/FeeScheduleItem' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            version: { $ref: '#/components/schemas/Version' }
    AgreementPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Agreement' }
        page: { $ref: '#/components/schemas/PageMeta' }
    AgreementCreateRequest:
      allOf:
        - $ref: '#/components/schemas/AgreementFields'
        - type: object
          required: [accountId, kind, feeModel, currency]
          properties:
            accountId: { $ref: '#/components/schemas/Id' }
            jobOrderId:
              oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
            kind: { $ref: '#/components/schemas/AgreementKind' }
            scheduleItems:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/FeeScheduleItemRequest' }
    AgreementUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AgreementFields'
        - type: object
          properties:
            scheduleItems:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/FeeScheduleItemRequest' }
            version: { $ref: '#/components/schemas/Version' }
    PlacementCompensation:
      type: object
      description: Encrypted as one value (like `Compensation`, ADR 0011/0013). Amounts per year.
      required: [currency]
      properties:
        base: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        bonus: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: Target or guaranteed first-year bonus. }
        allowances: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        signOn: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        otherCash: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        firstYearCash: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: Sum of the above when not given. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    Placement:
      type: object
      required: [id, applicationId, jobOrder, account, person, status, startDate, feeAmount, feeCurrency, guaranteeEndOn, compensationRestricted, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        applicationId:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
          description: Null after the person was deleted (ADR 0009); the placement stays as commercial evidence.
        jobOrder: { $ref: '#/components/schemas/JobOrderRef' }
        account: { $ref: '#/components/schemas/AccountRef' }
        person:
          oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }]
          description: Null after the person was deleted (then `compensation` and `statusReason` are null too). An anonymised person shows as `Anonymised person`.
        agreementId:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
        status: { $ref: '#/components/schemas/PlacementStatus' }
        offerAcceptedOn: { type: [string, 'null'], format: date }
        startDate: { type: string, format: date }
        compensation:
          oneOf: [{ $ref: '#/components/schemas/PlacementCompensation' }, { type: 'null' }]
          description: Null in lists and for users without access.
        compensationRestricted: { type: boolean }
        feeAmount: { $ref: '#/components/schemas/Money' }
        feeCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        feeOverridden: { type: boolean, description: True when a manager set the fee instead of the computed one. }
        guaranteeEndOn: { type: string, format: date }
        leftOn: { type: [string, 'null'], format: date }
        replacementJobOrder:
          oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }]
        statusReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    PlacementPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Placement' }
        page: { $ref: '#/components/schemas/PageMeta' }
    PlacementCreateRequest:
      type: object
      required: [startDate, compensation]
      properties:
        offerAcceptedOn: { type: string, format: date, description: Defaults to today. }
        startDate: { type: string, format: date }
        compensation: { $ref: '#/components/schemas/PlacementCompensation' }
        feeAmount:
          oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }]
          description: Override of the computed fee; MANAGER/ADMIN only.
        guaranteeEndOn: { type: [string, 'null'], format: date, description: Override; MANAGER/ADMIN only. }
        version:
          $ref: '#/components/schemas/Version'
          description: The application's version.
    PlacementUpdateRequest:
      type: object
      minProperties: 1
      properties:
        startDate: { type: string, format: date }
        compensation: { $ref: '#/components/schemas/PlacementCompensation' }
        feeAmount: { $ref: '#/components/schemas/Money' }
        guaranteeEndOn: { type: string, format: date }
        leftOn: { type: [string, 'null'], format: date }
        replacementJobOrderId:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
        status:
          $ref: '#/components/schemas/PlacementStatus'
          description: Only CANCELLED or GUARANTEE_ENDED may be set by hand; the others follow from the fields.
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    ConflictCheckRequest:
      type: object
      description: Exactly one of `accountId` and `companyName` (400).
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        companyName: { type: string, minLength: 1, maxLength: 200 }
        jobOrderId:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
          description: The search being considered (also gives function and seniority for COMPETING_SEARCH).
    ConflictHit:
      type: object
      required: [kind, refType, refId, title]
      properties:
        kind: { $ref: '#/components/schemas/ConflictHitKind' }
        refType: { $ref: '#/components/schemas/EntityType' }
        refId: { $ref: '#/components/schemas/Id' }
        title:
          type: [string, 'null']
          description: Account, job order or rule title; always null for PLACED_CANDIDATE (no person names in the log).
        until: { type: [string, 'null'], format: date, description: End of the guarantee or rule. }
    ConflictCheckRecordRequest:
      allOf:
        - $ref: '#/components/schemas/ConflictCheckRequest'
        - type: object
          required: [decision]
          properties:
            decision: { $ref: '#/components/schemas/ConflictDecision' }
            overrideReason: { $ref: '#/components/schemas/Reason' }
    ConflictCheck:
      type: object
      required: [id, decision, hits, checkedBy, checkedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        companyName: { type: [string, 'null'] }
        jobOrderId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        hits:
          type: array
          items: { $ref: '#/components/schemas/ConflictHit' }
        decision: { $ref: '#/components/schemas/ConflictDecision' }
        overrideReason: { type: [string, 'null'] }
        checkedBy: { $ref: '#/components/schemas/UserRef' }
        checkedAt: { type: string, format: date-time }
    ConflictCheckPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ConflictCheck' }
        page: { $ref: '#/components/schemas/PageMeta' }
    # ---------- 1.3.0: import rollback, exports, client reports ----------
    ImportRollbackRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/Reason' }
    ImportRollbackResult:
      type: object
      required: [import, archived, ended, skipped]
      properties:
        import: { $ref: '#/components/schemas/ImportJob' }
        archived:
          type: object
          description: Archived records per entity (ACCOUNTS, PEOPLE).
          additionalProperties: { type: integer, minimum: 0 }
        ended: { type: integer, minimum: 0, description: Contacts ended. }
        skipped:
          type: array
          description: Records left as they are, with the reason code.
          items:
            type: object
            required: [entityType, id, code]
            properties:
              entityType: { $ref: '#/components/schemas/EntityType' }
              id: { $ref: '#/components/schemas/Id' }
              code: { type: string, enum: [IN_PIPELINE, HAS_ACTIVITY, ANONYMISED, ALREADY_ARCHIVED] }
    ExportStatus:
      type: string
      description: '`contracts/enums/ExportStatus.java`.'
      enum: [PENDING_APPROVAL, READY, REJECTED, EXPIRED, FAILED]
    ExportRequest:
      type: object
      required: [entity, filters, columns, purpose]
      properties:
        entity:
          $ref: '#/components/schemas/ListEntity'
          description: PEOPLE, ACCOUNTS or JOB_ORDERS; PROPOSALS gives 400 in 1.3.
        filters:
          type: object
          maxProperties: 20
          description: Filter keys of the entity, as in `ViewDefinition.filters`.
          additionalProperties: { $ref: '#/components/schemas/FilterValue' }
        columns:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, pattern: '^[A-Za-z][A-Za-z0-9.]{0,99}$' }
        sort:
          type: array
          maxItems: 5
          items: { type: string, pattern: '^[A-Za-z]+(,(asc|desc))?$' }
        purpose: { type: string, minLength: 3, maxLength: 300, examples: [Client longlist review] }
        includeCompensation: { type: boolean, description: Default false. }
    ExportDecisionRequest:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
          description: Required to reject.
    ExportJob:
      type: object
      required: [id, entity, status, rowCount, columns, purpose, includeCompensation, requestedBy, requestedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        entity: { $ref: '#/components/schemas/ListEntity' }
        status: { $ref: '#/components/schemas/ExportStatus' }
        filterKeys:
          type: array
          description: The filter keys used (values are kept, except free text `q` and `cv`, which are stored only as present).
          items: { type: string }
        filters:
          type: object
          description: Filters without free text.
          additionalProperties: { $ref: '#/components/schemas/FilterValue' }
        rowCount: { type: integer, minimum: 0 }
        columns:
          type: array
          items: { type: string }
        purpose: { type: string }
        includeCompensation: { type: boolean }
        requestedBy: { $ref: '#/components/schemas/UserRef' }
        requestedAt: { type: string, format: date-time }
        decidedBy:
          oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }]
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'] }
        readyAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
    ExportJobPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ExportJob' }
        page: { $ref: '#/components/schemas/PageMeta' }
    ReportKind:
      type: string
      description: '`contracts/enums/ReportKind.java`.'
      enum: [SHORTLIST, PROGRESS, CANDIDATE_PROFILE]
    ClientReportRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/ReportKind' }
        language:
          $ref: '#/components/schemas/Language'
          description: Defaults to the account's preferred language, else TR.
        blind: { type: boolean, description: Default false. }
        personIds:
          type: array
          maxItems: 30
          uniqueItems: true
          description: SHORTLIST (subset, report order follows rank) and CANDIDATE_PROFILE (exactly one).
          items: { $ref: '#/components/schemas/Id' }
        periodFrom: { type: string, format: date, description: PROGRESS only; defaults to 14 days ago. }
        coverNote: { type: [string, 'null'], maxLength: 2000 }
    ClientReport:
      type: object
      required: [id, jobOrderId, kind, version, language, blind, personCount, excluded, generatedBy, generatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        jobOrderId: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/ReportKind' }
        version: { type: integer, minimum: 1 }
        language: { $ref: '#/components/schemas/Language' }
        blind: { type: boolean }
        personCount: { type: integer, minimum: 0 }
        excluded:
          type: array
          description: People left out because they may not be shared (only in the generate response; empty when read later).
          items: { $ref: '#/components/schemas/ShareCheckResult' }
        blindWarnings:
          type: array
          description: Blind only; free-text fields that still contain a name or employer.
          items:
            type: object
            required: [personId, field]
            properties:
              personId: { $ref: '#/components/schemas/Id' }
              field: { type: string, examples: [summary] }
        sizeBytes: { type: integer, minimum: 0 }
        generatedBy: { $ref: '#/components/schemas/UserRef' }
        generatedAt: { type: string, format: date-time }
        sentOn: { type: [string, 'null'], format: date }
        sentBy:
          oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }]
    ClientReportSentRequest:
      type: object
      properties:
        sentOn: { type: string, format: date, description: Defaults to today. }
