          items: { $ref: '#/components/schemas/ConsentRequest' }
        page: { $ref: '#/components/schemas/PageMeta' }
    ConsentRequestCreateRequest:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/Language'
          description: Defaults to TR.
        purpose:
          $ref: '#/components/schemas/ConsentRequestPurpose'
          description: Since 1.2.0. Defaults to INITIAL; RENEWAL only while consent is GIVEN.
    ConsentRequestBulkRequest:
      type: object
      properties:
