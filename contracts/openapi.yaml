    get:
      tags: [Commercial]
      operationId: getPlacement
      summary: One placement
      description: '`compensation` only for MANAGER/ADMIN and the job order owner or team; others get null and `compensationRestricted: true`. A read with compensation writes an access-log VIEW row (entity PLACEMENT).'
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      responses:
        '200':
