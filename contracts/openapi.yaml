      operationId: approveExport
      summary: Approve a pending export (the file is built with the filters as they match now)
      description: Not PENDING_APPROVAL → 409 `STATE_CONFLICT`. A manager cannot approve their own request (403).
      x-roles: [MANAGER, ADMIN]
      x-owner: security / security-privacy
      requestBody:
