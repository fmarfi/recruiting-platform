  # ---------- 1.1.0 (Wave 2a): saved views and bulk actions (ADR 0010) ----------
  /views:
    get:
      tags: [Saved views]
      operationId: listViews
      summary: Saved list views the current user can see (own private views plus all shared views)
      description: |
        Returns the caller's PRIVATE views and every SHARED view, optionally for one entity, ordered by
        name. Other users' private views are never returned. Plain array: a user has at most 50 private
        views per entity (ASSUMPTION, ADR 0010).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - name: entity
          in: query
          description: Only views of this grid.
          schema: { $ref: '#/components/schemas/ListEntity' }
      responses:
        '200':
          description: Views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Saved views]
      operationId: createView
      summary: Save the current filters, columns, sort and grouping of a grid as a view
      description: |
        The owner is the current user. `definition.filters` is validated per entity (see
        `ViewDefinition`); an unknown key or a bad value gives 400 `VALIDATION_FAILED` with
        `field = definition.filters.<key>`. **ASSUMPTION (open question for the client):** only MANAGER and
        ADMIN may create or switch a view to SHARED; a consultant gets 403 `FORBIDDEN`. Same name for the
        same owner and entity gives 409 `DUPLICATE`. A 51st private view of the same entity gives 400
        `VALIDATION_FAILED` with `errors[0] = {field: entity, code: LIMIT}` (cap 50, ADR 0010).
        **SHARED views never store `q`** (free text can hold a person's name; ADR 0010 amendment 2):
        the server removes `definition.filters.q` when a view is created or switched as SHARED, and the
        UI warns before sharing a view that has one.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedViewCreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /views/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Saved views]
      operationId: updateView
      summary: Rename a view, change its visibility or replace its definition
      description: |
        `definition` is replaced as a whole. The entity cannot change. Who may change a view: its owner,
        and MANAGER/ADMIN for SHARED views. Another user's PRIVATE view gives 404 (its existence is not
        revealed); a consultant changing someone else's SHARED view, or switching a view to SHARED, gets
        403 `FORBIDDEN` (views are personal settings, not business records, so the pilot rule "any
        consultant may change any record" does not apply; ADR 0010). Send `version` for optimistic locking
        (409 `VERSION_CONFLICT`). An empty body (`{}`, or only `version`) gives 400 `VALIDATION_FAILED`.
        Switching to SHARED, or saving a SHARED view, removes `filters.q` (ADR 0010 amendment 2).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedViewUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Saved views]
      operationId: deleteView
      summary: Delete a view
      description: Same permission rule as `PATCH /views/{id}`. Hard delete; views hold no personal data.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bulk-actions:
    post:
      tags: [Bulk actions]
      operationId: runBulkAction
      summary: Apply one action to many selected records of a grid, with a result per record
      description: |
        Synchronous; at most 500 ids. Each record is processed on its own (own transaction), so **partial
        success is normal**: the response is 200 with one `BulkRecordResult` per requested id, in request
        order. 400 only when the request as a whole is invalid (more than 500 ids, `params` that do not fit
        the action, an action not allowed for the entity).

        Rules (ADR 0010):
        - **Through the normal services, never around them.** `CHANGE_STATUS` runs the same lifecycle check
          as `PATCH .../status` (transition table, reason rule, manager-only moves, data guards); a record
          that cannot move is `FAILED` with `ILLEGAL_TRANSITION`, `TRANSITION_GUARD_FAILED`,
          `REASON_REQUIRED` or `FORBIDDEN`. Every change publishes the usual domain events (timeline) and
          writes an Envers revision.
        - **Consent gate.** Actions that contact people (`REQUEST_CONSENT`, and every later contact action
          such as templated e-mail) only go to people with a valid basis; others are `SKIPPED` with an
          explicit code (`NO_EMAIL`, `CONSENT_GIVEN`, `CONSENT_REFUSED`, `CONSENT_WITHDRAWN`,
          `REQUEST_PENDING`, `ANONYMISED`, `NO_CONSENT_BASIS`), never silently dropped. Bulk does not re-ask
          people who refused or withdrew; use the single `POST /people/{id}/consent/requests` for that.
        - **Audit.** Every requested id gets an audit entry (`bulk_action_item`) with its outcome and code,
          including SKIPPED and FAILED ones, linked to one `bulk_action` row with the actor and the params.
          **No personal data in the audit (since 1.1.1):** the stored params keep ids, enum names, dates,
          the tag and the language only; the free-text `SetNextActionParams.title` and
          `ChangeStatusParams.reason` are applied to the records but never stored in `bulk_action`. The
          item row stores no message; `message` in the response is the fixed text of the code.
        - Records that already have the requested value (same owner, tag already there or missing, same
          status) are `SKIPPED` with `NO_CHANGE`; unknown ids are `FAILED` with `NOT_FOUND`.

        Entities per action: `REASSIGN_OWNER`, `ADD_TAG`, `REMOVE_TAG` all; `CHANGE_STATUS` ACCOUNTS,
        JOB_ORDERS, PROPOSALS (`params.status` must be a value of that entity's lifecycle);
        `SET_NEXT_ACTION` PEOPLE, ACCOUNTS, JOB_ORDERS (one next action per record, linked to it);
        `REQUEST_CONSENT` PEOPLE only and MANAGER/ADMIN only, like the consent campaign (403 `FORBIDDEN`
        for consultants; ASSUMPTION).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline (dispatcher, audit); handlers in accounts (backend-accounts) and privacy (security-privacy)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkActionRequest' }
            examples:
              changeStatus:
                summary: Cancel two job orders with a reason
                value:
                  entity: JOB_ORDERS
                  ids: [0192a5b8-0000-7000-8000-0000000000a1, 0192a5b8-0000-7000-8000-0000000000a2]
                  action: CHANGE_STATUS
                  params: { status: CANCELLED, reason: Client froze hiring for this year }
              requestConsent:
                summary: Ask three people for KVKK consent
                value:
                  entity: PEOPLE
                  ids: [0192a5b8-0000-7000-8000-000000000101, 0192a5b8-0000-7000-8000-000000000102, 0192a5b8-0000-7000-8000-000000000103]
                  action: REQUEST_CONSENT
                  params: { language: TR }
      responses:
        '200':
          description: Processed; see the result of each record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkActionResult' }
              example:
                id: 0192a5b8-0000-7000-8000-00000000b001
                entity: PEOPLE
                action: REQUEST_CONSENT
                requested: 3
                ok: 1
                skipped: 2
                failed: 0
                results:
                  - { id: 0192a5b8-0000-7000-8000-000000000101, outcome: OK, code: null, message: null }
                  - { id: 0192a5b8-0000-7000-8000-000000000102, outcome: SKIPPED, code: NO_EMAIL, message: The person has no e-mail address. }
                  - { id: 0192a5b8-0000-7000-8000-000000000103, outcome: SKIPPED, code: CONSENT_WITHDRAWN, message: 'Consent was withdrawn; bulk requests do not re-ask.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ---------- 1.2.0: candidate pool, files, duplicates, exposure, off-limits, sharing guard (ADR 0011) ----------
  /people/{id}/files:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Candidate files]
      operationId: listPersonFiles
      summary: CVs (all versions, newest first) and documents of a person
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PersonFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Candidate files]
      operationId: uploadPersonFile
      summary: Upload a CV or document for a known person (drag and drop on the person page)
      description: |
        Max 10 MB. Accepted types (detected from the bytes by Tika, not from the file name): PDF, DOCX,
        DOC, RTF, ODT, TXT; else 415 `UNSUPPORTED_MEDIA_TYPE`. A CV becomes the person's current CV with
        `version` = previous + 1; older versions stay until the retention period ends. The same bytes
        (SHA-256) uploaded twice for the same person give 409 `DUPLICATE` with `existingId`.
        Text extraction runs asynchronously (`textStatus` PENDING, then DONE, NO_TEXT or FAILED).
        Publishes `PersonFileUploaded`; for a CV, privacy then sends the KVKK notice and consent e-mail
        when `autoSendOnCvUpload` is on and the person has an e-mail, no GIVEN consent and no request
        younger than 7 days (REFUSED/WITHDRAWN people are not re-asked automatically). Anonymised
        people: 409 `STATE_CONFLICT`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: The file; its original name is kept as `fileName`.
                kind: { $ref: '#/components/schemas/PersonFileKind' }
      responses:
        '201':
          description: Stored; text extraction queued
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
  /people/{id}/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/FileIdPath'
    delete:
      tags: [Candidate files]
      operationId: deletePersonFile
      summary: Delete one file (row and bytes)
      description: Hard delete, recorded by Envers (DEL revision without file data). Deleting the current CV makes the next older version current. The bytes are removed after the commit.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /people/{id}/files/{fileId}/content:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/FileIdPath'
    get:
      tags: [Candidate files]
      operationId: downloadPersonFile
      summary: Download the file
      description: Recorded in the access log (DOWNLOAD, entity PERSON_FILE). Always served as an attachment with `application/octet-stream` and `X-Content-Type-Options nosniff`, never rendered inline.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: File bytes
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename*=UTF-8''<fileName>
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cv-intake:
    get:
      tags: [CV intake]
      operationId: listCvIntake
      summary: Uploaded CVs that are not yet attached to a person
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - name: status
          in: query
          description: Default PENDING.
          schema:
            type: array
            items: { $ref: '#/components/schemas/CvIntakeStatus' }
          style: form
          explode: true
        - name: uploadedBy
          in: query
          description: Only items uploaded by this user (`me` is resolved by the client).
          schema: { $ref: '#/components/schemas/Id' }
        - name: batchId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of intake items, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvIntakeItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [CV intake]
      operationId: uploadCvIntake
      summary: Bulk (or single) CV upload for people who may not exist yet
      description: |
        1 to 50 files, each at most 10 MB, same types as `POST /people/{id}/files`. Files that fail
        size or type are listed in `rejected`; the others become PENDING intake items. For each item the
        server extracts the text (Tika, async) and finds e-mail addresses, phone numbers and LinkedIn URLs
        with plain patterns (no AI parsing), then runs the duplicate check on them (`duplicates`). The
        consultant attaches each item to a matching person or creates a new one
        (`POST /cv-intake/{id}/attach`). **Pending items and their files are deleted after 14 days**
        (ASSUMPTION, ADR 0011): no consent e-mail goes out before a person exists.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  description: One `files` part per file (repeat the part name). Declared as one file or an array because the Prism mock does not collect repeated parts into an array.
                  oneOf:
                    - type: string
                      contentMediaType: application/octet-stream
                    - type: array
                      minItems: 1
                      maxItems: 50
                      items:
                        type: string
                        contentMediaType: application/octet-stream
                sourceChannel:
                  $ref: '#/components/schemas/SourceChannel'
                  description: Proposed source channel for the people created from this batch (default CV_UPLOAD).
      responses:
        '201':
          description: Batch accepted (some files may be rejected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvIntakeBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/Problem' }
  /cv-intake/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [CV intake]
      operationId: getCvIntakeItem
      summary: One intake item (poll `textStatus` and `detected`)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvIntakeItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [CV intake]
      operationId: discardCvIntakeItem
      summary: Discard a pending item; its file and extracted text are deleted
      description: The row stays as DISCARDED with no file name, text or detected values (minimised). Not PENDING gives 409 `STATE_CONFLICT`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '204': { description: Discarded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cv-intake/{id}/content:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [CV intake]
      operationId: downloadCvIntakeFile
      summary: Download the uploaded file of a pending item
      description: Recorded in the access log (DOWNLOAD, entity CV_INTAKE_ITEM). Served as an attachment like person files.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: File bytes
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename*=UTF-8''<fileName>
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cv-intake/{id}/attach:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [CV intake]
      operationId: attachCvIntakeItem
      summary: Attach a pending CV to an existing person, or create the person from it
      description: |
        Either `personId` (attach as the person's new current CV) or `person` (create, exactly like
        `POST /people`, then attach). The file becomes a `person_file` (kind CV) and the item ATTACHED;
        its text and detected values are removed from the intake row. Publishes `PersonCreated` (new
        person) and `PersonFileUploaded`, so the consent e-mail rule of `POST /people/{id}/files`
        applies. A new person whose e-mail exists gives 409 `DUPLICATE` with `existingId` (attach to that
        person instead). Not PENDING gives 409 `STATE_CONFLICT`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CvIntakeAttachRequest' }
      responses:
        '201':
          description: Attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvIntakeAttachResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /duplicates/check:
    post:
      tags: [Duplicates]
      operationId: checkDuplicates
      summary: Find people who may be the same person, before creating or saving one (B-04)
      description: |
        Matches on e-mail (case-insensitive), phone (normalised to digits with country code, default +90),
        LinkedIn URL (normalised) and name + current company (accent- and case-insensitive, exact after
        normalising). Anonymised people never match. Returns at most 10 matches, strongest first (EMAIL,
        LINKEDIN_URL, PHONE, NAME_COMPANY). Read-only; nothing is queued.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateCheckRequest' }
      responses:
        '200':
          description: Matches (empty array when none)
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items: { $ref: '#/components/schemas/DuplicateMatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /duplicates:
    get:
      tags: [Duplicates]
      operationId: listDuplicates
      summary: Duplicate queue — pairs found after create, update, CV attach and by the nightly scan
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - name: status
          in: query
          description: Default OPEN.
          schema:
            type: array
            items: { $ref: '#/components/schemas/DuplicateStatus' }
          style: form
          explode: true
        - $ref: '#/components/parameters/PersonIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of duplicate pairs, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateCandidatePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /duplicates/{id}/dismiss:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Duplicates]
      operationId: dismissDuplicate
      summary: Mark a pair as different people; it is not proposed again
      description: Only OPEN pairs (else 409 `STATE_CONFLICT`).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Dismissed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateCandidate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /people/{id}/merge:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Duplicates]
      operationId: mergePeople
      summary: Merge another person into this one (the survivor); audited, not reversible
      description: |
        One transaction, orchestrated by `privacy` (the only module allowed to reach accounts, pipeline
        and privacy, ADR 0001/0011):
        1. accounts: copy the fields named in `takeFromMerged` from the merged person (others keep the
           survivor's value; empty survivor fields are filled from the merged person), union the tags
           (at most 20), append employments, educations and languages that the survivor lacks, move
           files (CV versions renumbered by upload time), contacts and network links (duplicates and
           self-links dropped), close duplicate pairs of both as MERGED.
        2. pipeline: move applications (if both are on the same job order, keep the further stage and
           drop the other), activities, next actions, exposures and timeline `person_id`.
        3. privacy: move consent records and requests; the survivor's consent status becomes the latest
           decision of the two; recompute the retention clock; move DSRs.
        4. accounts: write `person_merge(survivor_id, merged_id)`, delete the merged person through
           JPA (Envers DEL row), publish `PersonMerged`.
        The `_aud` purge of the survivor later also covers the merged id (via `person_merge`).
        Errors: same id, or either person anonymised → 409 `STATE_CONFLICT`; `version` mismatch on the
        survivor → 409 `VERSION_CONFLICT`. **ASSUMPTION:** MANAGER/ADMIN only (403 for consultants).
      x-roles: [MANAGER, ADMIN]
      x-owner: privacy / security-privacy (orchestration); steps in accounts (backend-accounts) and pipeline (backend-pipeline)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonMergeRequest' }
      responses:
        '200':
          description: Merged; the survivor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /people/{id}/exposure:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Exposure]
      operationId: listPersonExposure
      summary: Which client accounts saw this person, for which job order, when, and the outcome (B-05)
      description: |
        One entry per presentation, newest first: the first move of an application to PRESENTED
        (channel PIPELINE; Wave 2d adds REPORT and SHARE_LINK). `stage` is the application's current
        stage, i.e. the outcome so far (null if the application was removed). Exposures are kept when
        the person is anonymised (ids and dates only) and deleted with the person.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      parameters:
        - $ref: '#/components/parameters/AccountIdQuery'
      responses:
        '200':
          description: Exposures
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExposureEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /off-limits:
    get:
      tags: [Off-limits]
      operationId: listOffLimitsRules
      summary: Companies the firm must not recruit from
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - $ref: '#/components/parameters/AccountIdQuery'
        - name: active
          in: query
          description: '`true`: rules in force today (`startsOn <= today` and `endsOn` null or `>= today`); `false`: ended or future ones; omitted: all rules.'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OffLimitsRulePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Off-limits]
      operationId: createOffLimitsRule
      summary: Mark a client account or another company as off-limits
      description: |
        Exactly one of `accountId` (a client in the CRM) or `companyName` (a company that is not an
        account). The guard compares the person's current company with the account name or
        `companyName` (accent- and case-insensitive, trimmed). An active rule for the same account or
        company gives 409 `DUPLICATE` with `existingId`. **ASSUMPTION:** MANAGER/ADMIN only.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OffLimitsRuleCreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OffLimitsRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /off-limits/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Off-limits]
      operationId: getOffLimitsRule
      summary: One rule
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OffLimitsRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Off-limits]
      operationId: updateOffLimitsRule
      summary: Change reason, note or dates (end a rule by setting `endsOn`)
      description: The target (account or company) cannot change; create a new rule instead.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OffLimitsRuleUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OffLimitsRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Off-limits]
      operationId: deleteOffLimitsRule
      summary: Delete a rule entered by mistake (Envers keeps the history; prefer `endsOn`)
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /consent/share-check:
    post:
      tags: [Consent]
      operationId: checkShareable
      summary: Which of these people may be shared with a client (sharing guard)
      description: |
        A person is shareable only with consent GIVEN and not anonymised (ADR 0011). The UI calls this
        before presenting people or (Wave 2d) adding them to a report or share link; the server enforces
        the same rule with 409 `CONSENT_REQUIRED`. Unknown ids are left out of the result.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: privacy / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareCheckRequest' }
      responses:
        '200':
          description: One result per known id, in request order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShareCheckResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ---------- 1.3.0: archive, restore, merge (ADR 0013) ----------
  /accounts/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: archiveAccount
      summary: Archive an account (soft delete; restorable)
      description: |
        Sets `archivedAt`, `archivedBy`, `archiveReason` and `archiveNote` (Envers revision, timeline
        entry ARCHIVE, `ArchiveStateChanged`). The account leaves every list, search, picker and the
        command bar unless `archived=true` is asked for; `GET /accounts/{id}` still returns it.
        Guard: no job order of the account may be open and not archived (409 `TRANSITION_GUARD_FAILED`
        with the job orders as `blockingItems`). `MERGED` is not allowed here (use merge; 400).
        Archiving an archived account returns it unchanged. Archived records reject every change
        except restore with 409 `ARCHIVED`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounts/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: restoreAccount
      summary: Restore an archived account
      description: Clears the archive fields (Envers, timeline ARCHIVE, `ArchiveStateChanged(archived=false)`). A MERGED account cannot be restored (409 `STATE_CONFLICT`). Restoring a record that is not archived returns it unchanged.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounts/{id}/merge:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: mergeAccounts
      summary: Merge another account into this one (the survivor); audited, not reversible
      description: |
        One transaction, orchestrated by `accounts` (ADR 0013):
        1. accounts: fill empty survivor fields from the merged account (fields in `takeFromMerged`
           overwrite), union the tags (at most 20, else 409 `STATE_CONFLICT`), move contacts (a person
           who is an active contact of both keeps the survivor's row; the merged one is ended; the
           survivor's primary contact wins), off-limits rules, child accounts (`parentAccountId`) and
           the `account_open_job` projection.
        2. pipeline (`AccountMergeParticipant`): move job orders, proposals, activities, next actions,
           timeline entries, candidate exposures, agreements, placements, conflict checks and target
           companies that point at the merged account.
        3. accounts: archive the merged account with reason `MERGED` and `mergedInto` = survivor,
           write `account_merge` (counts only), publish `AccountMerged`; timeline entry MERGE.
        Errors: same id, either account archived, or the merged account is the survivor's parent or
        child chain → 409 `STATE_CONFLICT`; survivor `version` mismatch → 409 `VERSION_CONFLICT`.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts (orchestration); pipeline step by backend-pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountMergeRequest' }
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountMergeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /job-orders/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: archiveJobOrder
      summary: Archive a job order (soft delete; restorable)
      description: |
        Guard: no active application (stage not PLACED or REJECTED) — 409 `TRANSITION_GUARD_FAILED` with
        the applications as `blockingItems` (type APPLICATION). The status is kept; while archived the
        job order counts as not open (`account_open_job.open = false`). Timeline ARCHIVE,
        `ArchiveStateChanged`. Archived job orders reject changes, new applications and stage moves with
        409 `ARCHIVED`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /job-orders/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: restoreJobOrder
      summary: Restore an archived job order
      description: Fails with 409 `ARCHIVED` while its account is archived (restore the account first).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /proposals/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: archiveProposal
      summary: Archive a proposal in any status (soft delete; restorable)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /proposals/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: restoreProposal
      summary: Restore an archived proposal
      description: Fails with 409 `ARCHIVED` while its account is archived.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proposal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /people/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: archivePerson
      summary: Archive a person (hide from the pool; not an erasure)
      description: |
        Hides the person from `GET /people`, search, candidate suggestions and pickers. Archiving is
        **not** anonymisation or deletion: consent, retention clock and DSR rules run unchanged (ADR 0009
        stays the only erasure path). Guard: no active application (409 `TRANSITION_GUARD_FAILED`, type
        APPLICATION). An archived person cannot be added to a job order (409 `ARCHIVED`). `archiveNote`
        is personal data (scrubbed on anonymisation).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /people/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: restorePerson
      summary: Restore an archived person
      description: An anonymised person cannot be restored to the pool (409 `STATE_CONFLICT`).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  # ---------- 1.3.0: tag management (ADR 0013) ----------
  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: Every tag in use or defined, with colour, pool flag and usage counts
      description: Union of the distinct values in the `tags` arrays of accounts, people, job orders and proposals (archived records included in the counts) with the `tag_definition` rows. Tags without a definition have colour GREY and `defined=false`. Default sort `name,asc`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: entity
          in: query
          description: Only tags used on this entity.
          schema: { $ref: '#/components/schemas/ListEntity' }
        - name: talentPool
          in: query
          description: '`true`: only talent pools.'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: 'Sortable: `name`, `total`. Default `name,asc`.'
          schema:
            type: array
            items: { type: string }
      responses:
        '200':
          description: Page of tags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagSummaryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tags/{tag}:
    parameters:
      - $ref: '#/components/parameters/TagPath'
    put:
      tags: [Tags]
      operationId: defineTag
      summary: Create or change a tag's definition (colour, description, talent pool flag)
      description: Creates the `tag_definition` row when missing (the tag need not be in use yet). Does not touch any record.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagDefinitionRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Tags]
      operationId: deleteTag
      summary: Remove the tag from every record and delete its definition
      description: Set-based rewrite of the `tags` arrays (no Envers revision per record, `version` bumped; ADR 0013), `tag_definition` deleted (Envers), `TagChanged(DELETED)` published so pipeline rewrites job orders and proposals. Shared saved views that filter on the tag keep the filter and return no rows. Unknown tag → 404.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Deleted; records changed in accounts (pipeline follows asynchronously)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagChangeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tags/{tag}/rename:
    parameters:
      - $ref: '#/components/parameters/TagPath'
    post:
      tags: [Tags]
      operationId: renameTag
      summary: Rename a tag on every record
      description: The new name must not be in use (409 `DUPLICATE`; merge instead). Moves the definition, rewrites the arrays like delete, publishes `TagChanged(RENAMED)`. Shared saved views with a `tag` filter on the old name are rewritten too.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagRenameRequest' }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagChangeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tags/{tag}/merge:
    parameters:
      - $ref: '#/components/parameters/TagPath'
    post:
      tags: [Tags]
      operationId: mergeTag
      summary: Merge this tag into another one on every record
      description: Replaces the path tag by `into` (no duplicates in an array; the count never grows, so the 20-tag limit holds), deletes the path tag's definition (the target keeps its own), rewrites saved views, publishes `TagChanged(MERGED)`. `into` equal to the path tag → 400.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagMergeRequest' }
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagChangeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie set by `POST /auth/login`. With the mock server any value works (e.g. `JSESSIONID=mock`).
  headers:
    Location:
      description: URL of the created resource
      schema: { type: string, format: uri-reference }
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    FileIdPath:
      name: fileId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Q:
      name: q
      in: query
      description: Free-text filter (accent- and case-insensitive).
      schema: { type: string, maxLength: 200 }
    Page:
      name: page
      in: query
      description: Page number, 0-based.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: '`property,asc|desc`; repeat for several keys.'
      schema:
        type: array
        items: { type: string, pattern: '^[A-Za-z]+(,(asc|desc))?$' }
      style: form
      explode: true
    OwnerId:
      name: ownerId
      in: query
      description: Responsible user.
      schema: { $ref: '#/components/schemas/Id' }
    AccountIdQuery:
      name: accountId
      in: query
      schema: { $ref: '#/components/schemas/Id' }
    PersonIdQuery:
      name: personId
      in: query
      schema: { $ref: '#/components/schemas/Id' }
    JobOrderIdQuery:
      name: jobOrderId
      in: query
      schema: { $ref: '#/components/schemas/Id' }
    TagPath:
      name: tag
      in: path
      required: true
      description: The tag, URL-encoded; matched lower-case.
      schema: { $ref: '#/components/schemas/Tag' }
    Archived:
      name: archived
      in: query
      description: 'Since 1.3.0 (ADR 0013). Omitted or `false`: only records that are not archived (the 1.2 behaviour, because nothing was archived before); `true`: only archived records (the "Archived" view).'
      schema: { type: boolean, default: false }
  responses:
    BadRequest:
      description: Validation failed (`VALIDATION_FAILED`) or a reason is missing (`REASON_REQUIRED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:reason-required
            title: Reason required
            status: 400
            detail: A reason is required to move to Rejected.
            code: REASON_REQUIRED
            requestedStatus: REJECTED
            errors:
              - { field: reason, code: REQUIRED, message: A reason is required. }
    Unauthorized:
      description: Not logged in, session expired (`UNAUTHENTICATED`) or wrong credentials (`BAD_CREDENTIALS`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:unauthenticated
            title: Not logged in
            status: 401
            code: UNAUTHENTICATED
    Forbidden:
      description: The role does not allow this action (`FORBIDDEN`). Never returned for record ownership; any consultant may change any record (ADR 0007).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:forbidden
            title: Not allowed
            status: 403
            detail: Only managers and admins can close an account.
            code: FORBIDDEN
    NotFound:
      description: No such record (`NOT_FOUND`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:not-found
            title: Not found
            status: 404
            detail: Account 0192a5b8-0000-7000-8000-000000000001 does not exist.
            code: NOT_FOUND
    Conflict:
      description: |
        `ILLEGAL_TRANSITION` (with `currentStatus`, `requestedStatus`, `allowed`),
        `TRANSITION_GUARD_FAILED` (with `blockingItems` where records block the move), `VERSION_CONFLICT`,
        `DUPLICATE` (with `existingId`) or `STATE_CONFLICT`; since 1.2.0 also `CONSENT_REQUIRED` (sharing
        guard) and `OFF_LIMITS` (off-limits guard), both with `blockingItems[].reasonCode`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          examples:
            consentRequired:
              summary: Presenting a person without valid consent (sharing guard, 1.2.0)
              value:
                type: urn:recruiting:problem:consent-required
                title: Consent required
                status: 409
                detail: This person has not given consent yet. Send the consent request first.
                code: CONSENT_REQUIRED
                blockingItems:
                  - id: 0192a5b8-0000-7000-8000-000000000102
                    title: Elif Yıldırım
                    type: PERSON
                    reasonCode: CONSENT_PENDING
            offLimits:
              summary: Adding a person who works at an off-limits company (1.2.0)
              value:
                type: urn:recruiting:problem:off-limits
                title: Off-limits company
                status: 409
                detail: The person works at an off-limits company.
                code: OFF_LIMITS
                blockingItems:
                  - id: 0192a5b8-0000-7000-8000-00000000d001
                    title: Anadolu Lojistik
                    type: OFF_LIMITS_RULE
                    reasonCode: CLIENT_AGREEMENT
            illegalTransition:
              summary: Move outside the transition table
              value:
                type: urn:recruiting:problem:illegal-transition
                title: Illegal status change
                status: 409
                detail: Cannot move from Filled to Sourcing.
                code: ILLEGAL_TRANSITION
                currentStatus: FILLED
                requestedStatus: SOURCING
                allowed: []
            closeAccountBlocked:
              summary: Closing an account that still has open job orders (A-02)
              value:
                type: urn:recruiting:problem:transition-guard-failed
                title: Move not allowed
                status: 409
                detail: The account has 1 open job order. Close or cancel it first.
                code: TRANSITION_GUARD_FAILED
                currentStatus: ACTIVE
                requestedStatus: CLOSED
                blockingItems:
                  - id: 0192a5b8-0000-7000-8000-0000000000a1
                    title: Chief Financial Officer
                    type: JOB_ORDER
    Gone:
      description: The consent link has expired (`GONE`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Problem:
      description: Other error (see `code`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
  schemas:
    # ---------- common ----------
    Id:
      type: string
      format: uuid
      description: UUID v7 (ADR 0004)
      examples: [0192a5b8-6f1e-7c3a-9b2d-3f4e5a6b7c8d]
    Version:
      type: integer
      format: int64
      minimum: 0
      description: Optimistic-lock version; send it back on updates.
    Reason:
      type: [string, 'null']
      minLength: 3
      maxLength: 500
      description: Why the status changes. Trimmed by the server; after trimming it must be 3 to 500 characters. Required for some moves (see API description).
    PageMeta:
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size: { type: integer, examples: [20] }
        number: { type: integer, description: 0-based page number, examples: [0] }
        totalElements: { type: integer, format: int64, examples: [42] }
        totalPages: { type: integer, examples: [3] }
    ProblemDetail:
      type: object
      description: RFC 9457 problem details with extension members.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, examples: [urn:recruiting:problem:validation-failed] }
        title: { type: string, examples: [Validation failed] }
        status: { type: integer, examples: [400] }
        detail: { type: string }
        instance: { type: string, format: uri-reference, description: Request path }
        code: { $ref: '#/components/schemas/ErrorCode' }
        errors:
          type: array
          description: Field errors for VALIDATION_FAILED and REASON_REQUIRED.
          items: { $ref: '#/components/schemas/FieldError' }
        currentStatus: { type: string, description: ILLEGAL_TRANSITION and TRANSITION_GUARD_FAILED }
        requestedStatus: { type: string, description: 'ILLEGAL_TRANSITION, TRANSITION_GUARD_FAILED and REASON_REQUIRED' }
        allowed:
          type: array
          items: { type: string }
          description: ILLEGAL_TRANSITION — the statuses the record may move to.
        existingId:
          $ref: '#/components/schemas/Id'
          description: DUPLICATE — the record that already exists.
        blockingItems:
          type: array
          description: TRANSITION_GUARD_FAILED — the records that block the move (e.g. open job orders when closing an account).
          items:
            type: object
            required: [id, title, type]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              title: { type: string, examples: [Chief Financial Officer] }
              type: { type: string, description: Entity kind, examples: [JOB_ORDER] }
              reasonCode:
                type: string
                description: 'Since 1.2.0. CONSENT_REQUIRED: a `ShareBlockReason` (type PERSON); OFF_LIMITS: an `OffLimitsReason` (type OFF_LIMITS_RULE).'
                examples: [CONSENT_PENDING]
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, examples: [name] }
        code: { type: string, description: 'Bean Validation constraint, e.g. REQUIRED, SIZE, EMAIL, PATTERN', examples: [REQUIRED] }
        message: { type: string, examples: [must not be blank] }
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Deniz Aksoy] }
    AccountRef:
      type: object
      required: [id, name, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Örnek Gıda A.Ş.] }
        status: { $ref: '#/components/schemas/AccountStatus' }
    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Elif Yıldırım] }
    JobOrderRef:
      type: object
      required: [id, title, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string, examples: [Chief Financial Officer] }
        status: { $ref: '#/components/schemas/JobOrderStatus' }
    # ---------- enums (contracts/enums) ----------
    AccountStatus:
      type: string
      enum: [LEAD, PROPOSAL_SENT, ACTIVE, ON_HOLD, CLOSED]
    ProposalStatus:
      type: string
      enum: [DRAFT, SENT, ACCEPTED, REJECTED]
    JobOrderStatus:
      type: string
      enum: [OPEN, SOURCING, SHORTLIST_SENT, INTERVIEWING, OFFER, FILLED, CANCELLED]
    PipelineStage:
      type: string
      enum: [SOURCED, SCREENED, PRESENTED, CLIENT_INTERVIEW, OFFER, PLACED, REJECTED]
    ConsentStatus:
      type: string
      enum: [NOT_SENT, SENT, GIVEN, REFUSED, WITHDRAWN]
    DataSubjectRequestStatus:
      type: string
      enum: [RECEIVED, IN_PROGRESS, COMPLETED, REJECTED]
    DataSubjectRequestType:
      type: string
      enum: [ACCESS, CORRECTION, DELETION, OTHER]
    PersonType:
      type: string
      enum: [EXECUTIVE, CLIENT_CONTACT, REFERRER, CANDIDATE]
    ActivityType:
      type: string
      enum: [CALL, VISIT, MEETING, EMAIL, NOTE]
    LinkType:
      type: string
      enum: [KNOWS, WORKED_WITH, INTRODUCED, REFERRED, REPORTS_TO]
    Role:
      type: string
      enum: [CONSULTANT, MANAGER, ADMIN]
    ConsentDecision:
      type: string
      enum: [GIVEN, REFUSED, WITHDRAWN]
    ConsentChannel:
      type: string
      enum: [EMAIL_LINK, WEBSITE_FORM, IN_PERSON, PHONE, IMPORT]
    EmailDeliveryStatus:
      type: string
      enum: [QUEUED, SENT, FAILED]
    RetentionStatus:
      type: string
      enum: [ACTIVE, FLAGGED, ANONYMISED]
    RetentionBasis:
      type: string
      enum: [FROM_CREATED, FROM_LAST_CONTACT, FROM_LAST_CONSENT]
    RetentionAction:
      type: string
      enum: [ANONYMISE, DELETE]
    ImportKind:
      type: string
      enum: [ACCOUNTS, CONTACTS, PEOPLE]
    ImportStatus:
      type: string
      enum: [VALIDATED, IMPORTING, COMPLETED, FAILED, DISCARDED]
    TimelineKind:
      type: string
      enum: [ACCOUNT, ACCOUNT_STATUS, CONTACT, ACTIVITY, PROPOSAL, JOB_ORDER, CANDIDATE, ARCHIVE, MERGE, PLACEMENT]
    EntityType:
      type: string
      enum: [ACCOUNT, PERSON, CONTACT, NETWORK_LINK, JOB_ORDER, APPLICATION, PROPOSAL, ACTIVITY, NEXT_ACTION, USER, CONSENT_RECORD, CONSENT_REQUEST, PRIVACY_NOTICE, DATA_SUBJECT_REQUEST, IMPORT_JOB, PERSON_FILE, CV_INTAKE_ITEM, OFF_LIMITS_RULE, TAG, EVALUATION, INTERVIEW_NOTE, CANDIDATE_REFERENCE, CLIENT_FEEDBACK, TARGET_COMPANY, AGREEMENT, FEE_SCHEDULE_ITEM, PLACEMENT, CONFLICT_CHECK, EXPORT_JOB, CLIENT_REPORT]
    AccessAction:
      type: string
      enum: [VIEW, EXPORT, DOWNLOAD]
    RevisionType:
      type: string
      enum: [ADD, MOD, DEL]
    Language:
      type: string
      enum: [TR, EN]
    SearchType:
      type: string
      enum: [ACCOUNT, PERSON, JOB_ORDER]
    Tone:
      type: string
      enum: [NEUTRAL, INFO, PROGRESS, GOOD, WARN, BAD, MUTED]
    ErrorCode:
      type: string
      enum: [VALIDATION_FAILED, REASON_REQUIRED, UNAUTHENTICATED, BAD_CREDENTIALS, FORBIDDEN, NOT_FOUND, ILLEGAL_TRANSITION, TRANSITION_GUARD_FAILED, VERSION_CONFLICT, DUPLICATE, STATE_CONFLICT, CONSENT_REQUIRED, OFF_LIMITS, ARCHIVED, GONE, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, TOO_MANY_REQUESTS, INTERNAL_ERROR]
    # ---------- auth and users ----------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, examples: [deniz.aksoy@example.com] }
        password: { type: string, format: password, minLength: 1, maxLength: 200 }
    CurrentUser:
      type: object
      required: [id, email, name, role, language, mustChangePassword]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email, examples: [deniz.aksoy@example.com] }
        name: { type: string, examples: [Deniz Aksoy] }
        role: { $ref: '#/components/schemas/Role' }
        language: { $ref: '#/components/schemas/Language' }
        mustChangePassword: { type: boolean, examples: [false] }
    CurrentUserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        language: { $ref: '#/components/schemas/Language' }
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 12, maxLength: 200 }
    PasswordResetRequest:
      type: object
      required: [initialPassword]
      properties:
        initialPassword: { type: string, format: password, minLength: 12, maxLength: 200 }
    User:
      type: object
      required: [id, email, name, role, active, language, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        name: { type: string, examples: [Deniz Aksoy] }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean, examples: [true] }
        language: { $ref: '#/components/schemas/Language' }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    UserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { $ref: '#/components/schemas/PageMeta' }
    UserCreateRequest:
      type: object
      required: [email, name, role, initialPassword]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
        language: { $ref: '#/components/schemas/Language' }
        initialPassword: { type: string, format: password, minLength: 12, maxLength: 200 }
    UserUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
        language: { $ref: '#/components/schemas/Language' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- reference data ----------
    StatusDefinition:
      type: object
      required: [value, labelEn, labelTr, tone, terminal, next]
      properties:
        value: { type: string, examples: [ON_HOLD] }
        labelEn: { type: string, examples: [On hold] }
        labelTr: { type: string, examples: [Beklemede] }
        tone: { $ref: '#/components/schemas/Tone' }
        terminal: { type: boolean }
        next:
          type: array
          description: Allowed next statuses with their rules.
          items: { $ref: '#/components/schemas/TransitionDefinition' }
    TransitionDefinition:
      type: object
      required: [to, reasonRequired, managerOnly]
      properties:
        to: { type: string, examples: [CLOSED] }
        reasonRequired: { type: boolean, examples: [true] }
        managerOnly: { type: boolean, description: Only MANAGER and ADMIN may make this move., examples: [true] }
    LifecycleDefinition:
      type: object
      required: [initial, statuses]
      properties:
        initial: { type: string, examples: [LEAD] }
        statuses:
          type: array
          description: In display order.
          items: { $ref: '#/components/schemas/StatusDefinition' }
    ReferenceData:
      type: object
      required: [today, lifecycles, stageOrder, vocabularies, sectors]
      properties:
        today: { type: string, format: date, description: Server date (Europe/Istanbul). }
        lifecycles:
          type: object
          required: [account, proposal, jobOrder, pipelineStage, consent, dataSubjectRequest]
          properties:
            account: { $ref: '#/components/schemas/LifecycleDefinition' }
            proposal: { $ref: '#/components/schemas/LifecycleDefinition' }
            jobOrder: { $ref: '#/components/schemas/LifecycleDefinition' }
            pipelineStage: { $ref: '#/components/schemas/LifecycleDefinition' }
            consent: { $ref: '#/components/schemas/LifecycleDefinition' }
            dataSubjectRequest: { $ref: '#/components/schemas/LifecycleDefinition' }
        stageOrder:
          type: array
          description: Board columns, left to right (REJECTED last).
          items: { $ref: '#/components/schemas/PipelineStage' }
        vocabularies:
          type: object
          description: Values of the plain enums; labels come from the frontend i18n files.
          required: [personType, activityType, linkType, role, consentChannel, dataSubjectRequestType, language]
          properties:
            personType: { type: array, items: { $ref: '#/components/schemas/PersonType' } }
            activityType: { type: array, items: { $ref: '#/components/schemas/ActivityType' } }
            linkType: { type: array, items: { $ref: '#/components/schemas/LinkType' } }
            role: { type: array, items: { $ref: '#/components/schemas/Role' } }
            consentChannel: { type: array, items: { $ref: '#/components/schemas/ConsentChannel' } }
            dataSubjectRequestType: { type: array, items: { $ref: '#/components/schemas/DataSubjectRequestType' } }
            language: { type: array, items: { $ref: '#/components/schemas/Language' } }
        sectors:
          type: array
          description: Distinct sectors in use, sorted (free text on the account, suggested in pickers).
          items: { type: string }
          examples: [[Finance, FMCG, Retail, Technology]]
    # ---------- accounts ----------
    Account:
      type: object
      required: [id, name, sector, owner, status, statusChangedAt, openedOn, openJobCount, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Örnek Gıda A.Ş.] }
        sector: { type: string, examples: [FMCG] }
        city: { type: [string, 'null'], examples: [İstanbul] }
        website: { type: [string, 'null'], format: uri }
        notes: { type: [string, 'null'] }
        owner: { $ref: '#/components/schemas/UserRef' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        statusChangedAt: { type: string, format: date-time }
        openedOn: { type: string, format: date }
        openJobCount: { type: integer, minimum: 0, description: Job orders not FILLED or CANCELLED., examples: [2] }
        lastActivityAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
        archive:
          oneOf: [{ $ref: '#/components/schemas/ArchiveInfo' }, { type: 'null' }]
          description: Since 1.3.0. Null while not archived.
        legalName: { type: [string, 'null'], description: 'Since 1.3.0. Registered name (ticari unvan), used on invoices.', examples: [Örnek Gıda Sanayi ve Ticaret A.Ş.] }
        taxId: { type: [string, 'null'], description: 'Since 1.3.0. VKN, TCKN or a foreign tax id as entered; no format check in 1.3.' }
        taxOffice: { type: [string, 'null'], examples: [Boğaziçi Kurumlar] }
        mersisNo: { type: [string, 'null'] }
        einvoiceStatus: { $ref: '#/components/schemas/EInvoiceStatus' }
        einvoiceAlias: { type: [string, 'null'] }
        billingAddress: { type: [string, 'null'] }
        billingEmails:
          type: array
          items: { type: string, format: email }
        billingCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        vatExempt: { type: boolean }
        withholdingApplies: { type: boolean }
        parentAccount:
          oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }]
          description: Since 1.3.0. Group parent; the group is this account, its parent chain and children.
        groupName: { type: [string, 'null'], description: Group name when the parent is not in the CRM., examples: [Marmara Holding] }
        employeeBand:
          oneOf: [{ $ref: '#/components/schemas/EmployeeBand' }, { type: 'null' }]
        hqCountry: { type: [string, 'null'], pattern: '^[A-Z]{2}$', description: 'ISO 3166-1 alpha-2; `city` is the HQ city.', examples: [TR] }
        confidentialityLevel: { $ref: '#/components/schemas/ConfidentialityLevel' }
        preferredLanguage:
          oneOf: [{ $ref: '#/components/schemas/Language' }, { type: 'null' }]
        missingForActive:
          type: array
          description: |
            Since 1.3.0. Profile fields still empty that an active client needs (PB-014, CO-019):
            `legalName`, `taxId`, `taxOffice`, `billingAddress`, `billingEmails`, `signedAgreement`,
            `conflictCheck`. Informational in 1.3 (no status guard yet, ADR 0013).
          items: { type: string }
    AccountPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        page: { $ref: '#/components/schemas/PageMeta' }
    AccountCreateRequest:
      type: object
      required: [name, sector]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        sector: { type: string, minLength: 1, maxLength: 100 }
        city: { type: [string, 'null'], maxLength: 100 }
        website: { type: [string, 'null'], format: uri, maxLength: 300 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        ownerId:
          $ref: '#/components/schemas/Id'
          description: Defaults to the current user.
        legalName: { type: [string, 'null'], maxLength: 300 }
        taxId: { type: [string, 'null'], maxLength: 20, description: Plain string; no check-digit validation in 1.3 (VWC). }
        taxOffice: { type: [string, 'null'], maxLength: 100 }
        mersisNo: { type: [string, 'null'], maxLength: 16 }
        einvoiceStatus: { $ref: '#/components/schemas/EInvoiceStatus' }
        einvoiceAlias: { type: [string, 'null'], maxLength: 100 }
        billingAddress: { type: [string, 'null'], maxLength: 500 }
        billingEmails:
          type: array
          maxItems: 5
          items: { type: string, format: email, maxLength: 254 }
        billingCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        vatExempt: { type: boolean, default: false }
        withholdingApplies: { type: boolean, default: false }
        parentAccountId:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
          description: No cycles and a chain of at most 5 (400 `VALIDATION_FAILED`, field `parentAccountId`); not an archived account (409 `ARCHIVED`).
        groupName: { type: [string, 'null'], maxLength: 200 }
        employeeBand:
          oneOf: [{ $ref: '#/components/schemas/EmployeeBand' }, { type: 'null' }]
        hqCountry: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
        confidentialityLevel: { $ref: '#/components/schemas/ConfidentialityLevel' }
        preferredLanguage:
          oneOf: [{ $ref: '#/components/schemas/Language' }, { type: 'null' }]
    AccountUpdateRequest:
      type: object
      description: Since 1.3.0 also takes the profile fields of `AccountCreateRequest` (same rules).
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        sector: { type: string, minLength: 1, maxLength: 100 }
        city: { type: [string, 'null'], maxLength: 100 }
        website: { type: [string, 'null'], format: uri, maxLength: 300 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        ownerId: { $ref: '#/components/schemas/Id' }
        version: { $ref: '#/components/schemas/Version' }
        legalName: { type: [string, 'null'], maxLength: 300 }
        taxId: { type: [string, 'null'], maxLength: 20 }
        taxOffice: { type: [string, 'null'], maxLength: 100 }
        mersisNo: { type: [string, 'null'], maxLength: 16 }
        einvoiceStatus: { $ref: '#/components/schemas/EInvoiceStatus' }
        einvoiceAlias: { type: [string, 'null'], maxLength: 100 }
        billingAddress: { type: [string, 'null'], maxLength: 500 }
        billingEmails:
          type: array
          maxItems: 5
          items: { type: string, format: email, maxLength: 254 }
        billingCurrency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        vatExempt: { type: boolean }
        withholdingApplies: { type: boolean }
        parentAccountId:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
        groupName: { type: [string, 'null'], maxLength: 200 }
        employeeBand:
          oneOf: [{ $ref: '#/components/schemas/EmployeeBand' }, { type: 'null' }]
        hqCountry: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
        confidentialityLevel: { $ref: '#/components/schemas/ConfidentialityLevel' }
        preferredLanguage:
          oneOf: [{ $ref: '#/components/schemas/Language' }, { type: 'null' }]
    AccountStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AccountStatus' }
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    AccountConnection:
      type: object
      required: [contact, person, linkType, direction]
      properties:
        contact:
          $ref: '#/components/schemas/PersonRef'
          description: The account's contact.
        person: { $ref: '#/components/schemas/PersonSummary' }
        linkType: { $ref: '#/components/schemas/LinkType' }
        direction: { $ref: '#/components/schemas/LinkDirection' }
    # ---------- people ----------
    PersonSummary:
      type: object
      required: [id, name, type, owner, consentStatus, retentionStatus]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Elif Yıldırım] }
        title: { type: [string, 'null'], examples: [Finance Director] }
        company: { type: [string, 'null'], examples: [Marmara Holding] }
        type: { $ref: '#/components/schemas/PersonType' }
        city: { type: [string, 'null'], examples: [Ankara] }
        email: { type: [string, 'null'], format: email }
        owner: { $ref: '#/components/schemas/UserRef' }
        lastContactAt: { type: [string, 'null'], format: date-time }
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
        retentionStatus: { $ref: '#/components/schemas/RetentionStatus' }
        tags:
          type: array
          description: Since 1.2.0 (optional for 1.1.x servers). Lower-case; a tag can stand for a talent pool.
          items: { $ref: '#/components/schemas/Tag' }
        sourceChannel:
          oneOf: [{ $ref: '#/components/schemas/SourceChannel' }, { type: 'null' }]
          description: Since 1.2.0.
        shareable:
          type: boolean
          description: Since 1.2.0. May be shared with a client (consent GIVEN, not anonymised); from the copies on `person`, for badges only — the server guard decides.
        cvMatch:
          type: [string, 'null']
          maxLength: 300
          description: Since 1.2.0. Only with the `cv` filter — a short excerpt of the current CV around the match (`ts_headline`), match marked with `«` and `»`.
        archive:
          oneOf: [{ $ref: '#/components/schemas/ArchiveInfo' }, { type: 'null' }]
          description: Since 1.3.0. Null while not archived.
        skills:
          type: array
          description: Since 1.3.0. Lower-case skill keywords (same rules as tags, at most 30).
          items: { $ref: '#/components/schemas/Tag' }
        functionArea:
          oneOf: [{ $ref: '#/components/schemas/JobFunction' }, { type: 'null' }]
          description: Since 1.3.0.
        seniority:
          oneOf: [{ $ref: '#/components/schemas/Seniority' }, { type: 'null' }]
          description: Since 1.3.0.
    PersonSummaryPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/PersonSummary' }
        page: { $ref: '#/components/schemas/PageMeta' }
    Employment:
      type: object
      required: [company]
      properties:
        company: { type: string, maxLength: 200, examples: [Marmara Holding] }
        title: { type: [string, 'null'], maxLength: 200, examples: [Finance Director] }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date, description: '`null` = current' }
    Person:
      allOf:
        - $ref: '#/components/schemas/PersonSummary'
        - $ref: '#/components/schemas/CandidateProfileFields'
        - type: object
          properties:
            currentCv:
              oneOf: [{ $ref: '#/components/schemas/PersonFile' }, { type: 'null' }]
              description: Since 1.2.0. The current CV, if any; all files via `GET /people/{id}/files`.
            compensationRestricted:
              type: boolean
              description: Since 1.2.0. True when `compensation` is hidden from the current user (not MANAGER/ADMIN and not the owner).
            offLimits:
              type: array
              description: Since 1.2.0. Active off-limits rules that match the person's current company (the pipeline guard uses the same match).
              items: { $ref: '#/components/schemas/OffLimitsRule' }
        - type: object
          required: [employments, anonymised, createdAt, updatedAt, version]
          properties:
            phone: { type: [string, 'null'], examples: ['+90 555 000 00 00'] }
            linkedinUrl: { type: [string, 'null'], format: uri, description: Profile URL entered by hand; no scraping. }
            howWeKnow: { type: [string, 'null'], examples: [Met at a CFO roundtable] }
            notes: { type: [string, 'null'] }
            employments:
              type: array
              description: Company history, most recent first.
              items: { $ref: '#/components/schemas/Employment' }
            anonymised: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            version: { $ref: '#/components/schemas/Version' }
    PersonCreateRequest:
      type: object
      required: [name, type]
      description: Since 1.2.0 also takes the candidate profile fields (`sourceChannel`, `noticePeriodDays`, `mobility`, `compensation`, `languages`, `educations`; see `CandidateProfileFields`).
      properties:
        sourceChannel: { oneOf: [{ $ref: '#/components/schemas/SourceChannel' }, { type: 'null' }] }
        noticePeriodDays: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        mobility: { oneOf: [{ $ref: '#/components/schemas/Mobility' }, { type: 'null' }] }
        compensation: { oneOf: [{ $ref: '#/components/schemas/Compensation' }, { type: 'null' }] }
        languages:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/LanguageSkill' }
        educations:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Education' }
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/PersonType' }
        title: { type: [string, 'null'], maxLength: 200 }
        company: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 50 }
        city: { type: [string, 'null'], maxLength: 100 }
        linkedinUrl: { type: [string, 'null'], format: uri, maxLength: 300 }
        howWeKnow: { type: [string, 'null'], maxLength: 1000 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        ownerId:
          $ref: '#/components/schemas/Id'
          description: Defaults to the current user.
        employments:
          type: array
          items: { $ref: '#/components/schemas/Employment' }
    PersonUpdateRequest:
      type: object
      description: Since 1.2.0 also takes the candidate profile fields; `languages` and `educations` replace the whole list when sent, `compensation` replaces the whole value (`null` clears it).
      properties:
        sourceChannel: { oneOf: [{ $ref: '#/components/schemas/SourceChannel' }, { type: 'null' }] }
        noticePeriodDays: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        mobility: { oneOf: [{ $ref: '#/components/schemas/Mobility' }, { type: 'null' }] }
        compensation: { oneOf: [{ $ref: '#/components/schemas/Compensation' }, { type: 'null' }] }
        languages:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/LanguageSkill' }
        educations:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Education' }
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/PersonType' }
        title: { type: [string, 'null'], maxLength: 200 }
        company: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 50 }
        city: { type: [string, 'null'], maxLength: 100 }
        linkedinUrl: { type: [string, 'null'], format: uri, maxLength: 300 }
        howWeKnow: { type: [string, 'null'], maxLength: 1000 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        ownerId: { $ref: '#/components/schemas/Id' }
        employments:
          type: array
          items: { $ref: '#/components/schemas/Employment' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- contacts ----------
    Contact:
      type: object
      required: [id, account, person, primary, active, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/AccountRef' }
        person: { $ref: '#/components/schemas/PersonSummary' }
        role: { type: [string, 'null'], examples: [HR Director] }
        primary: { type: boolean }
        endedOn: { type: [string, 'null'], format: date, description: Set when the contact was ended (DELETE). }
        active: { type: boolean, readOnly: true, description: 'True while `endedOn` is empty.' }
        createdAt: { type: string, format: date-time }
    ContactCreateRequest:
      type: object
      description: Exactly one of `personId` and `person`.
      properties:
        personId: { $ref: '#/components/schemas/Id' }
        person: { $ref: '#/components/schemas/PersonCreateRequest' }
        role: { type: [string, 'null'], maxLength: 200 }
        primary: { type: boolean, default: false }
    ContactUpdateRequest:
      type: object
      properties:
        role: { type: [string, 'null'], maxLength: 200 }
        primary: { type: boolean }
    # ---------- network links ----------
    LinkDirection:
      type: string
      description: Seen from the person whose links are listed. Symmetric types are always BOTH.
      enum: [OUTGOING, INCOMING, BOTH]
    NetworkLink:
      type: object
      required: [id, from, to, type, createdAt, createdBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        from: { $ref: '#/components/schemas/PersonRef' }
        to: { $ref: '#/components/schemas/PersonRef' }
        type: { $ref: '#/components/schemas/LinkType' }
        note: { type: [string, 'null'], examples: [Introduced at a dinner in 2024] }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
    NetworkLinkCreateRequest:
      type: object
      required: [fromPersonId, toPersonId, type]
      properties:
        fromPersonId: { $ref: '#/components/schemas/Id' }
        toPersonId: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/LinkType' }
        note: { type: [string, 'null'], maxLength: 1000 }
    NetworkLinkUpdateRequest:
      type: object
      properties:
        type: { $ref: '#/components/schemas/LinkType' }
        note: { type: [string, 'null'], maxLength: 1000 }
    PersonConnection:
      type: object
      required: [linkId, type, direction, person]
      properties:
        linkId: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/LinkType' }
        direction: { $ref: '#/components/schemas/LinkDirection' }
        person: { $ref: '#/components/schemas/PersonSummary' }
        note: { type: [string, 'null'] }
    # ---------- import ----------
    ImportRowError:
      type: object
      required: [row, message]
      properties:
        row: { type: integer, description: 1-based data row (header excluded), examples: [7] }
        column: { type: [string, 'null'], examples: [email] }
        message: { type: string, examples: [Not a valid e-mail address] }
    ImportJob:
      type: object
      required: [id, kind, status, fileName, totalRows, validRows, duplicateRows, importedRows, errors, createdAt, createdBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/ImportKind' }
        status: { $ref: '#/components/schemas/ImportStatus' }
        fileName: { type: string, examples: [accounts.csv] }
        totalRows: { type: integer, examples: [120] }
        validRows: { type: integer, examples: [115] }
        duplicateRows: { type: integer, description: Rows matching an existing record; skipped., examples: [3] }
        importedRows: { type: integer, examples: [0] }
        errors:
          type: array
          description: First 500 row errors.
          items: { $ref: '#/components/schemas/ImportRowError' }
        failureReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        completedAt: { type: [string, 'null'], format: date-time }
    ImportJobPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ImportJob' }
        page: { $ref: '#/components/schemas/PageMeta' }
    # ---------- search ----------
    SearchResults:
      type: object
      required: [query, accounts, people, jobOrders, totals]
      properties:
        query: { type: string, examples: [ozturk] }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        people:
          type: array
          items: { $ref: '#/components/schemas/PersonSummary' }
        jobOrders:
          type: array
          items: { $ref: '#/components/schemas/JobOrder' }
        totals:
          type: object
          required: [accounts, people, jobOrders]
          properties:
            accounts: { type: integer }
            people: { type: integer }
            jobOrders: { type: integer }
    # ---------- job orders and pipeline ----------
    StageCounts:
      type: object
      description: Applications per stage; every stage present.
      required: [SOURCED, SCREENED, PRESENTED, CLIENT_INTERVIEW, OFFER, PLACED, REJECTED]
      properties:
        SOURCED: { type: integer, examples: [3] }
        SCREENED: { type: integer, examples: [2] }
        PRESENTED: { type: integer, examples: [1] }
        CLIENT_INTERVIEW: { type: integer, examples: [1] }
        OFFER: { type: integer, examples: [0] }
        PLACED: { type: integer, examples: [0] }
        REJECTED: { type: integer, examples: [2] }
    JobOrder:
      type: object
      required: [id, account, title, status, owner, openedOn, daysOpen, activeCandidates, stageCounts, statusChangedAt, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/AccountRef' }
        title: { type: string, examples: [Chief Financial Officer] }
        location: { type: [string, 'null'], examples: [İstanbul] }
        seniority: { type: [string, 'null'], examples: [C-level] }
        description: { type: [string, 'null'] }
        feeTerms: { type: [string, 'null'], examples: ['33% of first-year salary, retained'] }
        openings: { type: integer, minimum: 1, default: 1, description: Number of positions to fill. }
        status: { $ref: '#/components/schemas/JobOrderStatus' }
        statusChangedAt: { type: string, format: date-time }
        owner: { $ref: '#/components/schemas/UserRef' }
        openedOn: { type: string, format: date }
        closedOn: { type: [string, 'null'], format: date, description: Set on FILLED or CANCELLED. }
        daysOpen: { type: integer, description: From openedOn to closedOn or today., examples: [21] }
        activeCandidates: { type: integer, description: Applications not PLACED or REJECTED., examples: [7] }
        stageCounts: { $ref: '#/components/schemas/StageCounts' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
        archive:
          oneOf: [{ $ref: '#/components/schemas/ArchiveInfo' }, { type: 'null' }]
          description: Since 1.3.0. Null while not archived.
        confidentialityLevel:
          $ref: '#/components/schemas/ConfidentialityLevel'
          description: Since 1.3.0. Stored and shown as a badge; list visibility rules follow in a later contract (ADR 0013).
    JobOrderPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/JobOrder' }
        page: { $ref: '#/components/schemas/PageMeta' }
    JobOrderCreateRequest:
      type: object
      required: [accountId, title]
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        title: { type: string, minLength: 1, maxLength: 200 }
        location: { type: [string, 'null'], maxLength: 200 }
        seniority: { type: [string, 'null'], maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 10000 }
        feeTerms: { type: [string, 'null'], maxLength: 2000 }
        openings: { type: integer, minimum: 1, default: 1 }
        openedOn: { type: string, format: date, description: Defaults to today. }
        ownerId:
          $ref: '#/components/schemas/Id'
          description: Defaults to the current user.
        confidentialityLevel:
          $ref: '#/components/schemas/ConfidentialityLevel'
          description: Since 1.3.0. Defaults to the account's level.
    JobOrderUpdateRequest:
      type: object
      properties:
        confidentialityLevel: { $ref: '#/components/schemas/ConfidentialityLevel' }
        title: { type: string, minLength: 1, maxLength: 200 }
        location: { type: [string, 'null'], maxLength: 200 }
        seniority: { type: [string, 'null'], maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 10000 }
        feeTerms: { type: [string, 'null'], maxLength: 2000 }
        openings: { type: integer, minimum: 1 }
        openedOn: { type: string, format: date }
        ownerId: { $ref: '#/components/schemas/Id' }
        version: { $ref: '#/components/schemas/Version' }
    JobOrderStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/JobOrderStatus' }
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    Application:
      type: object
      required: [id, jobOrder, account, person, stage, stageChangedAt, addedAt, addedBy, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        jobOrder: { $ref: '#/components/schemas/JobOrderRef' }
        account: { $ref: '#/components/schemas/AccountRef' }
        person: { $ref: '#/components/schemas/PersonSummary' }
        stage: { $ref: '#/components/schemas/PipelineStage' }
        rejectionReason: { type: [string, 'null'], description: Set while the stage is REJECTED. }
        stageChangedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time }
        addedBy: { $ref: '#/components/schemas/UserRef' }
        version: { $ref: '#/components/schemas/Version' }
        offLimitsOverrideReason:
          type: [string, 'null']
          description: Since 1.2.0. Set when a manager added the person despite an off-limits rule.
        warnings:
          type: array
          description: Since 1.2.0. Only in the responses of `POST /job-orders/{id}/applications` and `PATCH /applications/{id}/stage`; non-blocking.
          items: { $ref: '#/components/schemas/PipelineWarning' }
    ApplicationCreateRequest:
      type: object
      required: [personId]
      properties:
        personId: { $ref: '#/components/schemas/Id' }
        offLimitsOverrideReason:
          $ref: '#/components/schemas/Reason'
          description: Since 1.2.0. MANAGER/ADMIN only (403 for consultants); adds the person despite matching off-limits rules.
    StageChangeRequest:
      type: object
      required: [stage]
      properties:
        stage: { $ref: '#/components/schemas/PipelineStage' }
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
        offLimitsOverrideReason:
          $ref: '#/components/schemas/Reason'
          description: |
            Since 1.2.0. Same semantics as on `ApplicationCreateRequest`: MANAGER/ADMIN only (403 for
            consultants), 3 to 500 characters, stored on the application (`offLimitsOverrideReason`,
            audited by Envers). Only lifts the off-limits check on the first move into a client-facing
            stage (e.g. a rule created after the person was added); ignored when the application already
            has an override. It never lifts `CONSENT_REQUIRED`, which cannot be overridden.
    Proposal:
      type: object
      required: [id, account, title, status, statusChangedAt, owner, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/AccountRef' }
        title: { type: string, examples: [Executive search — CFO] }
        terms: { type: [string, 'null'], examples: ['Retainer in three instalments, 90-day guarantee'] }
        feeAmount: { type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$', description: Decimal as string to avoid rounding., examples: ['450000.00'] }
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$', examples: [TRY] }
        status: { $ref: '#/components/schemas/ProposalStatus' }
        statusChangedAt: { type: string, format: date-time }
        statusReason: { type: [string, 'null'], description: Reason of the last status change (e.g. why rejected). }
        sentOn: { type: [string, 'null'], format: date }
        decidedOn: { type: [string, 'null'], format: date, description: Set on ACCEPTED or REJECTED. }
        owner: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
        archive:
          oneOf: [{ $ref: '#/components/schemas/ArchiveInfo' }, { type: 'null' }]
          description: Since 1.3.0. Null while not archived.
    ProposalPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Proposal' }
        page: { $ref: '#/components/schemas/PageMeta' }
    ProposalCreateRequest:
      type: object
      required: [accountId, title]
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        title: { type: string, minLength: 1, maxLength: 200 }
        terms: { type: [string, 'null'], maxLength: 10000 }
        feeAmount: { type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$' }
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        ownerId: { $ref: '#/components/schemas/Id' }
    ProposalUpdateRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        terms: { type: [string, 'null'], maxLength: 10000 }
        feeAmount: { type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$' }
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        ownerId: { $ref: '#/components/schemas/Id' }
        version: { $ref: '#/components/schemas/Version' }
    ProposalStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ProposalStatus' }
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- activities and next actions ----------
    Activity:
      type: object
      required: [id, type, note, occurredAt, user, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/ActivityType' }
        note: { type: string, examples: [Discussed the CFO search timeline.] }
        occurredAt: { type: string, format: date-time }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        person: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        jobOrder: { oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }] }
        user: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    ActivityPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        page: { $ref: '#/components/schemas/PageMeta' }
    ActivityCreateRequest:
      type: object
      required: [type, note]
      description: At least one of `accountId` and `personId`.
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        note: { type: string, minLength: 1, maxLength: 4000 }
        occurredAt: { type: string, format: date-time, description: Defaults to now; may not be in the future. }
        accountId: { $ref: '#/components/schemas/Id' }
        personId: { $ref: '#/components/schemas/Id' }
        jobOrderId: { $ref: '#/components/schemas/Id' }
    ActivityUpdateRequest:
      type: object
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        note: { type: string, minLength: 1, maxLength: 4000 }
        occurredAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    NextAction:
      type: object
      required: [id, title, dueOn, owner, done, overdue, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string, examples: [Send shortlist to HR Director] }
        dueOn: { type: string, format: date }
        owner: { $ref: '#/components/schemas/UserRef' }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        person: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        jobOrder: { oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }] }
        done: { type: boolean }
        doneAt: { type: [string, 'null'], format: date-time }
