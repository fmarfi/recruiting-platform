  # ---------- 1.1.0 (Wave 2a): saved views and bulk actions (ADR 0010) ----------
  /views:
    get:
      tags: [Saved views]
      operationId: listViews
      summary: Saved list views the current user can see (own private views plus all shared views)
      description: |
        Returns the caller's PRIVATE views and every SHARED view, optionally for one entity, ordered by
        name. Other users' private views are never returned. Plain array: a user has at most 50 private
        views per entity (ASSUMPTION, ADR 0010).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - name: entity
          in: query
          description: Only views of this grid.
          schema: { $ref: '#/components/schemas/ListEntity' }
      responses:
        '200':
          description: Views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Saved views]
      operationId: createView
      summary: Save the current filters, columns, sort and grouping of a grid as a view
      description: |
        The owner is the current user. `definition.filters` is validated per entity (see
        `ViewDefinition`); an unknown key or a bad value gives 400 `VALIDATION_FAILED` with
        `field = definition.filters.<key>`. **ASSUMPTION (open question for the client):** only MANAGER and
        ADMIN may create or switch a view to SHARED; a consultant gets 403 `FORBIDDEN`. Same name for the
        same owner and entity gives 409 `DUPLICATE`. A 51st private view of the same entity gives 400
        `VALIDATION_FAILED` with `errors[0] = {field: entity, code: LIMIT}` (cap 50, ADR 0010).
        **SHARED views never store `q`** (free text can hold a person's name; ADR 0010 amendment 2):
        the server removes `definition.filters.q` when a view is created or switched as SHARED, and the
        UI warns before sharing a view that has one.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedViewCreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /views/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Saved views]
      operationId: updateView
      summary: Rename a view, change its visibility or replace its definition
      description: |
        `definition` is replaced as a whole. The entity cannot change. Who may change a view: its owner,
        and MANAGER/ADMIN for SHARED views. Another user's PRIVATE view gives 404 (its existence is not
        revealed); a consultant changing someone else's SHARED view, or switching a view to SHARED, gets
        403 `FORBIDDEN` (views are personal settings, not business records, so the pilot rule "any
        consultant may change any record" does not apply; ADR 0010). Send `version` for optimistic locking
        (409 `VERSION_CONFLICT`). An empty body (`{}`, or only `version`) gives 400 `VALIDATION_FAILED`.
        Switching to SHARED, or saving a SHARED view, removes `filters.q` (ADR 0010 amendment 2).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedViewUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Saved views]
      operationId: deleteView
      summary: Delete a view
      description: Same permission rule as `PATCH /views/{id}`. Hard delete; views hold no personal data.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bulk-actions:
    post:
      tags: [Bulk actions]
      operationId: runBulkAction
      summary: Apply one action to many selected records of a grid, with a result per record
      description: |
        Synchronous; at most 500 ids. Each record is processed on its own (own transaction), so **partial
        success is normal**: the response is 200 with one `BulkRecordResult` per requested id, in request
        order. 400 only when the request as a whole is invalid (more than 500 ids, `params` that do not fit
        the action, an action not allowed for the entity).

        Rules (ADR 0010):
        - **Through the normal services, never around them.** `CHANGE_STATUS` runs the same lifecycle check
          as `PATCH .../status` (transition table, reason rule, manager-only moves, data guards); a record
          that cannot move is `FAILED` with `ILLEGAL_TRANSITION`, `TRANSITION_GUARD_FAILED`,
          `REASON_REQUIRED` or `FORBIDDEN`. Every change publishes the usual domain events (timeline) and
          writes an Envers revision.
        - **Consent gate.** Actions that contact people (`REQUEST_CONSENT`, and every later contact action
          such as templated e-mail) only go to people with a valid basis; others are `SKIPPED` with an
          explicit code (`NO_EMAIL`, `CONSENT_GIVEN`, `CONSENT_REFUSED`, `CONSENT_WITHDRAWN`,
          `REQUEST_PENDING`, `ANONYMISED`, `NO_CONSENT_BASIS`), never silently dropped. Bulk does not re-ask
          people who refused or withdrew; use the single `POST /people/{id}/consent/requests` for that.
        - **Audit.** Every requested id gets an audit entry (`bulk_action_item`) with its outcome and code,
          including SKIPPED and FAILED ones, linked to one `bulk_action` row with the actor and the params.
          **No personal data in the audit (since 1.1.1):** the stored params keep ids, enum names, dates,
          the tag and the language only; the free-text `SetNextActionParams.title` and
          `ChangeStatusParams.reason` are applied to the records but never stored in `bulk_action`. The
          item row stores no message; `message` in the response is the fixed text of the code.
        - Records that already have the requested value (same owner, tag already there or missing, same
          status) are `SKIPPED` with `NO_CHANGE`; unknown ids are `FAILED` with `NOT_FOUND`.

        Entities per action: `REASSIGN_OWNER`, `ADD_TAG`, `REMOVE_TAG` all; `CHANGE_STATUS` ACCOUNTS,
        JOB_ORDERS, PROPOSALS (`params.status` must be a value of that entity's lifecycle);
        `SET_NEXT_ACTION` PEOPLE, ACCOUNTS, JOB_ORDERS (one next action per record, linked to it);
        `REQUEST_CONSENT` PEOPLE only and MANAGER/ADMIN only, like the consent campaign (403 `FORBIDDEN`
        for consultants; ASSUMPTION).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline (dispatcher, audit); handlers in accounts (backend-accounts) and privacy (security-privacy)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkActionRequest' }
            examples:
              changeStatus:
                summary: Cancel two job orders with a reason
                value:
                  entity: JOB_ORDERS
                  ids: [0192a5b8-0000-7000-8000-0000000000a1, 0192a5b8-0000-7000-8000-0000000000a2]
                  action: CHANGE_STATUS
                  params: { status: CANCELLED, reason: Client froze hiring for this year }
              requestConsent:
                summary: Ask three people for KVKK consent
                value:
                  entity: PEOPLE
                  ids: [0192a5b8-0000-7000-8000-000000000101, 0192a5b8-0000-7000-8000-000000000102, 0192a5b8-0000-7000-8000-000000000103]
                  action: REQUEST_CONSENT
                  params: { language: TR }
      responses:
        '200':
          description: Processed; see the result of each record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkActionResult' }
              example:
                id: 0192a5b8-0000-7000-8000-00000000b001
                entity: PEOPLE
                action: REQUEST_CONSENT
                requested: 3
                ok: 1
                skipped: 2
                failed: 0
                results:
                  - { id: 0192a5b8-0000-7000-8000-000000000101, outcome: OK, code: null, message: null }
                  - { id: 0192a5b8-0000-7000-8000-000000000102, outcome: SKIPPED, code: NO_EMAIL, message: The person has no e-mail address. }
                  - { id: 0192a5b8-0000-7000-8000-000000000103, outcome: SKIPPED, code: CONSENT_WITHDRAWN, message: 'Consent was withdrawn; bulk requests do not re-ask.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ---------- 1.2.0: candidate pool, files, duplicates, exposure, off-limits, sharing guard (ADR 0011) ----------
  /people/{id}/files:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Candidate files]
      operationId: listPersonFiles
      summary: CVs (all versions, newest first) and documents of a person
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PersonFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Candidate files]
      operationId: uploadPersonFile
      summary: Upload a CV or document for a known person (drag and drop on the person page)
      description: |
        Max 10 MB. Accepted types (detected from the bytes by Tika, not from the file name): PDF, DOCX,
        DOC, RTF, ODT, TXT; else 415 `UNSUPPORTED_MEDIA_TYPE`. A CV becomes the person's current CV with
        `version` = previous + 1; older versions stay until the retention period ends. The same bytes
        (SHA-256) uploaded twice for the same person give 409 `DUPLICATE` with `existingId`.
        Text extraction runs asynchronously (`textStatus` PENDING, then DONE, NO_TEXT or FAILED).
        Publishes `PersonFileUploaded`; for a CV, privacy then sends the KVKK notice and consent e-mail
        when `autoSendOnCvUpload` is on and the person has an e-mail, no GIVEN consent and no request
        younger than 7 days (REFUSED/WITHDRAWN people are not re-asked automatically). Anonymised
        people: 409 `STATE_CONFLICT`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: The file; its original name is kept as `fileName`.
                kind: { $ref: '#/components/schemas/PersonFileKind' }
      responses:
        '201':
          description: Stored; text extraction queued
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
  /people/{id}/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/FileIdPath'
    delete:
      tags: [Candidate files]
      operationId: deletePersonFile
      summary: Delete one file (row and bytes)
      description: Hard delete, recorded by Envers (DEL revision without file data). Deleting the current CV makes the next older version current. The bytes are removed after the commit.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /people/{id}/files/{fileId}/content:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/FileIdPath'
    get:
      tags: [Candidate files]
      operationId: downloadPersonFile
      summary: Download the file
      description: Recorded in the access log (DOWNLOAD, entity PERSON_FILE). Always served as an attachment with `application/octet-stream` and `X-Content-Type-Options nosniff`, never rendered inline.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: File bytes
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename*=UTF-8''<fileName>
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cv-intake:
    get:
      tags: [CV intake]
      operationId: listCvIntake
      summary: Uploaded CVs that are not yet attached to a person
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - name: status
          in: query
          description: Default PENDING.
          schema:
            type: array
            items: { $ref: '#/components/schemas/CvIntakeStatus' }
          style: form
          explode: true
        - name: uploadedBy
          in: query
          description: Only items uploaded by this user (`me` is resolved by the client).
          schema: { $ref: '#/components/schemas/Id' }
        - name: batchId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of intake items, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvIntakeItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [CV intake]
      operationId: uploadCvIntake
      summary: Bulk (or single) CV upload for people who may not exist yet
      description: |
        1 to 50 files, each at most 10 MB, same types as `POST /people/{id}/files`. Files that fail
        size or type are listed in `rejected`; the others become PENDING intake items. For each item the
        server extracts the text (Tika, async) and finds e-mail addresses, phone numbers and LinkedIn URLs
        with plain patterns (no AI parsing), then runs the duplicate check on them (`duplicates`). The
        consultant attaches each item to a matching person or creates a new one
        (`POST /cv-intake/{id}/attach`). **Pending items and their files are deleted after 14 days**
        (ASSUMPTION, ADR 0011): no consent e-mail goes out before a person exists.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  description: One `files` part per file (repeat the part name). Declared as one file or an array because the Prism mock does not collect repeated parts into an array.
                  oneOf:
                    - type: string
                      contentMediaType: application/octet-stream
                    - type: array
                      minItems: 1
                      maxItems: 50
                      items:
                        type: string
                        contentMediaType: application/octet-stream
                sourceChannel:
                  $ref: '#/components/schemas/SourceChannel'
                  description: Proposed source channel for the people created from this batch (default CV_UPLOAD).
      responses:
        '201':
          description: Batch accepted (some files may be rejected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvIntakeBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/Problem' }
  /cv-intake/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [CV intake]
      operationId: getCvIntakeItem
      summary: One intake item (poll `textStatus` and `detected`)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CvIntakeItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [CV intake]
      operationId: discardCvIntakeItem
      summary: Discard a pending item; its file and extracted text are deleted
      description: The row stays as DISCARDED with no file name, text or detected values (minimised). Not PENDING gives 409 `STATE_CONFLICT`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '204': { description: Discarded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cv-intake/{id}/content:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [CV intake]
      operationId: downloadCvIntakeFile
      summary: Download the uploaded file of a pending item
      description: Recorded in the access log (DOWNLOAD, entity CV_INTAKE_ITEM). Served as an attachment like person files.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: File bytes
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename*=UTF-8''<fileName>
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthorized' }
