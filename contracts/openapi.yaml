  /people:
    get:
      tags: [People]
      operationId: listPeople
      summary: Network list with filters (A-12, UX-06)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: type
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/PersonType' }
          style: form
          explode: true
        - $ref: '#/components/parameters/OwnerId'
        - name: consentStatus
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/ConsentStatus' }
          style: form
          explode: true
        - name: lastContactBefore
          in: query
          description: Last contact on or before this date (or never).
          schema: { type: string, format: date }
        - name: lastContactAfter
          in: query
          schema: { type: string, format: date }
        - name: city
          in: query
          description: City equals one of the values (accent- and case-insensitive, trimmed). Since 1.1.1.
          schema:
            type: array
            maxItems: 50
            items: { type: string, minLength: 1, maxLength: 100 }
          style: form
          explode: true
        - name: company
          in: query
          description: Current company contains this text (accent- and case-insensitive, trigram index on `person.company`). Since 1.1.1.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: tag
          in: query
          description: Has at least one of these tags (lower-case match). A talent pool is a tag plus a shared saved view on it (ADR 0011). Since 1.2.0.
          schema:
            type: array
            maxItems: 20
            items: { $ref: '#/components/schemas/Tag' }
          style: form
          explode: true
        - name: sourceChannel
          in: query
          description: Since 1.2.0.
          schema:
            type: array
            items: { $ref: '#/components/schemas/SourceChannel' }
          style: form
          explode: true
        - name: cv
          in: query
          description: |
            Full-text query over the text of each person's **current** CV (Apache Tika extraction, no AI),
            Turkish-aware (`tr_unaccent` text search configuration: Turkish stemming, accents ignored).
            Web-search syntax: words are AND, `"exact phrase"`, `or`, `-word` to exclude. With `cv`, the
            default sort is relevance and each item carries `cvMatch`. Since 1.2.0.
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: shareable
          in: query
          description: '`true`: only people who may be shared with a client (consent GIVEN, not anonymised); `false`: only the others. Since 1.2.0.'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Archived'
        - name: skill
          in: query
          description: Since 1.3.0. Has at least one of these skills (lower-case match on `skills`).
          schema:
            type: array
            maxItems: 20
            items: { $ref: '#/components/schemas/Tag' }
          style: form
          explode: true
        - name: functionArea
          in: query
          description: Since 1.3.0.
          schema:
            type: array
            items: { $ref: '#/components/schemas/JobFunction' }
          style: form
          explode: true
        - name: seniority
          in: query
          description: Since 1.3.0.
          schema:
            type: array
            items: { $ref: '#/components/schemas/Seniority' }
          style: form
          explode: true
        - name: language
          in: query
          description: Since 1.3.0. Speaks all of these languages (ISO 639-1), any level.
          schema:
            type: array
            maxItems: 5
            items: { type: string, pattern: '^[a-z]{2}$' }
          style: form
          explode: true
        - name: noticeMaxDays
          in: query
          description: Since 1.3.0. Notice period at most this many days (unknown notice does not match).
          schema: { type: integer, minimum: 0, maximum: 365 }
        - name: mobility
          in: query
          description: Since 1.3.0.
          schema:
            type: array
            items: { $ref: '#/components/schemas/Mobility' }
          style: form
          explode: true
        - name: salaryMin
          in: query
          description: |
            Since 1.3.0. Expected pay (`compensation.expected`, per year: MONTHLY × 12) at least this
            amount in `salaryCurrency`. Compensation is encrypted, so the service decrypts and filters
            after the SQL filters, over at most 5,000 rows (else 400 `VALIDATION_FAILED`, code `TOO_BROAD`:
            narrow the other filters). No currency conversion: people with another currency or no
            compensation never match. Only people whose compensation the caller may read are matched
            (MANAGER/ADMIN: all; others: people they own), so the filter reveals nothing new.
          schema: { type: number, minimum: 0 }
        - name: salaryMax
          in: query
          description: Since 1.3.0. Expected pay at most this amount; same rules as `salaryMin`.
          schema: { type: number, minimum: 0 }
        - name: salaryCurrency
          in: query
          description: Since 1.3.0. Required with `salaryMin` or `salaryMax` (400).
          schema: { type: string, pattern: '^[A-Z]{3}$' }
        - name: hasCv
          in: query
          description: 'Since 1.3.0. `true`: has a current CV whose text is searchable (`textStatus` DONE); `false`: no CV or not searchable (the "not searchable" count of SX-026).'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: 'Sortable: `name`, `company`, `lastContactAt`, `createdAt`. Default `name,asc` (relevance first when `cv` is set).'
          schema:
            type: array
            items: { type: string }
      responses:
        '200':
          description: Page of people
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonSummaryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [People]
      operationId: createPerson
      summary: Add a person to the network
      description: |
        Consent status starts at NOT_SENT. The privacy module may queue the KVKK notice e-mail (S-01) per retention settings. A second person with the same e-mail gives 409 `DUPLICATE` with `existingId`.

        Since 1.2.0: call `POST /duplicates/check` first (the UI shows the matches before saving). Matches on phone, LinkedIn URL or name + company never block; after the create they are queued in `GET /duplicates`. `sourceChannel` defaults to null (unknown). `compensation` is stored encrypted (field-level, ADR 0011).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonCreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
