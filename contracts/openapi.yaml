                type: array
                items: { $ref: '#/components/schemas/PrivacyNotice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Privacy notices]
      operationId: createPrivacyNotice
      summary: Publish a new notice version (immutable once created)
      x-roles: [ADMIN]
      x-owner: privacy / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyNoticeCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyNotice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /privacy-notices/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Privacy notices]
      operationId: getPrivacyNotice
      summary: Get one notice version
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: privacy / security-privacy
      responses:
        '200':
          description: Notice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyNotice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /retention/settings:
    get:
      tags: [Retention]
      operationId: getRetentionSettings
      summary: Retention period, basis, action and notice automation
      x-roles: [MANAGER, ADMIN]
      x-owner: privacy / security-privacy
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Retention]
      operationId: updateRetentionSettings
      summary: Change retention settings (NFR-03)
      x-roles: [ADMIN]
      x-owner: privacy / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionSettings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /retention/flagged:
    get:
      tags: [Retention]
      operationId: listRetentionFlagged
      summary: People whose retention period ends soon or has ended (S-03)
      x-roles: [MANAGER, ADMIN]
      x-owner: privacy / security-privacy
      parameters:
        - name: retainUntilBefore
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of flagged people
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionItemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /retention/runs:
    get:
      tags: [Retention]
      operationId: listRetentionRuns
      summary: Past retention runs (nightly and manual), newest first
      x-roles: [MANAGER, ADMIN]
      x-owner: privacy / security-privacy
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Retention]
      operationId: startRetentionRun
      summary: Run the retention job now (dry run shows what would happen)
      x-roles: [ADMIN]
      x-owner: privacy / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionRunRequest' }
      responses:
        '201':
          description: Run finished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /data-subject-requests:
    get:
      tags: [Data-subject requests]
      operationId: listDataSubjectRequests
      summary: Logged data-subject requests (S-04)
      x-roles: [MANAGER, ADMIN]
      x-owner: privacy / security-privacy
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/DataSubjectRequestStatus' }
          style: form
          explode: true
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/DataSubjectRequestType' }
        - $ref: '#/components/parameters/PersonIdQuery'
        - name: overdue
          in: query
          description: Past `dueOn` and not final.
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Data-subject requests]
      operationId: createDataSubjectRequest
      summary: Log a request received by e-mail, letter or phone
      description: Any user may log a request they received; `dueOn` = received date + 30 days.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: privacy / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSubjectRequestCreateRequest' }
      responses:
        '201':
          description: Logged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /data-subject-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Data-subject requests]
      operationId: getDataSubjectRequest
      summary: Get a request
      x-roles: [MANAGER, ADMIN]
      x-owner: privacy / security-privacy
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Data-subject requests]
      operationId: updateDataSubjectRequest
      summary: Link the person, change status, record the resolution
      description: Status follows the DataSubjectRequestStatus lifecycle; REJECTED needs a `reason`. Completing a DELETION request anonymises the linked person.
      x-roles: [MANAGER, ADMIN]
      x-owner: privacy / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSubjectRequestUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSubjectRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /people/{id}/export:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Data-subject requests]
      operationId: exportPersonData
      summary: Everything stored about a person, as JSON (S-04 access, NFR-11)
      description: Recorded in the access log (EXPORT).
      x-roles: [MANAGER, ADMIN]
      x-owner: privacy / security-privacy
      responses:
        '200':
          description: Export
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename="person-<id>.json"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonDataExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /people/{id}/anonymise:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Data-subject requests]
      operationId: anonymisePerson
      summary: Anonymise a person now (deletion request or manual retention action)
      description: Irreversible. Replaces name, e-mail, phone, notes and history with placeholders and scrubs free text in related records.
      x-roles: [ADMIN]
      x-owner: privacy / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnonymiseRequest' }
      responses:
        '204': { description: Anonymised }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /audit/access-log:
    get:
      tags: [Audit]
      operationId: listAccessLog
      summary: Who viewed or exported a person's data (NFR-05)
      x-roles: [ADMIN]
      x-owner: security / security-privacy
      parameters:
        - name: userId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: entityType
          in: query
          schema: { $ref: '#/components/schemas/EntityType' }
        - name: entityId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: action
          in: query
          schema: { $ref: '#/components/schemas/AccessAction' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of access log entries, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessLogEntryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit/revisions:
    get:
      tags: [Audit]
      operationId: listRevisions
      summary: Change history of one record from Envers (who changed what, when)
      x-roles: [MANAGER, ADMIN]
      x-owner: security / security-privacy
      parameters:
        - name: entityType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/EntityType' }
        - name: entityId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of revisions, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie set by `POST /auth/login`. With the mock server any value works (e.g. `JSESSIONID=mock`).
  headers:
    Location:
      description: URL of the created resource
      schema: { type: string, format: uri-reference }
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Q:
      name: q
      in: query
      description: Free-text filter (accent- and case-insensitive).
      schema: { type: string, maxLength: 200 }
    Page:
      name: page
      in: query
      description: Page number, 0-based.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: '`property,asc|desc`; repeat for several keys.'
      schema:
        type: array
        items: { type: string, pattern: '^[A-Za-z]+(,(asc|desc))?$' }
      style: form
      explode: true
    OwnerId:
      name: ownerId
      in: query
      description: Responsible user.
      schema: { $ref: '#/components/schemas/Id' }
    AccountIdQuery:
      name: accountId
      in: query
      schema: { $ref: '#/components/schemas/Id' }
    PersonIdQuery:
      name: personId
      in: query
      schema: { $ref: '#/components/schemas/Id' }
    JobOrderIdQuery:
      name: jobOrderId
      in: query
      schema: { $ref: '#/components/schemas/Id' }
  responses:
    BadRequest:
      description: Validation failed (`VALIDATION_FAILED`) or a reason is missing (`REASON_REQUIRED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:reason-required
            title: Reason required
            status: 400
            detail: A reason is required to move to Rejected.
            code: REASON_REQUIRED
            requestedStatus: REJECTED
            errors:
              - { field: reason, code: REQUIRED, message: A reason is required. }
    Unauthorized:
      description: Not logged in, session expired (`UNAUTHENTICATED`) or wrong credentials (`BAD_CREDENTIALS`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:unauthenticated
            title: Not logged in
            status: 401
            code: UNAUTHENTICATED
    Forbidden:
      description: The role does not allow this action (`FORBIDDEN`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:forbidden
            title: Not allowed
            status: 403
            detail: Only managers and admins can close an account.
            code: FORBIDDEN
    NotFound:
      description: No such record (`NOT_FOUND`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:not-found
            title: Not found
            status: 404
            detail: Account 0192a5b8-0000-7000-8000-000000000001 does not exist.
            code: NOT_FOUND
    Conflict:
      description: |
        `ILLEGAL_TRANSITION` (with `currentStatus`, `requestedStatus`, `allowed`),
        `TRANSITION_GUARD_FAILED`, `VERSION_CONFLICT`, `DUPLICATE` (with `existingId`) or `STATE_CONFLICT`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: urn:recruiting:problem:illegal-transition
            title: Illegal status change
            status: 409
            detail: Cannot move from Filled to Sourcing.
            code: ILLEGAL_TRANSITION
            currentStatus: FILLED
            requestedStatus: SOURCING
            allowed: []
    Gone:
      description: The consent link has expired (`GONE`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Problem:
      description: Other error (see `code`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
  schemas:
    # ---------- common ----------
    Id:
      type: string
      format: uuid
      description: UUID v7 (ADR 0004)
      examples: [0192a5b8-6f1e-7c3a-9b2d-3f4e5a6b7c8d]
    Version:
      type: integer
      format: int64
      minimum: 0
      description: Optimistic-lock version; send it back on updates.
    Reason:
      type: [string, 'null']
      maxLength: 1000
      description: Why the status changes. Required for some moves (see API description).
    PageMeta:
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size: { type: integer, examples: [20] }
        number: { type: integer, description: 0-based page number, examples: [0] }
        totalElements: { type: integer, format: int64, examples: [42] }
        totalPages: { type: integer, examples: [3] }
    ProblemDetail:
      type: object
      description: RFC 9457 problem details with extension members.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, examples: [urn:recruiting:problem:validation-failed] }
        title: { type: string, examples: [Validation failed] }
        status: { type: integer, examples: [400] }
        detail: { type: string }
        instance: { type: string, format: uri-reference, description: Request path }
        code: { $ref: '#/components/schemas/ErrorCode' }
        errors:
          type: array
          description: Field errors for VALIDATION_FAILED and REASON_REQUIRED.
          items: { $ref: '#/components/schemas/FieldError' }
        currentStatus: { type: string, description: ILLEGAL_TRANSITION and TRANSITION_GUARD_FAILED }
        requestedStatus: { type: string, description: 'ILLEGAL_TRANSITION, TRANSITION_GUARD_FAILED and REASON_REQUIRED' }
        allowed:
          type: array
          items: { type: string }
          description: ILLEGAL_TRANSITION — the statuses the record may move to.
        existingId:
          $ref: '#/components/schemas/Id'
          description: DUPLICATE — the record that already exists.
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, examples: [name] }
        code: { type: string, description: 'Bean Validation constraint, e.g. REQUIRED, SIZE, EMAIL, PATTERN', examples: [REQUIRED] }
        message: { type: string, examples: [must not be blank] }
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Deniz Aksoy] }
    AccountRef:
      type: object
      required: [id, name, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Anadolu Gıda A.Ş.] }
        status: { $ref: '#/components/schemas/AccountStatus' }
    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Elif Yıldırım] }
    JobOrderRef:
      type: object
      required: [id, title, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string, examples: [Chief Financial Officer] }
        status: { $ref: '#/components/schemas/JobOrderStatus' }
    # ---------- enums (contracts/enums) ----------
    AccountStatus:
      type: string
      enum: [LEAD, PROPOSAL_SENT, ACTIVE, ON_HOLD, CLOSED]
    ProposalStatus:
      type: string
      enum: [DRAFT, SENT, ACCEPTED, REJECTED]
    JobOrderStatus:
      type: string
      enum: [OPEN, SOURCING, SHORTLIST_SENT, INTERVIEWING, OFFER, FILLED, CANCELLED]
    PipelineStage:
      type: string
      enum: [SOURCED, SCREENED, PRESENTED, CLIENT_INTERVIEW, OFFER, PLACED, REJECTED]
    ConsentStatus:
      type: string
      enum: [NOT_SENT, SENT, GIVEN, REFUSED, WITHDRAWN]
    DataSubjectRequestStatus:
      type: string
      enum: [RECEIVED, IN_PROGRESS, COMPLETED, REJECTED]
    DataSubjectRequestType:
      type: string
      enum: [ACCESS, CORRECTION, DELETION, OTHER]
    PersonType:
      type: string
      enum: [EXECUTIVE, CLIENT_CONTACT, REFERRER, CANDIDATE]
    ActivityType:
      type: string
      enum: [CALL, VISIT, MEETING, EMAIL, NOTE]
    LinkType:
      type: string
      enum: [KNOWS, WORKED_WITH, INTRODUCED, REFERRED, REPORTS_TO]
    Role:
      type: string
      enum: [CONSULTANT, MANAGER, ADMIN]
    ConsentDecision:
      type: string
      enum: [GIVEN, REFUSED, WITHDRAWN]
    ConsentChannel:
      type: string
      enum: [EMAIL_LINK, WEBSITE_FORM, IN_PERSON, PHONE, IMPORT]
    EmailDeliveryStatus:
      type: string
      enum: [QUEUED, SENT, FAILED]
    RetentionStatus:
      type: string
      enum: [ACTIVE, FLAGGED, ANONYMISED]
    RetentionBasis:
      type: string
      enum: [FROM_CREATED, FROM_LAST_CONTACT]
    RetentionAction:
      type: string
      enum: [ANONYMISE, DELETE]
    ImportKind:
      type: string
      enum: [ACCOUNTS, CONTACTS, PEOPLE]
    ImportStatus:
      type: string
      enum: [VALIDATED, IMPORTING, COMPLETED, FAILED, DISCARDED]
    TimelineKind:
      type: string
      enum: [ACCOUNT, ACCOUNT_STATUS, CONTACT, ACTIVITY, PROPOSAL, JOB_ORDER, CANDIDATE]
    EntityType:
      type: string
      enum: [ACCOUNT, PERSON, CONTACT, NETWORK_LINK, JOB_ORDER, APPLICATION, PROPOSAL, ACTIVITY, NEXT_ACTION, USER, CONSENT_RECORD, CONSENT_REQUEST, PRIVACY_NOTICE, DATA_SUBJECT_REQUEST, IMPORT_JOB]
    AccessAction:
      type: string
      enum: [VIEW, EXPORT, DOWNLOAD]
    RevisionType:
      type: string
      enum: [ADD, MOD, DEL]
    Language:
      type: string
      enum: [TR, EN]
    SearchType:
      type: string
      enum: [ACCOUNT, PERSON, JOB_ORDER]
    Tone:
      type: string
      enum: [NEUTRAL, INFO, PROGRESS, GOOD, WARN, BAD, MUTED]
    ErrorCode:
      type: string
      enum: [VALIDATION_FAILED, REASON_REQUIRED, UNAUTHENTICATED, BAD_CREDENTIALS, FORBIDDEN, NOT_FOUND, ILLEGAL_TRANSITION, TRANSITION_GUARD_FAILED, VERSION_CONFLICT, DUPLICATE, STATE_CONFLICT, GONE, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, INTERNAL_ERROR]
    # ---------- auth and users ----------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, examples: [deniz.aksoy@example.com] }
        password: { type: string, format: password, minLength: 1, maxLength: 200 }
    CurrentUser:
      type: object
      required: [id, email, name, role, language, mustChangePassword]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email, examples: [deniz.aksoy@example.com] }
        name: { type: string, examples: [Deniz Aksoy] }
        role: { $ref: '#/components/schemas/Role' }
        language: { $ref: '#/components/schemas/Language' }
        mustChangePassword: { type: boolean, examples: [false] }
    CurrentUserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        language: { $ref: '#/components/schemas/Language' }
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 12, maxLength: 200 }
    PasswordResetRequest:
      type: object
      required: [initialPassword]
      properties:
        initialPassword: { type: string, format: password, minLength: 12, maxLength: 200 }
    User:
      type: object
      required: [id, email, name, role, active, language, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        name: { type: string, examples: [Deniz Aksoy] }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean, examples: [true] }
        language: { $ref: '#/components/schemas/Language' }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    UserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { $ref: '#/components/schemas/PageMeta' }
    UserCreateRequest:
      type: object
      required: [email, name, role, initialPassword]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
        language: { $ref: '#/components/schemas/Language' }
        initialPassword: { type: string, format: password, minLength: 12, maxLength: 200 }
    UserUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
        language: { $ref: '#/components/schemas/Language' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- reference data ----------
    StatusDefinition:
      type: object
      required: [value, labelEn, labelTr, tone, terminal, next]
      properties:
        value: { type: string, examples: [ON_HOLD] }
        labelEn: { type: string, examples: [On hold] }
        labelTr: { type: string, examples: [Beklemede] }
        tone: { $ref: '#/components/schemas/Tone' }
        terminal: { type: boolean }
        next:
          type: array
          description: Allowed next statuses with their rules.
          items: { $ref: '#/components/schemas/TransitionDefinition' }
    TransitionDefinition:
      type: object
      required: [to, reasonRequired, managerOnly]
      properties:
        to: { type: string, examples: [CLOSED] }
        reasonRequired: { type: boolean, examples: [true] }
        managerOnly: { type: boolean, description: Only MANAGER and ADMIN may make this move., examples: [true] }
    LifecycleDefinition:
      type: object
      required: [initial, statuses]
      properties:
        initial: { type: string, examples: [LEAD] }
        statuses:
          type: array
          description: In display order.
          items: { $ref: '#/components/schemas/StatusDefinition' }
    ReferenceData:
      type: object
      required: [today, lifecycles, stageOrder, vocabularies, sectors]
      properties:
        today: { type: string, format: date, description: Server date (Europe/Istanbul). }
        lifecycles:
          type: object
          required: [account, proposal, jobOrder, pipelineStage, consent, dataSubjectRequest]
          properties:
            account: { $ref: '#/components/schemas/LifecycleDefinition' }
            proposal: { $ref: '#/components/schemas/LifecycleDefinition' }
            jobOrder: { $ref: '#/components/schemas/LifecycleDefinition' }
            pipelineStage: { $ref: '#/components/schemas/LifecycleDefinition' }
            consent: { $ref: '#/components/schemas/LifecycleDefinition' }
            dataSubjectRequest: { $ref: '#/components/schemas/LifecycleDefinition' }
        stageOrder:
          type: array
          description: Board columns, left to right (REJECTED last).
          items: { $ref: '#/components/schemas/PipelineStage' }
        vocabularies:
          type: object
          description: Values of the plain enums; labels come from the frontend i18n files.
          required: [personType, activityType, linkType, role, consentChannel, dataSubjectRequestType, language]
          properties:
            personType: { type: array, items: { $ref: '#/components/schemas/PersonType' } }
            activityType: { type: array, items: { $ref: '#/components/schemas/ActivityType' } }
            linkType: { type: array, items: { $ref: '#/components/schemas/LinkType' } }
            role: { type: array, items: { $ref: '#/components/schemas/Role' } }
            consentChannel: { type: array, items: { $ref: '#/components/schemas/ConsentChannel' } }
            dataSubjectRequestType: { type: array, items: { $ref: '#/components/schemas/DataSubjectRequestType' } }
            language: { type: array, items: { $ref: '#/components/schemas/Language' } }
        sectors:
          type: array
          description: Distinct sectors in use, sorted (free text on the account, suggested in pickers).
          items: { type: string }
          examples: [[Finance, FMCG, Retail, Technology]]
    # ---------- accounts ----------
    Account:
      type: object
      required: [id, name, sector, owner, status, statusChangedAt, openedOn, openJobCount, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Anadolu Gıda A.Ş.] }
        sector: { type: string, examples: [FMCG] }
        city: { type: [string, 'null'], examples: [İstanbul] }
        website: { type: [string, 'null'], format: uri }
        notes: { type: [string, 'null'] }
        owner: { $ref: '#/components/schemas/UserRef' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        statusChangedAt: { type: string, format: date-time }
        openedOn: { type: string, format: date }
        openJobCount: { type: integer, minimum: 0, description: Job orders not FILLED or CANCELLED., examples: [2] }
        lastActivityAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    AccountPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        page: { $ref: '#/components/schemas/PageMeta' }
    AccountCreateRequest:
      type: object
      required: [name, sector]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        sector: { type: string, minLength: 1, maxLength: 100 }
        city: { type: [string, 'null'], maxLength: 100 }
        website: { type: [string, 'null'], format: uri, maxLength: 300 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        ownerId:
          $ref: '#/components/schemas/Id'
          description: Defaults to the current user.
    AccountUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        sector: { type: string, minLength: 1, maxLength: 100 }
        city: { type: [string, 'null'], maxLength: 100 }
        website: { type: [string, 'null'], format: uri, maxLength: 300 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        ownerId: { $ref: '#/components/schemas/Id' }
        version: { $ref: '#/components/schemas/Version' }
    AccountStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AccountStatus' }
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    AccountConnection:
      type: object
      required: [contact, person, linkType, direction]
      properties:
        contact:
          $ref: '#/components/schemas/PersonRef'
          description: The account's contact.
        person: { $ref: '#/components/schemas/PersonSummary' }
        linkType: { $ref: '#/components/schemas/LinkType' }
        direction: { $ref: '#/components/schemas/LinkDirection' }
    # ---------- people ----------
    PersonSummary:
      type: object
      required: [id, name, type, owner, consentStatus, retentionStatus]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, examples: [Elif Yıldırım] }
        title: { type: [string, 'null'], examples: [Finance Director] }
        company: { type: [string, 'null'], examples: [Marmara Holding] }
        type: { $ref: '#/components/schemas/PersonType' }
        city: { type: [string, 'null'], examples: [Ankara] }
        email: { type: [string, 'null'], format: email }
        owner: { $ref: '#/components/schemas/UserRef' }
        lastContactAt: { type: [string, 'null'], format: date-time }
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
        retentionStatus: { $ref: '#/components/schemas/RetentionStatus' }
    PersonSummaryPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/PersonSummary' }
        page: { $ref: '#/components/schemas/PageMeta' }
    Employment:
      type: object
      required: [company]
      properties:
        company: { type: string, maxLength: 200, examples: [Marmara Holding] }
        title: { type: [string, 'null'], maxLength: 200, examples: [Finance Director] }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date, description: '`null` = current' }
    Person:
      allOf:
        - $ref: '#/components/schemas/PersonSummary'
        - type: object
          required: [employments, anonymised, createdAt, updatedAt, version]
          properties:
            phone: { type: [string, 'null'], examples: ['+90 555 000 00 00'] }
            linkedinUrl: { type: [string, 'null'], format: uri, description: Profile URL entered by hand; no scraping. }
            howWeKnow: { type: [string, 'null'], examples: [Met at a CFO roundtable] }
            notes: { type: [string, 'null'] }
            employments:
              type: array
              description: Company history, most recent first.
              items: { $ref: '#/components/schemas/Employment' }
            anonymised: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            version: { $ref: '#/components/schemas/Version' }
    PersonCreateRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/PersonType' }
        title: { type: [string, 'null'], maxLength: 200 }
        company: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 50 }
        city: { type: [string, 'null'], maxLength: 100 }
        linkedinUrl: { type: [string, 'null'], format: uri, maxLength: 300 }
        howWeKnow: { type: [string, 'null'], maxLength: 1000 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        ownerId:
          $ref: '#/components/schemas/Id'
          description: Defaults to the current user.
        employments:
          type: array
          items: { $ref: '#/components/schemas/Employment' }
    PersonUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/PersonType' }
        title: { type: [string, 'null'], maxLength: 200 }
        company: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 50 }
        city: { type: [string, 'null'], maxLength: 100 }
        linkedinUrl: { type: [string, 'null'], format: uri, maxLength: 300 }
        howWeKnow: { type: [string, 'null'], maxLength: 1000 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        ownerId: { $ref: '#/components/schemas/Id' }
        employments:
          type: array
          items: { $ref: '#/components/schemas/Employment' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- contacts ----------
    Contact:
      type: object
      required: [id, account, person, primary, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/AccountRef' }
        person: { $ref: '#/components/schemas/PersonSummary' }
        role: { type: [string, 'null'], examples: [HR Director] }
        primary: { type: boolean }
        createdAt: { type: string, format: date-time }
    ContactCreateRequest:
      type: object
      description: Exactly one of `personId` and `person`.
      properties:
        personId: { $ref: '#/components/schemas/Id' }
        person: { $ref: '#/components/schemas/PersonCreateRequest' }
        role: { type: [string, 'null'], maxLength: 200 }
        primary: { type: boolean, default: false }
    ContactUpdateRequest:
      type: object
      properties:
        role: { type: [string, 'null'], maxLength: 200 }
        primary: { type: boolean }
    # ---------- network links ----------
    LinkDirection:
      type: string
      description: Seen from the person whose links are listed. Symmetric types are always BOTH.
      enum: [OUTGOING, INCOMING, BOTH]
    NetworkLink:
      type: object
      required: [id, from, to, type, createdAt, createdBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        from: { $ref: '#/components/schemas/PersonRef' }
        to: { $ref: '#/components/schemas/PersonRef' }
        type: { $ref: '#/components/schemas/LinkType' }
        note: { type: [string, 'null'], examples: [Introduced at a dinner in 2024] }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
    NetworkLinkCreateRequest:
      type: object
      required: [fromPersonId, toPersonId, type]
      properties:
        fromPersonId: { $ref: '#/components/schemas/Id' }
        toPersonId: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/LinkType' }
        note: { type: [string, 'null'], maxLength: 1000 }
    NetworkLinkUpdateRequest:
      type: object
      properties:
        type: { $ref: '#/components/schemas/LinkType' }
        note: { type: [string, 'null'], maxLength: 1000 }
    PersonConnection:
      type: object
      required: [linkId, type, direction, person]
      properties:
        linkId: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/LinkType' }
        direction: { $ref: '#/components/schemas/LinkDirection' }
        person: { $ref: '#/components/schemas/PersonSummary' }
        note: { type: [string, 'null'] }
    # ---------- import ----------
    ImportRowError:
      type: object
      required: [row, message]
      properties:
        row: { type: integer, description: 1-based data row (header excluded), examples: [7] }
        column: { type: [string, 'null'], examples: [email] }
        message: { type: string, examples: [Not a valid e-mail address] }
    ImportJob:
      type: object
      required: [id, kind, status, fileName, totalRows, validRows, duplicateRows, importedRows, errors, createdAt, createdBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/ImportKind' }
        status: { $ref: '#/components/schemas/ImportStatus' }
        fileName: { type: string, examples: [accounts.csv] }
        totalRows: { type: integer, examples: [120] }
        validRows: { type: integer, examples: [115] }
        duplicateRows: { type: integer, description: Rows matching an existing record; skipped., examples: [3] }
        importedRows: { type: integer, examples: [0] }
        errors:
          type: array
          description: First 500 row errors.
          items: { $ref: '#/components/schemas/ImportRowError' }
        failureReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        completedAt: { type: [string, 'null'], format: date-time }
    ImportJobPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ImportJob' }
        page: { $ref: '#/components/schemas/PageMeta' }
    # ---------- search ----------
    SearchResults:
      type: object
      required: [query, accounts, people, jobOrders, totals]
      properties:
        query: { type: string, examples: [ozturk] }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/Account' }
        people:
          type: array
          items: { $ref: '#/components/schemas/PersonSummary' }
        jobOrders:
          type: array
          items: { $ref: '#/components/schemas/JobOrder' }
        totals:
          type: object
          required: [accounts, people, jobOrders]
          properties:
            accounts: { type: integer }
            people: { type: integer }
            jobOrders: { type: integer }
    # ---------- job orders and pipeline ----------
    StageCounts:
      type: object
      description: Applications per stage; every stage present.
      required: [SOURCED, SCREENED, PRESENTED, CLIENT_INTERVIEW, OFFER, PLACED, REJECTED]
      properties:
        SOURCED: { type: integer, examples: [3] }
        SCREENED: { type: integer, examples: [2] }
        PRESENTED: { type: integer, examples: [1] }
        CLIENT_INTERVIEW: { type: integer, examples: [1] }
        OFFER: { type: integer, examples: [0] }
        PLACED: { type: integer, examples: [0] }
        REJECTED: { type: integer, examples: [2] }
    JobOrder:
      type: object
      required: [id, account, title, status, owner, openedOn, daysOpen, activeCandidates, stageCounts, statusChangedAt, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/AccountRef' }
        title: { type: string, examples: [Chief Financial Officer] }
        location: { type: [string, 'null'], examples: [İstanbul] }
        seniority: { type: [string, 'null'], examples: [C-level] }
        description: { type: [string, 'null'] }
        feeTerms: { type: [string, 'null'], examples: ['33% of first-year salary, retained'] }
        status: { $ref: '#/components/schemas/JobOrderStatus' }
        statusChangedAt: { type: string, format: date-time }
        owner: { $ref: '#/components/schemas/UserRef' }
        openedOn: { type: string, format: date }
        closedOn: { type: [string, 'null'], format: date, description: Set on FILLED or CANCELLED. }
        daysOpen: { type: integer, description: From openedOn to closedOn or today., examples: [21] }
        activeCandidates: { type: integer, description: Applications not PLACED or REJECTED., examples: [7] }
        stageCounts: { $ref: '#/components/schemas/StageCounts' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    JobOrderPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/JobOrder' }
        page: { $ref: '#/components/schemas/PageMeta' }
    JobOrderCreateRequest:
      type: object
      required: [accountId, title]
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        title: { type: string, minLength: 1, maxLength: 200 }
        location: { type: [string, 'null'], maxLength: 200 }
        seniority: { type: [string, 'null'], maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 10000 }
        feeTerms: { type: [string, 'null'], maxLength: 2000 }
        openedOn: { type: string, format: date, description: Defaults to today. }
        ownerId:
          $ref: '#/components/schemas/Id'
          description: Defaults to the current user.
    JobOrderUpdateRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        location: { type: [string, 'null'], maxLength: 200 }
        seniority: { type: [string, 'null'], maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 10000 }
        feeTerms: { type: [string, 'null'], maxLength: 2000 }
        openedOn: { type: string, format: date }
        ownerId: { $ref: '#/components/schemas/Id' }
        version: { $ref: '#/components/schemas/Version' }
    JobOrderStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/JobOrderStatus' }
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    Application:
      type: object
      required: [id, jobOrder, account, person, stage, stageChangedAt, addedAt, addedBy, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        jobOrder: { $ref: '#/components/schemas/JobOrderRef' }
        account: { $ref: '#/components/schemas/AccountRef' }
        person: { $ref: '#/components/schemas/PersonSummary' }
        stage: { $ref: '#/components/schemas/PipelineStage' }
        rejectionReason: { type: [string, 'null'], description: Set while the stage is REJECTED. }
        stageChangedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time }
        addedBy: { $ref: '#/components/schemas/UserRef' }
        version: { $ref: '#/components/schemas/Version' }
    ApplicationCreateRequest:
      type: object
      required: [personId]
      properties:
        personId: { $ref: '#/components/schemas/Id' }
    StageChangeRequest:
      type: object
      required: [stage]
      properties:
        stage: { $ref: '#/components/schemas/PipelineStage' }
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- proposals ----------
    Proposal:
      type: object
      required: [id, account, title, status, statusChangedAt, owner, createdAt, updatedAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/AccountRef' }
        title: { type: string, examples: [Executive search — CFO] }
        terms: { type: [string, 'null'], examples: ['Retainer in three instalments, 90-day guarantee'] }
        feeAmount: { type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$', description: Decimal as string to avoid rounding., examples: ['450000.00'] }
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$', examples: [TRY] }
        status: { $ref: '#/components/schemas/ProposalStatus' }
        statusChangedAt: { type: string, format: date-time }
        statusReason: { type: [string, 'null'], description: Reason of the last status change (e.g. why rejected). }
        sentOn: { type: [string, 'null'], format: date }
        decidedOn: { type: [string, 'null'], format: date, description: Set on ACCEPTED or REJECTED. }
        owner: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    ProposalPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Proposal' }
        page: { $ref: '#/components/schemas/PageMeta' }
    ProposalCreateRequest:
      type: object
      required: [accountId, title]
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        title: { type: string, minLength: 1, maxLength: 200 }
        terms: { type: [string, 'null'], maxLength: 10000 }
        feeAmount: { type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$' }
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        ownerId: { $ref: '#/components/schemas/Id' }
    ProposalUpdateRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        terms: { type: [string, 'null'], maxLength: 10000 }
        feeAmount: { type: [string, 'null'], pattern: '^\d+(\.\d{1,2})?$' }
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        ownerId: { $ref: '#/components/schemas/Id' }
        version: { $ref: '#/components/schemas/Version' }
    ProposalStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ProposalStatus' }
        reason: { $ref: '#/components/schemas/Reason' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- activities and next actions ----------
    Activity:
      type: object
      required: [id, type, note, occurredAt, user, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/ActivityType' }
        note: { type: string, examples: [Discussed the CFO search timeline.] }
        occurredAt: { type: string, format: date-time }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        person: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        jobOrder: { oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }] }
        user: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    ActivityPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        page: { $ref: '#/components/schemas/PageMeta' }
    ActivityCreateRequest:
      type: object
      required: [type, note]
      description: At least one of `accountId` and `personId`.
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        note: { type: string, minLength: 1, maxLength: 4000 }
        occurredAt: { type: string, format: date-time, description: Defaults to now; may not be in the future. }
        accountId: { $ref: '#/components/schemas/Id' }
        personId: { $ref: '#/components/schemas/Id' }
        jobOrderId: { $ref: '#/components/schemas/Id' }
    ActivityUpdateRequest:
      type: object
      properties:
        type: { $ref: '#/components/schemas/ActivityType' }
        note: { type: string, minLength: 1, maxLength: 4000 }
        occurredAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    NextAction:
      type: object
      required: [id, title, dueOn, owner, done, overdue, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string, examples: [Send shortlist to HR Director] }
        dueOn: { type: string, format: date }
        owner: { $ref: '#/components/schemas/UserRef' }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        person: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        jobOrder: { oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }] }
        done: { type: boolean }
        doneAt: { type: [string, 'null'], format: date-time }
        overdue: { type: boolean, description: Not done and dueOn before today. }
        createdAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    NextActionPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/NextAction' }
        page: { $ref: '#/components/schemas/PageMeta' }
    NextActionCreateRequest:
      type: object
      required: [title, dueOn]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        dueOn: { type: string, format: date }
        ownerId: { $ref: '#/components/schemas/Id' }
        accountId: { $ref: '#/components/schemas/Id' }
        personId: { $ref: '#/components/schemas/Id' }
        jobOrderId: { $ref: '#/components/schemas/Id' }
    NextActionUpdateRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        dueOn: { type: string, format: date }
        ownerId: { $ref: '#/components/schemas/Id' }
        done: { type: boolean }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- timeline, dashboard, home ----------
    TimelineEntry:
      type: object
      required: [id, accountId, occurredAt, kind, entityType, entityId, summary]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        accountId: { $ref: '#/components/schemas/Id' }
        occurredAt: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/TimelineKind' }
        entityType: { $ref: '#/components/schemas/EntityType' }
        entityId: { $ref: '#/components/schemas/Id' }
        fromStatus: { type: [string, 'null'], examples: [ACTIVE] }
        toStatus: { type: [string, 'null'], examples: [ON_HOLD] }
        reason: { type: [string, 'null'], examples: [Client froze hiring until Q1] }
        summary: { type: string, description: 'Short English text for logs; the UI builds its own TR/EN text from kind, statuses and refs.', examples: [Account moved from Active to On hold] }
        person: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        jobOrder: { oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }] }
        actor: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: '`null` for system jobs.' }
    TimelineEntryPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/TimelineEntry' }
        page: { $ref: '#/components/schemas/PageMeta' }
    AccountDashboard:
      type: object
      required: [accountId, openJobOrders, candidatesPerStage, placedCount, openProposals]
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        openJobOrders: { type: integer, examples: [2] }
        candidatesPerStage: { $ref: '#/components/schemas/StageCounts' }
        avgDaysOpen: { type: [number, 'null'], description: Average days open of open job orders., examples: [18.5] }
        placedCount: { type: integer, examples: [4] }
        openProposals: { type: integer, description: DRAFT or SENT., examples: [1] }
        nextAction: { oneOf: [{ $ref: '#/components/schemas/NextAction' }, { type: 'null' }] }
    MyDay:
      type: object
      required: [user, today, nextActions, overdueCount, openJobOrders, recentAccounts, stats]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        today: { type: string, format: date }
        nextActions:
          type: array
          description: Current user's open actions due within 7 days or overdue, by due date (max 20).
          items: { $ref: '#/components/schemas/NextAction' }
        overdueCount: { type: integer, examples: [2] }
        openJobOrders:
          type: array
          description: Current user's open job orders (max 20).
          items: { $ref: '#/components/schemas/JobOrder' }
        recentAccounts:
          type: array
          description: 5 accounts with the latest activity.
          items: { $ref: '#/components/schemas/Account' }
        stats:
          type: object
          required: [activeAccounts, openJobOrders, candidatesInProcess, placedThisYear]
          properties:
            activeAccounts: { type: integer }
            openJobOrders: { type: integer }
            candidatesInProcess: { type: integer }
            placedThisYear: { type: integer }
    # ---------- privacy ----------
    PrivacyNoticeRef:
      type: object
      required: [id, version, language]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        version: { type: string, examples: ['2026-10'] }
        language: { $ref: '#/components/schemas/Language' }
    PrivacyNotice:
      type: object
      required: [id, version, language, noticeText, consentText, effectiveFrom, current, createdAt, createdBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        version: { type: string, examples: ['2026-10'] }
        language: { $ref: '#/components/schemas/Language' }
        noticeText: { type: string, description: 'Information notice (aydınlatma metni), Markdown.' }
        consentText: { type: string, description: 'Explicit consent declaration (açık rıza beyanı), Markdown.' }
        effectiveFrom: { type: string, format: date }
        current: { type: boolean, description: In force for its language. }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
    PrivacyNoticeCreateRequest:
      type: object
      required: [version, language, noticeText, consentText, effectiveFrom]
      properties:
        version: { type: string, minLength: 1, maxLength: 40 }
        language: { $ref: '#/components/schemas/Language' }
        noticeText: { type: string, minLength: 1, maxLength: 50000 }
        consentText: { type: string, minLength: 1, maxLength: 10000 }
        effectiveFrom: { type: string, format: date }
    ConsentRecord:
      type: object
      required: [id, personId, decision, channel, notice, recordedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        personId: { $ref: '#/components/schemas/Id' }
        decision: { $ref: '#/components/schemas/ConsentDecision' }
        channel: { $ref: '#/components/schemas/ConsentChannel' }
        notice: { $ref: '#/components/schemas/PrivacyNoticeRef' }
        recordedAt: { type: string, format: date-time, description: When the person decided. }
        recordedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: '`null` when the person used the e-mail link.' }
        evidence: { type: [string, 'null'], description: E.g. "signed form in file 2026/14". }
    ConsentRecordCreateRequest:
      type: object
      required: [decision, channel, noticeId]
      properties:
        decision: { $ref: '#/components/schemas/ConsentDecision' }
        channel:
          type: string
          enum: [IN_PERSON, PHONE, IMPORT]
          description: EMAIL_LINK and WEBSITE_FORM are recorded by the system only.
        noticeId: { $ref: '#/components/schemas/Id' }
        recordedAt: { type: string, format: date-time, description: Defaults to now; may not be in the future. }
        evidence: { type: string, minLength: 1, maxLength: 1000 }
    ConsentRequest:
      type: object
      required: [id, personId, notice, language, deliveryStatus, queuedAt, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        personId: { $ref: '#/components/schemas/Id' }
        notice: { $ref: '#/components/schemas/PrivacyNoticeRef' }
        language: { $ref: '#/components/schemas/Language' }
        deliveryStatus: { $ref: '#/components/schemas/EmailDeliveryStatus' }
        queuedAt: { type: string, format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
        failureReason: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
        respondedAt: { type: [string, 'null'], format: date-time }
        response: { oneOf: [{ $ref: '#/components/schemas/ConsentDecision' }, { type: 'null' }] }
        requestedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: '`null` when sent automatically.' }
    ConsentRequestPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ConsentRequest' }
        page: { $ref: '#/components/schemas/PageMeta' }
    ConsentRequestCreateRequest:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/Language'
          description: Defaults to TR.
    ConsentRequestBulkRequest:
      type: object
      properties:
        personIds:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/Id' }
        importId:
          $ref: '#/components/schemas/Id'
          description: All people created by this import (instead of personIds).
        consentStatus:
          type: array
          description: Or all people currently in these statuses.
          items: { $ref: '#/components/schemas/ConsentStatus' }
        language: { $ref: '#/components/schemas/Language' }
    ConsentRequestBulkResult:
      type: object
      required: [queued, skipped]
      properties:
        queued: { type: integer, examples: [96] }
        skipped: { type: integer, examples: [4] }
    RetentionInfo:
      type: object
      required: [status, basisDate, retainUntil]
      properties:
        status: { $ref: '#/components/schemas/RetentionStatus' }
        basisDate: { type: string, format: date, description: Start of the period per the retention basis. }
        retainUntil: { type: string, format: date }
        flaggedAt: { type: [string, 'null'], format: date-time }
    ConsentOverview:
      type: object
      required: [personId, status, retention, records]
      properties:
        personId: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/ConsentStatus' }
        noticeSentAt: { type: [string, 'null'], format: date-time, description: First time the information notice was sent (NFR-01). }
        lastRequest: { oneOf: [{ $ref: '#/components/schemas/ConsentRequest' }, { type: 'null' }] }
        retention: { $ref: '#/components/schemas/RetentionInfo' }
        records:
          type: array
          description: All consent records, newest first.
          items: { $ref: '#/components/schemas/ConsentRecord' }
    PublicConsentView:
      type: object
      required: [language, noticeVersion, noticeText, consentText, firstName, status, expiresAt]
      properties:
        language: { $ref: '#/components/schemas/Language' }
        noticeVersion: { type: string }
        noticeText: { type: string }
        consentText: { type: string }
        firstName: { type: string, description: First name only; no other personal data on the public page. }
        controllerName: { type: string, description: The data controller (the firm). }
        status: { $ref: '#/components/schemas/ConsentStatus' }
        expiresAt: { type: string, format: date-time }
    PublicConsentDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/ConsentDecision' }
    RetentionSettings:
      type: object
      required: [retentionMonths, basis, action, warningDays, autoSendNotice, autoSendPersonTypes, version]
      properties:
        retentionMonths: { type: integer, minimum: 1, maximum: 120, default: 24, examples: [24] }
        basis: { $ref: '#/components/schemas/RetentionBasis' }
        action: { $ref: '#/components/schemas/RetentionAction' }
        warningDays: { type: integer, minimum: 0, maximum: 365, default: 30, description: Flag this many days before the end. }
        autoSendNotice: { type: boolean, default: true, description: Queue the notice and consent e-mail when a person with e-mail is created (S-01). }
        autoSendPersonTypes:
          type: array
          description: Person types that get the automatic e-mail (default CANDIDATE, EXECUTIVE).
          items: { $ref: '#/components/schemas/PersonType' }
        renewOnConsent: { type: boolean, default: true, description: A GIVEN consent restarts the retention period. }
        version: { $ref: '#/components/schemas/Version' }
    RetentionItem:
      type: object
      required: [person, retention]
      properties:
        person: { $ref: '#/components/schemas/PersonSummary' }
        retention: { $ref: '#/components/schemas/RetentionInfo' }
    RetentionItemPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/RetentionItem' }
        page: { $ref: '#/components/schemas/PageMeta' }
    RetentionRunRequest:
      type: object
      required: [dryRun]
      properties:
        dryRun: { type: boolean, examples: [true] }
    RetentionRun:
      type: object
      required: [id, startedAt, dryRun, flaggedCount, anonymisedCount, deletedCount]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        triggeredBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: '`null` = nightly scheduler.' }
        dryRun: { type: boolean }
        flaggedCount: { type: integer }
        anonymisedCount: { type: integer }
        deletedCount: { type: integer }
        failureReason: { type: [string, 'null'] }
    RetentionRunPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/RetentionRun' }
        page: { $ref: '#/components/schemas/PageMeta' }
    DataSubjectRequest:
      type: object
      required: [id, requesterName, requesterEmail, type, status, receivedAt, dueOn, createdAt, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        person: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }], description: Linked once identified. }
        requesterName: { type: string }
        requesterEmail: { type: string, format: email }
        type: { $ref: '#/components/schemas/DataSubjectRequestType' }
        status: { $ref: '#/components/schemas/DataSubjectRequestStatus' }
        description: { type: [string, 'null'] }
        receivedAt: { type: string, format: date-time }
        dueOn: { type: string, format: date, description: receivedAt + 30 days (KVKK art. 13). }
        overdue: { type: boolean }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolution: { type: [string, 'null'], description: 'What was done, or why rejected.' }
        handledBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        version: { $ref: '#/components/schemas/Version' }
    DataSubjectRequestPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/DataSubjectRequest' }
        page: { $ref: '#/components/schemas/PageMeta' }
    DataSubjectRequestCreateRequest:
      type: object
      required: [requesterName, requesterEmail, type]
      properties:
        personId: { $ref: '#/components/schemas/Id' }
        requesterName: { type: string, minLength: 1, maxLength: 200 }
        requesterEmail: { type: string, format: email, maxLength: 254 }
        type: { $ref: '#/components/schemas/DataSubjectRequestType' }
        description: { type: [string, 'null'], maxLength: 4000 }
        receivedAt: { type: string, format: date-time, description: Defaults to now. }
    DataSubjectRequestUpdateRequest:
      type: object
      properties:
        personId: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/DataSubjectRequestStatus' }
        reason: { $ref: '#/components/schemas/Reason' }
        resolution: { type: [string, 'null'], maxLength: 4000 }
        handledById: { $ref: '#/components/schemas/Id' }
        version: { $ref: '#/components/schemas/Version' }
    AnonymiseRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        dataSubjectRequestId: { $ref: '#/components/schemas/Id' }
    PersonDataExport:
      type: object
      required: [exportedAt, exportedBy, person, contactRoles, links, activities, applications, consent]
      properties:
        exportedAt: { type: string, format: date-time }
        exportedBy: { $ref: '#/components/schemas/UserRef' }
        person: { $ref: '#/components/schemas/Person' }
        contactRoles:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        links:
          type: array
          items: { $ref: '#/components/schemas/PersonConnection' }
        activities:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        applications:
          type: array
          items: { $ref: '#/components/schemas/Application' }
        consent: { $ref: '#/components/schemas/ConsentOverview' }
    # ---------- audit ----------
    AccessLogEntry:
      type: object
      required: [id, user, action, entityType, entityId, at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        user: { $ref: '#/components/schemas/UserRef' }
        action: { $ref: '#/components/schemas/AccessAction' }
        entityType: { $ref: '#/components/schemas/EntityType' }
        entityId: { $ref: '#/components/schemas/Id' }
        at: { type: string, format: date-time }
        ipAddress: { type: [string, 'null'] }
    AccessLogEntryPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AccessLogEntry' }
        page: { $ref: '#/components/schemas/PageMeta' }
    FieldChange:
      type: object
      required: [field]
      properties:
        field: { type: string, examples: [status] }
        from: { description: Previous value (any JSON type). }
        to: { description: New value (any JSON type). }
    Revision:
      type: object
      required: [revision, at, type, changes]
      properties:
        revision: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        user: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        type: { $ref: '#/components/schemas/RevisionType' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/FieldChange' }
    RevisionPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Revision' }
        page: { $ref: '#/components/schemas/PageMeta' }
