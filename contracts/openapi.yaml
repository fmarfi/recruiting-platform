openapi: 3.1.0
info:
  title: Recruiting Platform API
  version: 1.0.0
  summary: Phase 1 (Module A, CRM) REST contract plus users, roles, KVKK consent and audit.
  description: |
    Contract owned by the architect (Wave 0). Backends implement it, frontends build against the
    mock server generated from it, QA writes contract tests from it. Changes go through the architect.

    **Conventions (ADR 0006)**
    - Base path `/api/v1`, JSON only (`application/json`), except CSV templates, file upload and errors
      (`application/problem+json`).
    - IDs are UUIDs (v7, time-ordered) as strings (ADR 0004).
    - `date` is `YYYY-MM-DD`; `date-time` is RFC 3339 in UTC with `Z`, e.g. `2026-10-16T09:30:00Z`.
    - Enum values are the Java enum names in `contracts/enums/` (e.g. `PROPOSAL_SENT`). Labels, tones and
      allowed transitions come from `GET /reference-data`.
    - Lists that can grow are paged: `page` (0-based, default 0), `size` (default 20, max 100) and
      `sort=field,asc|desc` (repeatable). The response is `{ content: [...], page: { size, number,
      totalElements, totalPages } }` (Spring Data `PagedModel`). Small, bounded sub-lists (contacts of an
      account, candidates on a board, links of a person) are plain arrays.
    - Updates use `PATCH` with only the fields to change. Every mutable resource has a `version`; send it
      back to get optimistic locking (409 `VERSION_CONFLICT` on mismatch); omitting it skips the check.
    - Status changes are separate `PATCH .../status` (or `/stage`) calls with an optional `reason`. The
      reason is required for: account to ON_HOLD, to CLOSED, CLOSED to LEAD; proposal to REJECTED; job
      order to CANCELLED; stage to REJECTED; data-subject request to REJECTED (400 `REASON_REQUIRED`).
      Moves outside the transition table give 409 `ILLEGAL_TRANSITION`; data guards give 409
      `TRANSITION_GUARD_FAILED`; manager-only moves (account to CLOSED, CLOSED to LEAD, job order
      CANCELLED to OPEN) give 403 `FORBIDDEN` for consultants.
    - Errors are RFC 9457 problem details with a machine-readable `code` (see `ProblemDetail`).

    **Security (ADR 0007)**: session cookie after `POST /auth/login`. State-changing requests send the
    CSRF token from the `XSRF-TOKEN` cookie in the `X-XSRF-TOKEN` header. Every operation needs a logged-in
    user unless it has `security: []`. `x-roles` lists the roles allowed; `x-owner` names the module and
    agent that implement the endpoint.
  contact:
    name: architect agent
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Same origin as the web app
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: Login, logout, current user. Module `security` (security-privacy).
  - name: Users
    description: Users and roles (Settings screen). Module `security` (security-privacy).
  - name: Reference data
    description: Status lifecycles, vocabularies and sectors for badges and pickers. Module `accounts` (backend-accounts); lifecycles are read from `contracts/enums`.
  - name: Accounts
    description: Client accounts, account status, account connections (A-01, A-02, A-13). Module `accounts` (backend-accounts).
  - name: Contacts
    description: People linked to an account with their role (A-03). Module `accounts` (backend-accounts).
  - name: People
    description: The network of people (A-12). Module `accounts` (backend-accounts).
  - name: Network links
    description: Who knows whom, who introduced whom (A-13). Module `accounts` (backend-accounts).
  - name: Import
    description: One-off CSV/Excel migration (A-11). Module `accounts` (backend-accounts).
  - name: Search
    description: One search box across accounts, people and job orders (A-14). Module `accounts` (backend-accounts), job orders contributed by `pipeline`.
  - name: Job orders
    description: Job orders inside an account and their status (A-06). Module `pipeline` (backend-pipeline).
  - name: Pipeline
    description: Candidates per job order and their stage (A-07, UX-04). Module `pipeline` (backend-pipeline).
  - name: Proposals
    description: Commercial proposals and their status (A-05). Module `pipeline` (backend-pipeline).
  - name: Activities
    description: Calls, visits, meetings, e-mails, notes per account and person (A-04, UX-06). Module `pipeline` (backend-pipeline).
  - name: Next actions
    description: Follow-ups with owner and due date (A-10). Module `pipeline` (backend-pipeline).
  - name: Account overview
    description: Timeline and dashboard of an account (A-08, A-09). Module `pipeline` (backend-pipeline).
  - name: Home
    description: My day (UX-01). Module `pipeline` (backend-pipeline).
  - name: Consent
    description: KVKK information notice, consent requests and consent records per person (S-01, NFR-01, NFR-02). Module `privacy` (security-privacy).
  - name: Public consent
    description: Pages the person opens from the consent e-mail; no login (S-01). Module `privacy` (security-privacy).
  - name: Privacy notices
    description: Versioned KVKK information and consent texts (NFR-02). Module `privacy` (security-privacy).
  - name: Retention
    description: Retention settings, flagged people and retention runs (S-03, NFR-03). Module `privacy` (security-privacy).
  - name: Data-subject requests
    description: Access, correction and deletion requests and the person export (S-04, NFR-11). Module `privacy` (security-privacy).
  - name: Audit
    description: Access log and change history (NFR-05, A-02). Module `security` (security-privacy).
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with e-mail and password
      description: Starts a session (sets the session cookie and the `XSRF-TOKEN` cookie).
      security: []
      x-roles: [PUBLIC]
      x-owner: security / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out and end the session
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: security / security-privacy
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: The logged-in user
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: security / security-privacy
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      operationId: updateCurrentUser
      summary: Change own display name or language
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: security / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrentUserUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change own password
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: security / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users (owner pickers, Settings)
      description: All roles may read the list (needed for owner pickers); only admins see inactive users unless `active=true`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: security / security-privacy
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      x-roles: [ADMIN]
      x-owner: security / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: security / security-privacy
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change name, role, language or deactivate a user
      description: Users are never deleted (they are referenced as owners and in the audit trail); set `active=false`.
      x-roles: [ADMIN]
      x-owner: security / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}/password-reset:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Set a new initial password for a user
      x-roles: [ADMIN]
      x-owner: security / security-privacy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204': { description: Password reset; the user must change it at next login }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reference-data:
    get:
      tags: [Reference data]
      operationId: getReferenceData
      summary: Lifecycles, vocabularies and sectors
      description: |
        Everything the UI needs to draw badges, status menus and pickers: every lifecycle with labels,
        tone, allowed next statuses and which moves need a reason or a manager; the vocabularies; the
        sectors in use; the board column order; today's date on the server. Cacheable for the session.
        Status lists are closed sets in Phase 1 (ADR 0002), so the Settings screen shows them read-only.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Reference data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceData' }
              example:
                today: '2026-10-16'
                lifecycles:
                  account:
                    initial: LEAD
                    statuses:
                      - { value: LEAD, labelEn: "Lead", labelTr: "Aday müşteri", tone: NEUTRAL, terminal: false, next: [{ to: PROPOSAL_SENT, reasonRequired: false, managerOnly: false }, { to: CLOSED, reasonRequired: true, managerOnly: true }] }
                      - { value: PROPOSAL_SENT, labelEn: "Proposal sent", labelTr: "Teklif gönderildi", tone: INFO, terminal: false, next: [{ to: LEAD, reasonRequired: false, managerOnly: false }, { to: ACTIVE, reasonRequired: false, managerOnly: false }, { to: ON_HOLD, reasonRequired: true, managerOnly: false }, { to: CLOSED, reasonRequired: true, managerOnly: true }] }
                      - { value: ACTIVE, labelEn: "Active", labelTr: "Aktif", tone: GOOD, terminal: false, next: [{ to: ON_HOLD, reasonRequired: true, managerOnly: false }, { to: CLOSED, reasonRequired: true, managerOnly: true }] }
                      - { value: ON_HOLD, labelEn: "On hold", labelTr: "Beklemede", tone: WARN, terminal: false, next: [{ to: ACTIVE, reasonRequired: false, managerOnly: false }, { to: CLOSED, reasonRequired: true, managerOnly: true }] }
                      - { value: CLOSED, labelEn: "Closed", labelTr: "Kapalı", tone: MUTED, terminal: false, next: [{ to: LEAD, reasonRequired: true, managerOnly: true }] }
                  proposal:
                    initial: DRAFT
                    statuses:
                      - { value: DRAFT, labelEn: "Draft", labelTr: "Taslak", tone: NEUTRAL, terminal: false, next: [{ to: SENT, reasonRequired: false, managerOnly: false }] }
                      - { value: SENT, labelEn: "Sent", labelTr: "Gönderildi", tone: INFO, terminal: false, next: [{ to: DRAFT, reasonRequired: false, managerOnly: false }, { to: ACCEPTED, reasonRequired: false, managerOnly: false }, { to: REJECTED, reasonRequired: true, managerOnly: false }] }
                      - { value: ACCEPTED, labelEn: "Accepted", labelTr: "Kabul edildi", tone: GOOD, terminal: true, next: [] }
                      - { value: REJECTED, labelEn: "Rejected", labelTr: "Reddedildi", tone: BAD, terminal: false, next: [{ to: DRAFT, reasonRequired: false, managerOnly: false }] }
                  jobOrder:
                    initial: OPEN
                    statuses:
                      - { value: OPEN, labelEn: "Open", labelTr: "Açık", tone: NEUTRAL, terminal: false, next: [{ to: SOURCING, reasonRequired: false, managerOnly: false }, { to: CANCELLED, reasonRequired: true, managerOnly: false }] }
                      - { value: SOURCING, labelEn: "Sourcing", labelTr: "Aday arama", tone: INFO, terminal: false, next: [{ to: SHORTLIST_SENT, reasonRequired: false, managerOnly: false }, { to: CANCELLED, reasonRequired: true, managerOnly: false }] }
                      - { value: SHORTLIST_SENT, labelEn: "Shortlist sent", labelTr: "Kısa liste gönderildi", tone: PROGRESS, terminal: false, next: [{ to: SOURCING, reasonRequired: false, managerOnly: false }, { to: INTERVIEWING, reasonRequired: false, managerOnly: false }, { to: CANCELLED, reasonRequired: true, managerOnly: false }] }
                      - { value: INTERVIEWING, labelEn: "Interviewing", labelTr: "Mülakatlar", tone: PROGRESS, terminal: false, next: [{ to: SOURCING, reasonRequired: false, managerOnly: false }, { to: OFFER, reasonRequired: false, managerOnly: false }, { to: CANCELLED, reasonRequired: true, managerOnly: false }] }
                      - { value: OFFER, labelEn: "Offer", labelTr: "Teklif", tone: PROGRESS, terminal: false, next: [{ to: INTERVIEWING, reasonRequired: false, managerOnly: false }, { to: FILLED, reasonRequired: false, managerOnly: false }, { to: CANCELLED, reasonRequired: true, managerOnly: false }] }
                      - { value: FILLED, labelEn: "Filled", labelTr: "Kapatıldı", tone: GOOD, terminal: true, next: [] }
                      - { value: CANCELLED, labelEn: "Cancelled", labelTr: "İptal", tone: MUTED, terminal: false, next: [{ to: OPEN, reasonRequired: false, managerOnly: true }] }
                  pipelineStage:
                    initial: SOURCED
                    statuses:
                      - { value: SOURCED, labelEn: "Sourced", labelTr: "Bulundu", tone: NEUTRAL, terminal: false, next: [{ to: SCREENED, reasonRequired: false, managerOnly: false }, { to: PRESENTED, reasonRequired: false, managerOnly: false }, { to: CLIENT_INTERVIEW, reasonRequired: false, managerOnly: false }, { to: OFFER, reasonRequired: false, managerOnly: false }, { to: REJECTED, reasonRequired: true, managerOnly: false }] }
                      - { value: SCREENED, labelEn: "Screened", labelTr: "Ön görüşme", tone: INFO, terminal: false, next: [{ to: SOURCED, reasonRequired: false, managerOnly: false }, { to: PRESENTED, reasonRequired: false, managerOnly: false }, { to: CLIENT_INTERVIEW, reasonRequired: false, managerOnly: false }, { to: OFFER, reasonRequired: false, managerOnly: false }, { to: REJECTED, reasonRequired: true, managerOnly: false }] }
                      - { value: PRESENTED, labelEn: "Presented", labelTr: "Müşteriye sunuldu", tone: PROGRESS, terminal: false, next: [{ to: SCREENED, reasonRequired: false, managerOnly: false }, { to: CLIENT_INTERVIEW, reasonRequired: false, managerOnly: false }, { to: OFFER, reasonRequired: false, managerOnly: false }, { to: REJECTED, reasonRequired: true, managerOnly: false }] }
                      - { value: CLIENT_INTERVIEW, labelEn: "Client interview", labelTr: "Müşteri mülakatı", tone: PROGRESS, terminal: false, next: [{ to: PRESENTED, reasonRequired: false, managerOnly: false }, { to: OFFER, reasonRequired: false, managerOnly: false }, { to: REJECTED, reasonRequired: true, managerOnly: false }] }
                      - { value: OFFER, labelEn: "Offer", labelTr: "Teklif", tone: PROGRESS, terminal: false, next: [{ to: CLIENT_INTERVIEW, reasonRequired: false, managerOnly: false }, { to: PLACED, reasonRequired: false, managerOnly: false }, { to: REJECTED, reasonRequired: true, managerOnly: false }] }
                      - { value: PLACED, labelEn: "Placed", labelTr: "Yerleşti", tone: GOOD, terminal: true, next: [] }
                      - { value: REJECTED, labelEn: "Rejected", labelTr: "Elendi", tone: BAD, terminal: false, next: [{ to: SOURCED, reasonRequired: false, managerOnly: false }, { to: SCREENED, reasonRequired: false, managerOnly: false }] }
                  consent:
                    initial: NOT_SENT
                    statuses:
                      - { value: NOT_SENT, labelEn: "Not requested", labelTr: "İstenmedi", tone: NEUTRAL, terminal: false, next: [{ to: SENT, reasonRequired: false, managerOnly: false }, { to: GIVEN, reasonRequired: false, managerOnly: false }, { to: REFUSED, reasonRequired: false, managerOnly: false }] }
                      - { value: SENT, labelEn: "Requested", labelTr: "İstendi", tone: INFO, terminal: false, next: [{ to: SENT, reasonRequired: false, managerOnly: false }, { to: GIVEN, reasonRequired: false, managerOnly: false }, { to: REFUSED, reasonRequired: false, managerOnly: false }] }
                      - { value: GIVEN, labelEn: "Given", labelTr: "Onay verdi", tone: GOOD, terminal: false, next: [{ to: GIVEN, reasonRequired: false, managerOnly: false }, { to: WITHDRAWN, reasonRequired: false, managerOnly: false }] }
                      - { value: REFUSED, labelEn: "Refused", labelTr: "Reddetti", tone: BAD, terminal: false, next: [{ to: SENT, reasonRequired: false, managerOnly: false }, { to: GIVEN, reasonRequired: false, managerOnly: false }] }
                      - { value: WITHDRAWN, labelEn: "Withdrawn", labelTr: "Geri çekti", tone: WARN, terminal: false, next: [{ to: SENT, reasonRequired: false, managerOnly: false }, { to: GIVEN, reasonRequired: false, managerOnly: false }] }
                  dataSubjectRequest:
                    initial: RECEIVED
                    statuses:
                      - { value: RECEIVED, labelEn: "Received", labelTr: "Alındı", tone: NEUTRAL, terminal: false, next: [{ to: IN_PROGRESS, reasonRequired: false, managerOnly: false }, { to: REJECTED, reasonRequired: true, managerOnly: false }] }
                      - { value: IN_PROGRESS, labelEn: "In progress", labelTr: "İşlemde", tone: PROGRESS, terminal: false, next: [{ to: COMPLETED, reasonRequired: false, managerOnly: false }, { to: REJECTED, reasonRequired: true, managerOnly: false }] }
                      - { value: COMPLETED, labelEn: "Completed", labelTr: "Tamamlandı", tone: GOOD, terminal: true, next: [] }
                      - { value: REJECTED, labelEn: "Rejected", labelTr: "Reddedildi", tone: BAD, terminal: true, next: [] }
                stageOrder: [SOURCED, SCREENED, PRESENTED, CLIENT_INTERVIEW, OFFER, PLACED, REJECTED]
                vocabularies:
                  personType: [EXECUTIVE, CLIENT_CONTACT, REFERRER, CANDIDATE]
                  activityType: [CALL, VISIT, MEETING, EMAIL, NOTE]
                  linkType: [KNOWS, WORKED_WITH, INTRODUCED, REFERRED, REPORTS_TO]
                  role: [CONSULTANT, MANAGER, ADMIN]
                  consentChannel: [EMAIL_LINK, WEBSITE_FORM, IN_PERSON, PHONE, IMPORT]
                  dataSubjectRequestType: [ACCESS, CORRECTION, DELETION, OTHER]
                  language: [TR, EN]
                sectors: [Construction, Energy, Finance, FMCG, Retail, Technology]
        '401': { $ref: '#/components/responses/Unauthorized' }
  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Accounts overview, filterable by status, sector and owner (A-01)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: status
          in: query
          description: One or more statuses (repeat the parameter).
          schema:
            type: array
            items: { $ref: '#/components/schemas/AccountStatus' }
          style: form
          explode: true
        - name: sector
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: 'Sortable: `name`, `status`, `openedOn`, `lastActivityAt`, `openJobCount`. Default `name,asc`.'
          schema:
            type: array
            items: { type: string }
            examples: [['lastActivityAt,desc']]
      responses:
        '200':
          description: Page of accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Add a client account (status LEAD)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Account header (UX-05)
      description: Tabs load separately — contacts, job orders (`GET /job-orders?accountId=`), proposals (`GET /proposals?accountId=`), timeline, dashboard, next actions (`GET /next-actions?accountId=`).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Change account details (not the status)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounts/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Accounts]
      operationId: changeAccountStatus
      summary: Move the account to another status (A-02)
      description: |
        Reason required for ON_HOLD, CLOSED and CLOSED to LEAD (400 `REASON_REQUIRED`). CLOSED and
        CLOSED to LEAD are manager/admin only (403). Guard: an account with open job orders cannot be
        closed (409 `TRANSITION_GUARD_FAILED`). Logged with date and user (timeline, Envers).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountStatusChangeRequest' }
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounts/{id}/connections:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Accounts]
      operationId: listAccountConnections
      summary: People connected to the account's contacts (A-13 company view)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Connections, one per (contact, linked person)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountConnection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /accounts/{id}/contacts:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Contacts]
      operationId: listAccountContacts
      summary: Contacts of an account, primary first (A-03)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Contacts]
      operationId: addAccountContact
      summary: Link an existing person or create a new one as contact
      description: Give exactly one of `personId` and `person`. Setting `primary=true` clears the flag on the other contacts.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCreateRequest' }
      responses:
        '201':
          description: Contact added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounts/{id}/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: contactId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    patch:
      tags: [Contacts]
      operationId: updateAccountContact
      summary: Change a contact's role or primary flag
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Contacts]
      operationId: removeAccountContact
      summary: Remove the contact link (the person stays in the network)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /people:
    get:
      tags: [People]
      operationId: listPeople
      summary: Network list with filters (A-12, UX-06)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: type
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/PersonType' }
          style: form
          explode: true
        - $ref: '#/components/parameters/OwnerId'
        - name: consentStatus
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/ConsentStatus' }
          style: form
          explode: true
        - name: lastContactBefore
          in: query
          description: Last contact on or before this date (or never).
          schema: { type: string, format: date }
        - name: lastContactAfter
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: 'Sortable: `name`, `company`, `lastContactAt`, `createdAt`. Default `name,asc`.'
          schema:
            type: array
            items: { type: string }
      responses:
        '200':
          description: Page of people
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonSummaryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [People]
      operationId: createPerson
      summary: Add a person to the network
      description: Consent status starts at NOT_SENT. The privacy module may queue the KVKK notice e-mail (S-01) per retention settings. A second person with the same e-mail gives 409 `DUPLICATE` with `existingId`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonCreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /people/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [People]
      operationId: getPerson
      summary: Person page header and details
      description: Recorded in the access log (VIEW). Related lists load separately — contact roles, links, applications (`GET /people/{id}/applications`), activities (`GET /activities?personId=`), next actions, consent.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Person
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [People]
      operationId: updatePerson
      summary: Change person details
      description: '`employments`, when sent, replaces the whole company history. Anonymised people cannot be edited (409 `STATE_CONFLICT`).'
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /people/{id}/contact-roles:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Contacts]
      operationId: listPersonContactRoles
      summary: Accounts where the person is a contact, with role
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Contact roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /people/{id}/links:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Network links]
      operationId: listPersonLinks
      summary: A person's connections, both directions (A-13)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PersonConnection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /network-links:
    post:
      tags: [Network links]
      operationId: createNetworkLink
      summary: Record who knows or introduced whom
      description: '`fromPersonId` must differ from `toPersonId`. The same (from, to, type) twice gives 409 `DUPLICATE`; for symmetric types (KNOWS, WORKED_WITH) the reverse direction counts as the same link.'
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkLinkCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /network-links/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Network links]
      operationId: getNetworkLink
      summary: Get a link
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Network links]
      operationId: updateNetworkLink
      summary: Change a link's type or note
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkLinkUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Network links]
      operationId: deleteNetworkLink
      summary: Delete a link
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /imports:
    get:
      tags: [Import]
      operationId: listImports
      summary: Past and pending imports
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of import jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJobPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Import]
      operationId: uploadImport
      summary: Upload a CSV or XLSX file and validate it (dry run, A-11)
      description: |
        Nothing is written yet. The response lists row errors; commit with `POST /imports/{id}/commit`.
        Max 10 MB, max 10,000 rows. CSV is UTF-8 with a header row (see the template). Rows match
        existing records by e-mail (people) or exact name (accounts) and are skipped as duplicates.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { $ref: '#/components/schemas/ImportKind' }
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: .csv or .xlsx
            encoding:
              file:
                contentType: text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '201':
          description: Validated (status VALIDATED, or FAILED if unreadable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
  /import-templates/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ImportKind' }
    get:
      tags: [Import]
      operationId: getImportTemplate
      summary: Empty CSV template with the expected header row
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: CSV template
          content:
            text/csv:
              schema: { type: string }
              example: "name,sector,city,website,ownerEmail\n"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /imports/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Import]
      operationId: getImport
      summary: Import job with row errors
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Import job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Import]
      operationId: discardImport
      summary: Discard a validated import (status DISCARDED)
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '204': { description: Discarded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /imports/{id}/commit:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Import]
      operationId: commitImport
      summary: Write the valid rows of a validated import
      description: Rows with errors are skipped. Every imported person starts with consent NOT_SENT and enters the consent campaign (S-01).
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /search:
    get:
      tags: [Search]
      operationId: search
      summary: One search box across accounts, people and job orders (A-14)
      description: Accent- and case-insensitive (`ozturk` finds `Öztürk`). Returns up to `limit` hits per type plus total counts; use the list endpoints for the full result.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: types
          in: query
          description: Types to search; default all.
          schema:
            type: array
            items: { $ref: '#/components/schemas/SearchType' }
          style: form
          explode: true
        - name: sector
          in: query
          description: Accounts and job orders of accounts in this sector.
          schema: { type: string }
        - name: accountStatus
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - name: jobOrderStatus
          in: query
          schema: { $ref: '#/components/schemas/JobOrderStatus' }
        - $ref: '#/components/parameters/OwnerId'
        - name: lastContactBefore
          in: query
          description: People only.
          schema: { type: string, format: date }
        - name: lastContactAfter
          in: query
          description: People only.
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Grouped results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /job-orders:
    get:
      tags: [Job orders]
      operationId: listJobOrders
      summary: Job orders, e.g. of one account or my open jobs
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/AccountIdQuery'
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/JobOrderStatus' }
          style: form
          explode: true
        - name: open
          in: query
          description: '`true` = not FILLED or CANCELLED; `false` = FILLED or CANCELLED.'
          schema: { type: boolean }
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: 'Sortable: `title`, `status`, `openedOn`, `daysOpen`. Default `openedOn,desc`.'
          schema:
            type: array
            items: { type: string }
      responses:
        '200':
          description: Page of job orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrderPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Job orders]
      operationId: createJobOrder
      summary: Open a job order inside an account (status OPEN)
      description: A CLOSED account accepts no new job orders (409 `TRANSITION_GUARD_FAILED`).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobOrderCreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /job-orders/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Job orders]
      operationId: getJobOrder
      summary: Job order header with stage counts
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      responses:
        '200':
          description: Job order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Job orders]
      operationId: updateJobOrder
      summary: Change job order details (not the status)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobOrderUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /job-orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Job orders]
      operationId: changeJobOrderStatus
      summary: Move the job order to another status (A-06)
      description: |
        Reason required for CANCELLED. CANCELLED to OPEN is manager/admin only (403). Guard: OFFER to
        FILLED needs a PLACED application (409 `TRANSITION_GUARD_FAILED`).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobOrderStatusChangeRequest' }
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /job-orders/{id}/applications:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Pipeline]
      operationId: listJobOrderApplications
      summary: Candidates on the board of a job order (UX-04)
      description: All applications of the job order, including rejected ones; the board groups them by `stage` in the order of `ReferenceData.stageOrder`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      parameters:
        - name: stage
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/PipelineStage' }
          style: form
          explode: true
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Pipeline]
      operationId: addCandidateToJobOrder
