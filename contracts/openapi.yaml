        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /conflict-checks:
    get:
      tags: [Commercial]
      operationId: listConflictChecks
      summary: Recorded conflict checks, newest first
      description: |
        Sortable: `checkedAt` (default `checkedAt,desc`).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      parameters:
        - $ref: '#/components/parameters/AccountIdQuery'
        - $ref: '#/components/parameters/JobOrderIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
