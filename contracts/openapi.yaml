              schema: { $ref: '#/components/schemas/FeeScheduleItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /applications/{id}/placement:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Commercial]
      operationId: placeCandidate
      summary: Place the candidate — creates the placement and moves the application to PLACED (SX-020, CO-021)
      description: |
        One transaction: guard and move OFFER → PLACED exactly like `PATCH /applications/{id}/stage`
        (409 `ILLEGAL_TRANSITION` from another stage, sharing guard), then the placement row. An application
        has at most one placement (409 `DUPLICATE`). The agreement is the job order's engagement letter,
        else the account's SIGNED terms of business. `feeAmount` is computed (`feePercent` × the
        `feeBasis` components of `compensation`, clamped to `feeMinimum`/`feeCap`; or `flatFeeAmount`);
        sending `feeAmount` overrides it and is MANAGER/ADMIN only (403); with no agreement `feeAmount` is
        required (400). `guaranteeEndOn` = `startDate` + the agreement's `guaranteeMonths` (override
        allowed; since R67 the agreement's `guaranteeStartBasis` picks `startDate` or `offerAcceptedOn`). Makes OFFER_ACCEPTED items DUE, publishes `PlacementCreated` (accounts adds a
        GUARANTEE_PERIOD off-limits rule on the client until `guaranteeEndOn`), timeline PLACEMENT.
        Moving to PLACED through the stage endpoint still works (1.2 clients) but creates no placement.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacementCreateRequest' }
      responses:
        '201':
          description: Placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Placement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
