    post:
      tags: [Longlist and shortlist]
      operationId: recordClientFeedback
      summary: Record one round of client feedback (SX-019)
      description: |
        Only for applications on the SHORTLIST (409 `STATE_CONFLICT` otherwise). `round` defaults to the
        last round + 1. DECLINE needs `declineReason` (400 `REASON_REQUIRED`) and, in the same
        transaction, moves the application to REJECTED with reason `Client declined: <reason>` (the
