        content:
          type: array
          items: { $ref: '#/components/schemas/NextAction' }
        page: { $ref: '#/components/schemas/PageMeta' }
    NextActionCreateRequest:
      type: object
      required: [title, dueOn]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        dueOn: { type: string, format: date }
        ownerId: { $ref: '#/components/schemas/Id' }
        accountId: { $ref: '#/components/schemas/Id' }
        personId: { $ref: '#/components/schemas/Id' }
        jobOrderId: { $ref: '#/components/schemas/Id' }
    NextActionUpdateRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        dueOn: { type: string, format: date }
        ownerId: { $ref: '#/components/schemas/Id' }
        done: { type: boolean }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- timeline, dashboard, home ----------
    TimelineEntry:
      type: object
      required: [id, accountId, occurredAt, kind, entityType, entityId, summary]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        accountId: { $ref: '#/components/schemas/Id' }
        occurredAt: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/TimelineKind' }
        entityType: { $ref: '#/components/schemas/EntityType' }
        entityId: { $ref: '#/components/schemas/Id' }
        fromStatus: { type: [string, 'null'], examples: [ACTIVE] }
        toStatus: { type: [string, 'null'], examples: [ON_HOLD] }
        reason: { type: [string, 'null'], examples: [Client froze hiring until Q1] }
        summary: { type: string, description: 'Short English text for logs; the UI builds its own TR/EN text from kind, statuses and refs.', examples: [Account moved from Active to On hold] }
        person: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        jobOrder: { oneOf: [{ $ref: '#/components/schemas/JobOrderRef' }, { type: 'null' }] }
        actor: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: '`null` for system jobs.' }
    TimelineEntryPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/TimelineEntry' }
        page: { $ref: '#/components/schemas/PageMeta' }
    AccountDashboard:
      type: object
      required: [accountId, openJobOrders, candidatesPerStage, placedCount, openProposals]
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        openJobOrders: { type: integer, examples: [2] }
        candidatesPerStage: { $ref: '#/components/schemas/StageCounts' }
        avgDaysOpen: { type: [number, 'null'], description: Average days open of open job orders., examples: [18.5] }
        placedCount: { type: integer, examples: [4] }
        openProposals: { type: integer, description: DRAFT or SENT., examples: [1] }
        nextAction: { oneOf: [{ $ref: '#/components/schemas/NextAction' }, { type: 'null' }] }
    MyDay:
      type: object
