    # ---------- privacy ----------
    PrivacyNoticeRef:
      type: object
      required: [id, version, language]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        version: { type: string, examples: ['2026-10'] }
        language: { $ref: '#/components/schemas/Language' }
    PrivacyNotice:
      type: object
      required: [id, version, language, noticeText, consentText, effectiveFrom, current, createdAt, createdBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        version: { type: string, examples: ['2026-10'] }
        language: { $ref: '#/components/schemas/Language' }
        noticeText: { type: string, description: 'Information notice (aydınlatma metni), Markdown.' }
        consentText: { type: string, description: 'Explicit consent declaration (açık rıza beyanı), Markdown.' }
        effectiveFrom: { type: string, format: date }
        current: { type: boolean, description: In force for its language. }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
    PrivacyNoticeCreateRequest:
      type: object
      required: [version, language, noticeText, consentText, effectiveFrom]
      properties:
        version: { type: string, minLength: 1, maxLength: 40 }
        language: { $ref: '#/components/schemas/Language' }
        noticeText: { type: string, minLength: 1, maxLength: 50000 }
        consentText: { type: string, minLength: 1, maxLength: 10000 }
        effectiveFrom: { type: string, format: date }
    ConsentRecord:
      type: object
      required: [id, personId, decision, channel, notice, recordedAt]
