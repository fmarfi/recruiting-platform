    # ---------- saved views (1.1.0, ADR 0010) ----------
    ListEntity:
      type: string
      description: The grid a saved view or a bulk action belongs to (`contracts/enums/ListEntity.java`).
      enum: [PEOPLE, ACCOUNTS, JOB_ORDERS, PROPOSALS]
    ViewVisibility:
      type: string
      description: PRIVATE is seen only by its owner; SHARED by every user (`contracts/enums/ViewVisibility.java`).
      enum: [PRIVATE, SHARED]
    FilterValue:
      description: One filter value, or several (OR) as an array.
      oneOf:
        - { type: string, maxLength: 200 }
        - { type: number }
        - { type: boolean }
        - type: array
          maxItems: 50
          items:
            oneOf:
              - { type: string, maxLength: 200 }
              - { type: number }
              - { type: boolean }
        - { type: 'null' }
    ViewDefinition:
      type: object
      description: |
        What a grid shows. The client turns `filters` and `sort` into the query of the matching list
        endpoint (`GET /people`, `/accounts`, `/job-orders`, `/proposals`), so the allowed filter keys are
        that endpoint's query parameters except `page`, `size` and `sort`:
        - PEOPLE: `q`, `type`, `ownerId`, `consentStatus`, `lastContactBefore`, `lastContactAfter`, `city`,
          `company` (since 1.1.1), `tag`, `sourceChannel`, `cv`, `shareable` (since 1.2.0). A saved search
          is a PEOPLE view; a talent pool is a tag plus a SHARED view with `tag` (ADR 0011).
        - ACCOUNTS: `q`, `status`, `sector`, `ownerId`
        - JOB_ORDERS: `q`, `accountId`, `status`, `open`, `ownerId`
        - PROPOSALS: `accountId`, `status`, `ownerId`
        Values are validated like the query parameters (enum names, UUIDs, dates). `ownerId` may also be
        `"me"`, which the client replaces with the current user's id when it runs the view (so one shared
        "My accounts" view works for everybody). The server rejects unknown keys and bad values with 400
        `VALIDATION_FAILED` (`field = definition.filters.<key>`). `columns`, `sort` and `groupBy` use the
        property names of the list item schema; unknown names give 400 as well.
      required: [filters, columns, sort]
      properties:
        filters:
          type: object
          maxProperties: 20
          propertyNames: { pattern: '^[A-Za-z][A-Za-z0-9]{0,49}$' }
          additionalProperties: { $ref: '#/components/schemas/FilterValue' }
          examples: [{ status: [ACTIVE, ON_HOLD], ownerId: me }]
        columns:
          type: array
          description: Visible columns in display order.
          maxItems: 50
          items: { type: string, pattern: '^[A-Za-z][A-Za-z0-9.]{0,99}$' }
          examples: [[name, status, sector, owner, lastActivityAt]]
        sort:
          type: array
          description: '`property,asc|desc`, like the `sort` query parameter; first key wins.'
          maxItems: 5
          items: { type: string, pattern: '^[A-Za-z]+(,(asc|desc))?$' }
          examples: [['lastActivityAt,desc']]
        groupBy:
          type: [string, 'null']
          pattern: '^[A-Za-z][A-Za-z0-9.]{0,99}$'
          description: Property to group rows by, or null.
          examples: [sector]
    SavedView:
      type: object
      required: [id, entity, name, visibility, owner, definition, editable, createdAt, updatedAt, version]
      examples:
        - id: 0192a5b8-0000-7000-8000-00000000c001
          entity: ACCOUNTS
          name: My active accounts by sector
          visibility: SHARED
          owner: { id: 0192a5b8-6f1e-7c3a-9b2d-3f4e5a6b7c8d, name: Deniz Aksoy }
          definition:
            filters: { status: [ACTIVE, ON_HOLD], ownerId: me }
            columns: [name, status, sector, owner, lastActivityAt]
            sort: ['lastActivityAt,desc']
            groupBy: sector
          editable: true
          createdAt: '2026-10-20T09:30:00Z'
          updatedAt: '2026-10-21T14:05:00Z'
          version: 2
      properties:
        id: { $ref: '#/components/schemas/Id' }
        entity: { $ref: '#/components/schemas/ListEntity' }
        name: { type: string, examples: [Active accounts in Izmir] }
        visibility: { $ref: '#/components/schemas/ViewVisibility' }
        owner: { $ref: '#/components/schemas/UserRef' }
        definition: { $ref: '#/components/schemas/ViewDefinition' }
        editable: { type: boolean, description: Whether the current user may change or delete this view. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/Version' }
    SavedViewCreateRequest:
      type: object
      required: [entity, name, definition]
      properties:
        entity: { $ref: '#/components/schemas/ListEntity' }
        name: { type: string, minLength: 1, maxLength: 120 }
        visibility:
          $ref: '#/components/schemas/ViewVisibility'
          description: Defaults to PRIVATE. SHARED is MANAGER/ADMIN only (ASSUMPTION).
        definition: { $ref: '#/components/schemas/ViewDefinition' }
    SavedViewUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        visibility: { $ref: '#/components/schemas/ViewVisibility' }
        definition: { $ref: '#/components/schemas/ViewDefinition' }
        version: { $ref: '#/components/schemas/Version' }
    # ---------- bulk actions (1.1.0, ADR 0010) ----------
    BulkActionType:
      type: string
      description: '`contracts/enums/BulkActionType.java`'
      enum: [REASSIGN_OWNER, CHANGE_STATUS, ADD_TAG, REMOVE_TAG, SET_NEXT_ACTION, REQUEST_CONSENT]
    BulkOutcome:
      type: string
      description: OK = done; SKIPPED = nothing done on purpose (no change needed, consent gate); FAILED = could not be done (`contracts/enums/BulkOutcome.java`).
      enum: [OK, SKIPPED, FAILED]
    BulkResultCode:
      type: string
      description: Why a record was SKIPPED or FAILED (`contracts/enums/BulkResultCode.java`).
      enum: [NO_CHANGE, NOT_FOUND, FORBIDDEN, ILLEGAL_TRANSITION, TRANSITION_GUARD_FAILED, REASON_REQUIRED, STATE_CONFLICT, VERSION_CONFLICT, NO_EMAIL, CONSENT_GIVEN, CONSENT_REFUSED, CONSENT_WITHDRAWN, REQUEST_PENDING, ANONYMISED, NO_CONSENT_BASIS, TOO_MANY_TAGS, INTERNAL_ERROR]
    Tag:
      type: string
      description: Trimmed, stored lower-case, 1 to 50 characters; at most 20 tags per record. No personal data in tags.
      minLength: 1
      maxLength: 50
      pattern: '^\S(.*\S)?$'
      examples: [cfo-network]
    ReassignOwnerParams:
      type: object
      additionalProperties: false
      required: [ownerId]
      properties:
        ownerId: { $ref: '#/components/schemas/Id' }
    ChangeStatusParams:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          description: Target status from the entity's lifecycle (`AccountStatus`, `JobOrderStatus` or `ProposalStatus`); another value gives 400.
          examples: [ON_HOLD]
        reason:
          $ref: '#/components/schemas/Reason'
          description: Stored on each record's status change (timeline, Envers) like a single move; never stored in the bulk audit row (1.1.1).
    TagParams:
      type: object
      additionalProperties: false
      required: [tag]
      properties:
        tag: { $ref: '#/components/schemas/Tag' }
    SetNextActionParams:
      type: object
      additionalProperties: false
      required: [title, dueOn]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Written to each created next action (scrubbed there on anonymisation); never stored in the bulk audit row (1.1.1).
        dueOn: { type: string, format: date }
        ownerId:
          $ref: '#/components/schemas/Id'
          description: Defaults to the current user.
    RequestConsentParams:
      type: object
      additionalProperties: false
      properties:
        language:
          $ref: '#/components/schemas/Language'
          description: Defaults to TR.
    BulkActionTarget:
      type: object
      required: [entity, ids]
      properties:
        entity: { $ref: '#/components/schemas/ListEntity' }
        ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
    BulkActionRequest:
      description: One action with its typed `params`, chosen by `action`.
      oneOf:
        - $ref: '#/components/schemas/ReassignOwnerBulkRequest'
        - $ref: '#/components/schemas/ChangeStatusBulkRequest'
        - $ref: '#/components/schemas/AddTagBulkRequest'
        - $ref: '#/components/schemas/RemoveTagBulkRequest'
        - $ref: '#/components/schemas/SetNextActionBulkRequest'
        - $ref: '#/components/schemas/RequestConsentBulkRequest'
      discriminator:
        propertyName: action
        mapping:
          REASSIGN_OWNER: '#/components/schemas/ReassignOwnerBulkRequest'
          CHANGE_STATUS: '#/components/schemas/ChangeStatusBulkRequest'
          ADD_TAG: '#/components/schemas/AddTagBulkRequest'
          REMOVE_TAG: '#/components/schemas/RemoveTagBulkRequest'
          SET_NEXT_ACTION: '#/components/schemas/SetNextActionBulkRequest'
          REQUEST_CONSENT: '#/components/schemas/RequestConsentBulkRequest'
    ReassignOwnerBulkRequest:
      allOf:
        - $ref: '#/components/schemas/BulkActionTarget'
        - type: object
          required: [action, params]
          properties:
            action: { type: string, const: REASSIGN_OWNER }
            params: { $ref: '#/components/schemas/ReassignOwnerParams' }
    ChangeStatusBulkRequest:
      allOf:
        - $ref: '#/components/schemas/BulkActionTarget'
        - type: object
          required: [action, params]
          properties:
            action: { type: string, const: CHANGE_STATUS }
            params: { $ref: '#/components/schemas/ChangeStatusParams' }
    AddTagBulkRequest:
      allOf:
        - $ref: '#/components/schemas/BulkActionTarget'
        - type: object
          required: [action, params]
          properties:
            action: { type: string, const: ADD_TAG }
            params: { $ref: '#/components/schemas/TagParams' }
    RemoveTagBulkRequest:
      allOf:
        - $ref: '#/components/schemas/BulkActionTarget'
        - type: object
          required: [action, params]
          properties:
            action: { type: string, const: REMOVE_TAG }
            params: { $ref: '#/components/schemas/TagParams' }
    SetNextActionBulkRequest:
      allOf:
        - $ref: '#/components/schemas/BulkActionTarget'
        - type: object
          required: [action, params]
          properties:
            action: { type: string, const: SET_NEXT_ACTION }
            params: { $ref: '#/components/schemas/SetNextActionParams' }
    RequestConsentBulkRequest:
      allOf:
        - $ref: '#/components/schemas/BulkActionTarget'
        - type: object
          required: [action, params]
          properties:
            action: { type: string, const: REQUEST_CONSENT }
            params: { $ref: '#/components/schemas/RequestConsentParams' }
    BulkRecordResult:
      type: object
      required: [id, outcome, code, message]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        outcome: { $ref: '#/components/schemas/BulkOutcome' }
        code:
          oneOf: [{ $ref: '#/components/schemas/BulkResultCode' }, { type: 'null' }]
          description: Null when OK; always set when SKIPPED or FAILED.
        message:
          type: [string, 'null']
          description: |
            Null when OK; otherwise exactly `BulkResultCode.message()`, the one fixed English text of the
            code (the UI translates `code`). Never a name, e-mail, record value or exception message, and
            not stored: the audit row keeps the code only (since 1.1.1, ADR 0010).
    BulkActionResult:
      type: object
      required: [id, entity, action, requested, ok, skipped, failed, results]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: The `bulk_action` audit row.
        entity: { $ref: '#/components/schemas/ListEntity' }
        action: { $ref: '#/components/schemas/BulkActionType' }
        requested: { type: integer, examples: [3] }
        ok: { type: integer, examples: [1] }
        skipped: { type: integer, examples: [2] }
        failed: { type: integer, examples: [0] }
        results:
          type: array
          description: One entry per requested id, in request order.
          items: { $ref: '#/components/schemas/BulkRecordResult' }
    # ---------- candidate pool and consent engine (1.2.0, ADR 0011) ----------
    SourceChannel:
      type: string
      description: How the candidate reached the firm (B-03, `contracts/enums/SourceChannel.java`).
      enum: [LINKEDIN_AD, LINKEDIN_DIRECT, WEBSITE, REFERRAL, EXISTING_POOL, EMAIL, CV_UPLOAD]
    Mobility:
      type: string
      enum: [NONE, WITHIN_COUNTRY, INTERNATIONAL]
    CompensationPeriod:
      type: string
      enum: [MONTHLY, ANNUAL]
    SalaryBasis:
      type: string
      enum: [GROSS, NET]
    LanguageLevel:
      type: string
      enum: [BASIC, INTERMEDIATE, FLUENT, NATIVE]
    PersonFileKind:
      type: string
      enum: [CV, DOCUMENT]
    TextExtractionStatus:
      type: string
      description: Tika text extraction (no AI, no OCR), `contracts/enums/TextExtractionStatus.java`.
      enum: [PENDING, DONE, NO_TEXT, FAILED]
    CvIntakeStatus:
      type: string
      enum: [PENDING, ATTACHED, DISCARDED]
    DuplicateMatchReason:
      type: string
      enum: [EMAIL, PHONE, LINKEDIN_URL, NAME_COMPANY]
    DuplicateStatus:
      type: string
      enum: [OPEN, MERGED, DISMISSED]
    ConsentRequestPurpose:
      type: string
      enum: [INITIAL, RENEWAL]
    ShareBlockReason:
      type: string
      description: Why a person may not be shared with a client (`contracts/enums/ShareBlockReason.java`).
      enum: [CONSENT_NOT_REQUESTED, CONSENT_PENDING, CONSENT_REFUSED, CONSENT_WITHDRAWN, ANONYMISED]
    ExposureChannel:
      type: string
      description: PIPELINE now; REPORT and SHARE_LINK are reserved for Wave 2d.
      enum: [PIPELINE, REPORT, SHARE_LINK]
    OffLimitsReason:
      type: string
      enum: [CLIENT_AGREEMENT, GUARANTEE_PERIOD, CLIENT_REQUEST, OTHER]
    PipelineWarningCode:
      type: string
      enum: [PREVIOUSLY_PRESENTED_TO_ACCOUNT, ACTIVE_IN_OTHER_PROCESS]
    Compensation:
      type: object
      description: |
        Stored encrypted as one value (field-level encryption, AES-256-GCM, key outside the database;
        ADR 0011), so it cannot be filtered or sorted. Amounts are in `currency` per `period`.
        **Who may read it:** only MANAGER/ADMIN and the person's relationship owner. For other users
        `GET /people/{id}` returns `compensation: null` and `compensationRestricted: true`, and they
        cannot write it (403 if sent). It is never in lists, search, exports to clients or events. Every
        read goes with the VIEW access-log entry of `GET /people/{id}`; the DSR export includes it.
      required: [currency, period, basis]
      properties:
        currentBase: { type: [number, 'null'], minimum: 0, examples: [250000] }
        currentVariable: { type: [number, 'null'], minimum: 0, description: Bonus and other variable pay per period. }
        expected: { type: [number, 'null'], minimum: 0, examples: [300000] }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: ISO 4217, examples: [TRY] }
        period: { $ref: '#/components/schemas/CompensationPeriod' }
        basis: { $ref: '#/components/schemas/SalaryBasis' }
        benefits: { type: [string, 'null'], maxLength: 500, examples: ['Car, private health insurance'] }
        updatedOn: { type: [string, 'null'], format: date, description: When the candidate gave these figures. }
    LanguageSkill:
      type: object
      required: [language, level]
      properties:
        language: { type: string, pattern: '^[a-z]{2}$', description: ISO 639-1 code, examples: [en] }
        level: { $ref: '#/components/schemas/LanguageLevel' }
    Education:
      type: object
      required: [school]
      properties:
        school: { type: string, minLength: 1, maxLength: 200, examples: [Boğaziçi Üniversitesi] }
        degree: { type: [string, 'null'], maxLength: 100, examples: [MBA] }
        field: { type: [string, 'null'], maxLength: 200, examples: [Finance] }
        startYear: { type: [integer, 'null'], minimum: 1940, maximum: 2100 }
        endYear: { type: [integer, 'null'], minimum: 1940, maximum: 2100, description: '`null` = ongoing' }
    CandidateProfileFields:
      type: object
      description: Candidate profile fields on the person (1.2.0). All optional; any person type may have them.
      properties:
        sourceChannel: { oneOf: [{ $ref: '#/components/schemas/SourceChannel' }, { type: 'null' }] }
        noticePeriodDays: { type: [integer, 'null'], minimum: 0, maximum: 365, examples: [60] }
        mobility: { oneOf: [{ $ref: '#/components/schemas/Mobility' }, { type: 'null' }] }
        compensation: { oneOf: [{ $ref: '#/components/schemas/Compensation' }, { type: 'null' }] }
        languages:
          type: array
          maxItems: 20
          description: Replaces the whole list when sent.
          items: { $ref: '#/components/schemas/LanguageSkill' }
        educations:
          type: array
          maxItems: 20
          description: Most recent first; replaces the whole list when sent (like `employments`).
          items: { $ref: '#/components/schemas/Education' }
    PersonFile:
      type: object
      required: [id, personId, kind, version, current, fileName, contentType, sizeBytes, textStatus, uploadedAt, uploadedBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        personId: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/PersonFileKind' }
        version: { type: integer, minimum: 1, description: CV version per person; 1 for documents. }
        current: { type: boolean, description: The current CV (newest CV version); false for older CVs and for documents. }
        fileName: { type: string, examples: [cv-2026.pdf] }
        contentType: { type: string, description: Detected by Tika from the bytes., examples: [application/pdf] }
        sizeBytes: { type: integer, format: int64 }
        textStatus: { $ref: '#/components/schemas/TextExtractionStatus' }
        uploadedAt: { type: string, format: date-time }
        uploadedBy: { $ref: '#/components/schemas/UserRef' }
    DetectedContacts:
      type: object
      description: Found in the extracted text with plain patterns (no AI). Suggestions only.
      required: [emails, phones, linkedinUrls]
      properties:
        emails: { type: array, maxItems: 5, items: { type: string } }
        phones: { type: array, maxItems: 5, items: { type: string } }
        linkedinUrls: { type: array, maxItems: 5, items: { type: string } }
    CvIntakeItem:
      type: object
      required: [id, batchId, status, textStatus, detected, duplicates, uploadedAt, uploadedBy, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        batchId: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/CvIntakeStatus' }
        fileName: { type: [string, 'null'], description: Null once ATTACHED or DISCARDED (minimised). }
        contentType: { type: [string, 'null'] }
        sizeBytes: { type: [integer, 'null'], format: int64 }
        textStatus: { $ref: '#/components/schemas/TextExtractionStatus' }
        detected: { $ref: '#/components/schemas/DetectedContacts' }
        duplicates:
          type: array
          description: Duplicate check on the detected values (empty until the text is extracted).
          items: { $ref: '#/components/schemas/DuplicateMatch' }
        sourceChannel: { oneOf: [{ $ref: '#/components/schemas/SourceChannel' }, { type: 'null' }] }
        uploadedAt: { type: string, format: date-time }
        uploadedBy: { $ref: '#/components/schemas/UserRef' }
        expiresAt: { type: string, format: date-time, description: uploadedAt + 14 days; a PENDING item is deleted then. }
        attachedPerson: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
    CvIntakeItemPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/CvIntakeItem' }
        page: { $ref: '#/components/schemas/PageMeta' }
    CvIntakeBatch:
      type: object
      required: [batchId, items, rejected]
      properties:
        batchId: { $ref: '#/components/schemas/Id' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CvIntakeItem' }
        rejected:
          type: array
          description: Files not accepted, with the reason.
          items:
            type: object
            required: [fileName, code]
            properties:
              fileName: { type: string }
              code:
                type: string
                enum: [PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE]
    CvIntakeAttachRequest:
      description: Attach to an existing person, or create a new one.
      oneOf:
        - type: object
          additionalProperties: false
          required: [personId]
          properties:
            personId: { $ref: '#/components/schemas/Id' }
        - type: object
          additionalProperties: false
          required: [person]
          properties:
            person: { $ref: '#/components/schemas/PersonCreateRequest' }
    CvIntakeAttachResult:
      type: object
      required: [person, file]
      properties:
        person: { $ref: '#/components/schemas/Person' }
        file: { $ref: '#/components/schemas/PersonFile' }
    DuplicateCheckRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: [string, 'null'], maxLength: 200 }
        company: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 50 }
        linkedinUrl: { type: [string, 'null'], maxLength: 300 }
        excludePersonId:
          $ref: '#/components/schemas/Id'
          description: Leave this person out (when editing an existing person).
    DuplicateMatch:
      type: object
      required: [person, reasons]
      properties:
        person: { $ref: '#/components/schemas/PersonSummary' }
        reasons:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DuplicateMatchReason' }
    DuplicateCandidate:
      type: object
      required: [id, personA, personB, reasons, status, detectedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        personA: { $ref: '#/components/schemas/PersonSummary' }
        personB: { $ref: '#/components/schemas/PersonSummary' }
        reasons:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DuplicateMatchReason' }
        status: { $ref: '#/components/schemas/DuplicateStatus' }
        detectedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
    DuplicateCandidatePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/DuplicateCandidate' }
        page: { $ref: '#/components/schemas/PageMeta' }
    PersonMergeRequest:
      type: object
      required: [mergedPersonId, version]
      properties:
        mergedPersonId:
          $ref: '#/components/schemas/Id'
          description: The person that is merged into the survivor and then deleted.
        takeFromMerged:
          type: array
          uniqueItems: true
          description: Fields whose value comes from the merged person even when the survivor has one.
          items:
            type: string
            enum: [name, type, title, company, email, phone, city, linkedinUrl, howWeKnow, notes, ownerId, sourceChannel, noticePeriodDays, mobility, compensation]
        version:
          $ref: '#/components/schemas/Version'
          description: Survivor's version (optimistic lock, required because a merge cannot be undone).
    ExposureEntry:
      type: object
      required: [id, account, jobOrder, applicationId, channel, presentedAt, presentedBy, stage]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { $ref: '#/components/schemas/AccountRef' }
        jobOrder: { $ref: '#/components/schemas/JobOrderRef' }
        applicationId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        channel: { $ref: '#/components/schemas/ExposureChannel' }
        presentedAt: { type: string, format: date-time }
        presentedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        stage:
          oneOf: [{ $ref: '#/components/schemas/PipelineStage' }, { type: 'null' }]
          description: Current stage of the application (the outcome so far); null if it was removed.
    OtherProcessRef:
      type: object
      required: [applicationId, jobOrder, account, stage]
      properties:
        applicationId: { $ref: '#/components/schemas/Id' }
        jobOrder: { $ref: '#/components/schemas/JobOrderRef' }
        account: { $ref: '#/components/schemas/AccountRef' }
        stage: { $ref: '#/components/schemas/PipelineStage' }
    PipelineWarning:
      type: object
      description: Non-blocking hint shown with the result of adding or presenting a person.
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/PipelineWarningCode' }
        message: { type: string, description: Fixed English text per code; the UI translates `code`., examples: ['Already presented to this account for another job order.'] }
        exposures:
          type: array
          description: PREVIOUSLY_PRESENTED_TO_ACCOUNT — the earlier presentations to this account.
          items: { $ref: '#/components/schemas/ExposureEntry' }
        otherProcesses:
          type: array
          description: ACTIVE_IN_OTHER_PROCESS — the other open applications.
          items: { $ref: '#/components/schemas/OtherProcessRef' }
    OffLimitsRule:
      type: object
      required: [id, account, companyName, reason, startsOn, endsOn, active, createdAt, createdBy, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        account: { oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }] }
        companyName: { type: [string, 'null'], description: Set when the company is not an account., examples: [Anadolu Lojistik] }
        reason: { $ref: '#/components/schemas/OffLimitsReason' }
        note: { type: [string, 'null'], description: No personal data., examples: [Retained search agreement until end of 2027] }
        startsOn: { type: string, format: date }
        endsOn: { type: [string, 'null'], format: date, description: Last day in force; null = open-ended. }
        active: { type: boolean, description: In force today. }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        version: { $ref: '#/components/schemas/Version' }
    OffLimitsRulePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/OffLimitsRule' }
        page: { $ref: '#/components/schemas/PageMeta' }
    OffLimitsRuleCreateRequest:
      type: object
      required: [reason]
      description: Exactly one of `accountId` and `companyName` (else 400).
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        companyName: { type: string, minLength: 1, maxLength: 200 }
        reason: { $ref: '#/components/schemas/OffLimitsReason' }
        note: { type: [string, 'null'], maxLength: 500 }
        startsOn: { type: string, format: date, description: Defaults to today. }
        endsOn: { type: [string, 'null'], format: date, description: Not before `startsOn`. }
    OffLimitsRuleUpdateRequest:
      type: object
      minProperties: 1
      properties:
        reason: { $ref: '#/components/schemas/OffLimitsReason' }
        note: { type: [string, 'null'], maxLength: 500 }
        startsOn: { type: string, format: date }
        endsOn: { type: [string, 'null'], format: date }
        version: { $ref: '#/components/schemas/Version' }
    ShareCheckRequest:
      type: object
      required: [personIds]
      properties:
        personIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
    ShareCheckResult:
      type: object
      required: [personId, shareable, reason]
      properties:
        personId: { $ref: '#/components/schemas/Id' }
        shareable: { type: boolean }
        reason:
          oneOf: [{ $ref: '#/components/schemas/ShareBlockReason' }, { type: 'null' }]
          description: Null when shareable.
    # ---------- 1.3.0: archive and merge (ADR 0013) ----------
    ArchiveReason:
      type: string
      description: '`contracts/enums/ArchiveReason.java`. MERGED and IMPORT_ROLLBACK are set by the server only.'
      enum: [DUPLICATE, CREATED_BY_MISTAKE, NO_LONGER_RELEVANT, MERGED, IMPORT_ROLLBACK, OTHER]
    ArchiveInfo:
      type: object
      required: [archivedAt, archivedBy, reason]
      properties:
        archivedAt: { type: string, format: date-time }
        archivedBy: { $ref: '#/components/schemas/UserRef' }
        reason: { $ref: '#/components/schemas/ArchiveReason' }
        note: { type: [string, 'null'], maxLength: 500 }
        mergedInto:
          oneOf: [{ $ref: '#/components/schemas/AccountRef' }, { type: 'null' }]
          description: Accounts only; set when `reason` is MERGED.
    ArchiveRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/ArchiveReason'
          description: MERGED and IMPORT_ROLLBACK give 400 `VALIDATION_FAILED`.
        note: { type: [string, 'null'], maxLength: 500, description: Required when `reason` is OTHER (400). }
        version: { $ref: '#/components/schemas/Version' }
    RestoreRequest:
      type: object
      properties:
        version: { $ref: '#/components/schemas/Version' }
    AccountMergeRequest:
      type: object
      required: [mergedId, version]
      properties:
        mergedId:
          $ref: '#/components/schemas/Id'
          description: The account to merge into the path account.
        takeFromMerged:
          type: array
          description: Survivor fields to overwrite with the merged account's value (others are kept; empty ones are filled).
          uniqueItems: true
          items:
            type: string
            enum: [sector, city, website, notes, ownerId, legalName, taxId, taxOffice, mersisNo, billingAddress, billingEmails, parentAccountId, employeeBand]
        version:
          $ref: '#/components/schemas/Version'
          description: The survivor's version (required, 409 on mismatch).
    AccountMergeResult:
      type: object
      required: [survivor, mergedId, moved]
      properties:
        survivor: { $ref: '#/components/schemas/Account' }
        mergedId: { $ref: '#/components/schemas/Id' }
        moved:
          type: object
          description: Moved row counts per kind, e.g. contacts, jobOrders, proposals, activities, nextActions, offLimitsRules, agreements, placements.
          additionalProperties: { type: integer, minimum: 0 }
          examples: [{ contacts: 3, jobOrders: 2, activities: 14 }]
    # ---------- 1.3.0: account profile ----------
    ConfidentialityLevel:
      type: string
      description: '`contracts/enums/ConfidentialityLevel.java`; default NORMAL. RESTRICTED = named team; CONFIDENTIAL = hidden from non-team users (rule in a later contract, ADR 0013).'
      enum: [NORMAL, RESTRICTED, CONFIDENTIAL]
    EInvoiceStatus:
      type: string
      description: '`contracts/enums/EInvoiceStatus.java`; default UNKNOWN.'
      enum: [UNKNOWN, E_FATURA, E_ARSIV]
    EmployeeBand:
      type: string
      enum: [B1_50, B51_250, B251_1000, B1001_5000, B5000_PLUS]
    # ---------- 1.3.0: candidate search ----------
    JobFunction:
      type: string
      description: '`contracts/enums/JobFunction.java`.'
      enum: [GENERAL_MANAGEMENT, FINANCE, HR, SALES, MARKETING, OPERATIONS, SUPPLY_CHAIN, PROCUREMENT, ENGINEERING, IT, RND, LEGAL, OTHER]
    Seniority:
      type: string
      description: '`contracts/enums/Seniority.java`, highest first.'
      enum: [BOARD, C_LEVEL, VP_DIRECTOR, HEAD, MANAGER, SPECIALIST]
    # ---------- 1.3.0: tags ----------
    TagColour:
      type: string
      description: '`contracts/enums/TagColour.java`; the frontend maps each to a design token.'
      enum: [GREY, BLUE, GREEN, AMBER, RED, PURPLE, TEAL]
    TagChangeKind:
      type: string
      enum: [RENAMED, MERGED, DELETED]
    TagSummary:
      type: object
      required: [name, colour, talentPool, defined, counts, total]
      properties:
        name: { $ref: '#/components/schemas/Tag' }
        colour: { $ref: '#/components/schemas/TagColour' }
        description: { type: [string, 'null'] }
        talentPool: { type: boolean, description: A talent pool is a tag with this flag; open it with `GET /people?tag=<name>`. }
        defined: { type: boolean, description: A `tag_definition` row exists. }
        counts:
          type: object
          description: Records carrying the tag per entity (all four keys always present).
          required: [PEOPLE, ACCOUNTS, JOB_ORDERS, PROPOSALS]
          properties:
            PEOPLE: { type: integer, minimum: 0 }
            ACCOUNTS: { type: integer, minimum: 0 }
            JOB_ORDERS: { type: integer, minimum: 0 }
            PROPOSALS: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    TagSummaryPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/TagSummary' }
        page: { $ref: '#/components/schemas/PageMeta' }
    TagDefinitionRequest:
      type: object
      properties:
        colour: { $ref: '#/components/schemas/TagColour' }
        description: { type: [string, 'null'], maxLength: 200 }
        talentPool: { type: boolean }
    TagRenameRequest:
      type: object
      required: [newName]
      properties:
        newName: { $ref: '#/components/schemas/Tag' }
    TagMergeRequest:
      type: object
      required: [into]
      properties:
        into: { $ref: '#/components/schemas/Tag' }
    TagChangeResult:
      type: object
      required: [change, tag, updated]
      properties:
        change: { $ref: '#/components/schemas/TagChangeKind' }
        tag: { $ref: '#/components/schemas/Tag' }
        newTag:
          oneOf: [{ $ref: '#/components/schemas/Tag' }, { type: 'null' }]
          description: RENAMED and MERGED.
        updated:
          type: object
          description: Records rewritten synchronously (PEOPLE, ACCOUNTS, views); JOB_ORDERS and PROPOSALS follow through `TagChanged` within seconds.
          additionalProperties: { type: integer, minimum: 0 }
