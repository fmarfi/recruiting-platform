      operationId: mergeTag
      summary: Merge this tag into another one on every record
      description: Replaces the path tag by `into` (no duplicates in an array; the count never grows, so the 20-tag limit holds), deletes the path tag's definition (the target keeps its own), rewrites saved views, publishes `TagChanged(MERGED)`. `into` equal to the path tag → 400.
