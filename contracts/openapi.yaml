        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Commercial]
      operationId: recordConflictCheck
      summary: Run the check again and record it with a decision (append-only log)
      description: |
        The server recomputes the hits (never trusts the client). CLEAR is allowed only without hits (409
        `STATE_CONFLICT`); PROCEED with hits is an override: MANAGER/ADMIN only (403) with
        `overrideReason` (400 `REASON_REQUIRED`), shown on the record (PB-019); BLOCKED needs no reason.
