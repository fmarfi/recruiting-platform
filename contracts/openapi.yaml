      tags: [Consent]
      operationId: checkShareable
      summary: Which of these people may be shared with a client (sharing guard)
      description: |
        A person is shareable only with consent GIVEN and not anonymised (ADR 0011). The UI calls this
        before presenting people or (Wave 2d) adding them to a report or share link; the server enforces
        the same rule with 409 `CONSENT_REQUIRED`. Unknown ids are left out of the result.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: privacy / security-privacy
