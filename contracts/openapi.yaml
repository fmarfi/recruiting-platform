      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Network links]
      operationId: deleteNetworkLink
      summary: Delete a link
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /imports:
    get:
      tags: [Import]
      operationId: listImports
      summary: Past and pending imports
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of import jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJobPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Import]
      operationId: uploadImport
      summary: Upload a CSV or XLSX file and validate it (dry run, A-11)
      description: |
        Nothing is written yet. The response lists row errors; commit with `POST /imports/{id}/commit`.
        Max 10 MB, max 10,000 rows. CSV is UTF-8 with a header row (see the template). Rows match
        existing records by e-mail (people) or exact name (accounts) and are skipped as duplicates.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { $ref: '#/components/schemas/ImportKind' }
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: .csv or .xlsx
            encoding:
              file:
                contentType: text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '201':
          description: Validated (status VALIDATED, or FAILED if unreadable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
  /import-templates/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ImportKind' }
    get:
      tags: [Import]
      operationId: getImportTemplate
      summary: Empty CSV template with the expected header row
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: CSV template
          content:
            text/csv:
              schema: { type: string }
              example: "name,sector,city,website,ownerEmail\n"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /imports/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Import]
      operationId: getImport
      summary: Import job with row errors
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Import job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Import]
      operationId: discardImport
      summary: Discard a validated import (status DISCARDED)
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '204': { description: Discarded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /imports/{id}/commit:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Import]
      operationId: commitImport
      summary: Write the valid rows of a validated import
      description: Rows with errors are skipped. Every imported person starts with consent NOT_SENT and enters the consent campaign (S-01).
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Import completed
