  /job-orders/{id}/brief:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Search brief]
      operationId: getSearchBrief
      summary: The brief of a job order (Brief tab, printable)
      description: Always 200; a job order without a saved brief returns empty fields, `briefVersion` 0 and `version` null. `offLimitsRules` are the rules in force today (all companies, plus those of the job order's account), read-only, for the Research tab.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      responses:
        '200':
          description: Brief
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchBrief' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Search brief]
      operationId: saveSearchBrief
