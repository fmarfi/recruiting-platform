        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /accounts/{id}/contacts:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Contacts]
      operationId: listAccountContacts
      summary: Contacts of an account, primary first (A-03)
      parameters:
        - name: active
          in: query
          description: Only active contacts (default true). Send false to include ended ones.
          schema: { type: boolean, default: true }
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Contacts]
      operationId: addAccountContact
      summary: Link an existing person or create a new one as contact
      description: Give exactly one of `personId` and `person`. Setting `primary=true` clears the flag on the other contacts.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCreateRequest' }
      responses:
        '201':
          description: Contact added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounts/{id}/contacts/{contactId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: contactId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    patch:
      tags: [Contacts]
      operationId: updateAccountContact
      summary: Change a contact's role or primary flag
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Contacts]
      operationId: removeAccountContact
      summary: End the contact (sets `endedOn` to today; the person and the history stay)
      description: Does not delete the row. The contact stays visible with `active=false` and in the person's contact roles. Ending an already ended contact returns it unchanged. Publishes `ContactRemoved`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Contact ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /people:
    get:
      tags: [People]
      operationId: listPeople
      summary: Network list with filters (A-12, UX-06)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: type
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/PersonType' }
          style: form
          explode: true
        - $ref: '#/components/parameters/OwnerId'
        - name: consentStatus
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/ConsentStatus' }
          style: form
          explode: true
        - name: lastContactBefore
          in: query
          description: Last contact on or before this date (or never).
          schema: { type: string, format: date }
        - name: lastContactAfter
          in: query
          schema: { type: string, format: date }
        - name: city
          in: query
          description: City equals one of the values (accent- and case-insensitive, trimmed). Since 1.1.1.
          schema:
            type: array
            maxItems: 50
            items: { type: string, minLength: 1, maxLength: 100 }
          style: form
          explode: true
        - name: company
          in: query
          description: Current company contains this text (accent- and case-insensitive, trigram index on `person.company`). Since 1.1.1.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: tag
          in: query
          description: Has at least one of these tags (lower-case match). A talent pool is a tag plus a shared saved view on it (ADR 0011). Since 1.2.0.
          schema:
            type: array
            maxItems: 20
            items: { $ref: '#/components/schemas/Tag' }
          style: form
          explode: true
        - name: sourceChannel
          in: query
          description: Since 1.2.0.
          schema:
            type: array
            items: { $ref: '#/components/schemas/SourceChannel' }
          style: form
          explode: true
        - name: cv
          in: query
          description: |
            Full-text query over the text of each person's **current** CV (Apache Tika extraction, no AI),
            Turkish-aware (`tr_unaccent` text search configuration: Turkish stemming, accents ignored).
            Web-search syntax: words are AND, `"exact phrase"`, `or`, `-word` to exclude. With `cv`, the
            default sort is relevance and each item carries `cvMatch`. Since 1.2.0.
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: shareable
          in: query
          description: '`true`: only people who may be shared with a client (consent GIVEN, not anonymised); `false`: only the others. Since 1.2.0.'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Archived'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: 'Sortable: `name`, `company`, `lastContactAt`, `createdAt`. Default `name,asc` (relevance first when `cv` is set).'
          schema:
            type: array
            items: { type: string }
      responses:
        '200':
          description: Page of people
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonSummaryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [People]
      operationId: createPerson
      summary: Add a person to the network
      description: |
        Consent status starts at NOT_SENT. The privacy module may queue the KVKK notice e-mail (S-01) per retention settings. A second person with the same e-mail gives 409 `DUPLICATE` with `existingId`.

        Since 1.2.0: call `POST /duplicates/check` first (the UI shows the matches before saving). Matches on phone, LinkedIn URL or name + company never block; after the create they are queued in `GET /duplicates`. `sourceChannel` defaults to null (unknown). `compensation` is stored encrypted (field-level, ADR 0011).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonCreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /people/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [People]
      operationId: getPerson
      summary: Person page header and details
      description: Recorded in the access log (VIEW). Related lists load separately — contact roles, links, applications (`GET /people/{id}/applications`), activities (`GET /activities?personId=`), next actions, consent.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Person
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [People]
      operationId: updatePerson
      summary: Change person details
      description: '`employments`, when sent, replaces the whole company history. Anonymised people cannot be edited (409 `STATE_CONFLICT`). Since 1.2.0, `compensation` may be written only by MANAGER/ADMIN or the relationship owner (else 403 `FORBIDDEN`, ADR 0011).'
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /people/{id}/contact-roles:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Contacts]
      operationId: listPersonContactRoles
      summary: Accounts where the person is or was a contact, with role (ended ones have active=false)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Contact roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /people/{id}/links:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Network links]
      operationId: listPersonLinks
      summary: A person's connections, both directions (A-13)
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PersonConnection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /network-links:
    post:
      tags: [Network links]
      operationId: createNetworkLink
      summary: Record who knows or introduced whom
      description: '`fromPersonId` must differ from `toPersonId`. The same (from, to, type) twice gives 409 `DUPLICATE`; for symmetric types (KNOWS, WORKED_WITH) the reverse direction counts as the same link.'
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkLinkCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /network-links/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Network links]
      operationId: getNetworkLink
      summary: Get a link
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkLink' }
