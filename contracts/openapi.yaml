  /people/{id}/merge:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Duplicates]
      operationId: mergePeople
      summary: Merge another person into this one (the survivor); audited, not reversible
      description: |
        One transaction, orchestrated by `privacy` (the only module allowed to reach accounts, pipeline
        and privacy, ADR 0001/0011):
        1. accounts: copy the fields named in `takeFromMerged` from the merged person (others keep the
           survivor's value; empty survivor fields are filled from the merged person), union the tags
           (at most 20), append employments, educations and languages that the survivor lacks, move
           files (CV versions renumbered by upload time), contacts and network links (duplicates and
           self-links dropped), close duplicate pairs of both as MERGED.
        2. pipeline: move applications (if both are on the same job order, keep the further stage and
           drop the other), activities, next actions, exposures and timeline `person_id`.
        3. privacy: move consent records and requests; the survivor's consent status becomes the latest
           decision of the two; recompute the retention clock; move DSRs.
        4. accounts: write `person_merge(survivor_id, merged_id)`, delete the merged person through
           JPA (Envers DEL row), publish `PersonMerged`.
        The `_aud` purge of the survivor later also covers the merged id (via `person_merge`).
        Errors: same id, or either person anonymised → 409 `STATE_CONFLICT`; `version` mismatch on the
        survivor → 409 `VERSION_CONFLICT`. **ASSUMPTION:** MANAGER/ADMIN only (403 for consultants).
      x-roles: [MANAGER, ADMIN]
      x-owner: privacy / security-privacy (orchestration); steps in accounts (backend-accounts) and pipeline (backend-pipeline)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonMergeRequest' }
      responses:
        '200':
          description: Merged; the survivor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /people/{id}/exposure:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Exposure]
      operationId: listPersonExposure
      summary: Which client accounts saw this person, for which job order, when, and the outcome (B-05)
      description: |
        One entry per presentation, newest first: the first move of an application to PRESENTED
        (channel PIPELINE; Wave 2d adds REPORT and SHARE_LINK). `stage` is the application's current
        stage, i.e. the outcome so far (null if the application was removed). Exposures are kept when
        the person is anonymised (ids and dates only) and deleted with the person.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      parameters:
        - $ref: '#/components/parameters/AccountIdQuery'
      responses:
        '200':
          description: Exposures
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExposureEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /off-limits:
    get:
      tags: [Off-limits]
      operationId: listOffLimitsRules
      summary: Companies the firm must not recruit from
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - $ref: '#/components/parameters/AccountIdQuery'
        - name: active
          in: query
          description: '`true`: rules in force today (`startsOn <= today` and `endsOn` null or `>= today`); `false`: ended or future ones; omitted: all rules.'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OffLimitsRulePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Off-limits]
      operationId: createOffLimitsRule
      summary: Mark a client account or another company as off-limits
      description: |
        Exactly one of `accountId` (a client in the CRM) or `companyName` (a company that is not an
        account). Since 1.3.0 (R63) the guard first matches the person's current employments by
        `organisationId` (the rule's account, and its subsidiaries when `includeSubsidiaries`), then falls
        back to the normalised company text against `companyName` or the account's name and aliases
        (`schema.md`, "Off-limits match"). An active rule for the same account or
        company gives 409 `DUPLICATE` with `existingId`. **ASSUMPTION:** MANAGER/ADMIN only.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OffLimitsRuleCreateRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OffLimitsRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /off-limits/{id}:
