    put:
      tags: [Commercial]
      operationId: uploadAgreementSignedFile
      summary: Upload or replace the signed copy of an agreement (R67)
      description: |
        PDF only, max 20 MB (detected from the bytes; else 415 `UNSUPPORTED_MEDIA_TYPE`). Stored in the
        `FileStore` under `agreement/<agreementId>/<signedFileId>`; a replaced file's bytes are deleted
        after the commit (Envers keeps the old id and name). Does not change `status` (set SIGNED with
        `signedOn` as before). The PDF holds the signatory's name and signature (business contact data,
        see `contracts/personal-data.md`).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
