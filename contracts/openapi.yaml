  # ---------- 1.3.0: archive, restore, merge (ADR 0013) ----------
  /accounts/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: archiveAccount
      summary: Archive an account (soft delete; restorable)
      description: |
        Sets `archivedAt`, `archivedBy`, `archiveReason` and `archiveNote` (Envers revision, timeline
        entry ARCHIVE, `ArchiveStateChanged`). The account leaves every list, search, picker and the
        command bar unless `archived=true` is asked for; `GET /accounts/{id}` still returns it.
        Guard: no job order of the account may be open and not archived (409 `TRANSITION_GUARD_FAILED`
        with the job orders as `blockingItems`). `MERGED` is not allowed here (use merge; 400).
        Archiving an archived account returns it unchanged. Archived records reject every change
        except restore with 409 `ARCHIVED`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounts/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: restoreAccount
      summary: Restore an archived account
      description: Clears the archive fields (Envers, timeline ARCHIVE, `ArchiveStateChanged(archived=false)`). A MERGED account cannot be restored (409 `STATE_CONFLICT`). Restoring a record that is not archived returns it unchanged.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounts/{id}/merge:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: mergeAccounts
      summary: Merge another account into this one (the survivor); audited, not reversible
      description: |
        One transaction, orchestrated by `accounts` (ADR 0013):
        1. accounts: fill empty survivor fields from the merged account (fields in `takeFromMerged`
           overwrite), union the tags (at most 20, else 409 `STATE_CONFLICT`), move contacts (a person
           who is an active contact of both keeps the survivor's row; the merged one is ended; the
           survivor's primary contact wins), off-limits rules, child accounts (`parentAccountId`) and
           the `account_open_job` projection.
        2. pipeline (`AccountMergeParticipant`): move job orders, proposals, activities, next actions,
           timeline entries, candidate exposures, agreements, placements, conflict checks and target
           companies that point at the merged account.
        3. accounts: archive the merged account with reason `MERGED` and `mergedInto` = survivor,
           write `account_merge` (counts only), publish `AccountMerged`; timeline entry MERGE.
        Errors: same id, either account archived, or the merged account is the survivor's parent or
        child chain → 409 `STATE_CONFLICT`; survivor `version` mismatch → 409 `VERSION_CONFLICT`.
        Since R63: the survivor gets the union of both role sets and aliases (the merged name becomes an alias, at most 20), and `person_employment.organisation_id` moves to the survivor (accounts, same transaction).
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts (orchestration); pipeline step by backend-pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountMergeRequest' }
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountMergeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /job-orders/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: archiveJobOrder
      summary: Archive a job order (soft delete; restorable)
      description: |
        Guard: no active application (stage not PLACED or REJECTED) — 409 `TRANSITION_GUARD_FAILED` with
        the applications as `blockingItems` (type APPLICATION). The status is kept; while archived the
        job order counts as not open (`account_open_job.open = false`). Timeline ARCHIVE,
        `ArchiveStateChanged`. Archived job orders reject changes, new applications and stage moves with
        409 `ARCHIVED`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /job-orders/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: restoreJobOrder
      summary: Restore an archived job order
      description: Fails with 409 `ARCHIVED` while its account is archived (restore the account first).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /people/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: archivePerson
      summary: Archive a person (hide from the pool; not an erasure)
      description: |
        Hides the person from `GET /people`, search, candidate suggestions and pickers. Archiving is
        **not** anonymisation or deletion: consent, retention clock and DSR rules run unchanged (ADR 0009
        stays the only erasure path). Guard: no active application (409 `TRANSITION_GUARD_FAILED`, type
        APPLICATION). An archived person cannot be added to a job order (409 `ARCHIVED`). `archiveNote`
        is personal data (scrubbed on anonymisation).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /people/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Archive]
      operationId: restorePerson
      summary: Restore an archived person
      description: An anonymised person cannot be restored to the pool (409 `STATE_CONFLICT`).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  # ---------- 1.3.0: tag management (ADR 0013) ----------
  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: Every tag in use or defined, with colour, pool flag and usage counts
      description: |
        Union of the distinct values in the `tags` arrays of accounts, people, job orders and proposals (archived records included in the counts) with the `tag_definition` rows. Tags without a definition have colour GREY and `defined=false`. Default sort `name,asc`.
        Sortable: `name`, `total`.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: entity
          in: query
          description: Only tags used on this entity.
          schema: { $ref: '#/components/schemas/ListEntity' }
        - name: talentPool
          in: query
          description: '`true`: only talent pools.'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of tags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagSummaryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tags/{tag}:
    parameters:
      - $ref: '#/components/parameters/TagPath'
    put:
      tags: [Tags]
      operationId: defineTag
      summary: Create or change a tag's definition (colour, description, talent pool flag)
      description: Creates the `tag_definition` row when missing (the tag need not be in use yet). Does not touch any record.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagDefinitionRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Tags]
      operationId: deleteTag
      summary: Remove the tag from every record and delete its definition
      description: Set-based rewrite of the `tags` arrays (no Envers revision per record, `version` bumped; ADR 0013), `tag_definition` deleted (Envers), `TagChanged(DELETED)` published so pipeline rewrites job orders and proposals. Shared saved views that filter on the tag keep the filter and return no rows. Unknown tag → 404.
      x-roles: [MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
        '200':
          description: Deleted; records changed in accounts (pipeline follows asynchronously)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagChangeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tags/{tag}/rename:
    parameters:
      - $ref: '#/components/parameters/TagPath'
    post:
      tags: [Tags]
      operationId: renameTag
      summary: Rename a tag on every record
      description: The new name must not be in use (409 `DUPLICATE`; merge instead). Moves the definition, rewrites the arrays like delete, publishes `TagChanged(RENAMED)`. Shared saved views with a `tag` filter on the old name are rewritten too.
