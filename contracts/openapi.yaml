    PersonDataExport:
      type: object
      required: [exportedAt, exportedBy, person, contactRoles, links, activities, applications, consent]
      properties:
        exportedAt: { type: string, format: date-time }
        exportedBy: { $ref: '#/components/schemas/UserRef' }
        person: { $ref: '#/components/schemas/Person' }
        contactRoles:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        links:
          type: array
