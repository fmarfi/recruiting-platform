          content:
            application/json:
              schema: { $ref: '#/components/schemas/Placement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conflict-checks/preview:
    post:
      tags: [Commercial]
      operationId: previewConflictCheck
      summary: Run the pre-engagement conflict check without recording it (PB-018)
      description: |
        Hits for an account (its whole group: parent chain and children) or a company name: CURRENT_CLIENT
        (ACTIVE account in the group), GUARANTEE_PERIOD (a placement whose guarantee runs, at a group
        company), OFF_LIMITS_RULE (an active rule on the company), PLACED_CANDIDATE (a person we placed
        works there now; counted, never named), COMPETING_SEARCH (an open job order at another client with
        the same `functionArea` and `seniorityLevel` in its brief).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
