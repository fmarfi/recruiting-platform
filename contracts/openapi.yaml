      summary: Download a READY export (requester only)
      description: Other users → 404. EXPIRED or past `expiresAt` → 410 `GONE` (the bytes are deleted by a nightly job). Each download writes an access-log DOWNLOAD row (entity EXPORT_JOB).
      x-roles: [CONSULTANT, MANAGER, ADMIN]
