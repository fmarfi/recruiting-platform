        '409': { $ref: '#/components/responses/Conflict' }
  /applications/{id}/stage:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Pipeline]
      operationId: changeApplicationStage
      summary: Move a candidate to another stage (drag on the board, A-07)
      description: |
        Reason required for REJECTED. PLACED only from OFFER. PLACED is final. A job order that is FILLED or CANCELLED accepts no stage moves (409 `TRANSITION_GUARD_FAILED`).

        Since 1.2.0 (ADR 0011):
        - **Client-facing stages** are PRESENTED, CLIENT_INTERVIEW, OFFER and PLACED
          (`PipelineStage.sharedWithClient()`). Forward moves may skip PRESENTED (e.g. SOURCED to
          CLIENT_INTERVIEW), so the rules below apply to a move into **any** of them, never only to
          PRESENTED.
        - **Sharing guard.** Every move into a client-facing stage needs valid consent (GIVEN, not
          anonymised; checked through the `ShareGuard` SPI that privacy implements). Otherwise 409
          `CONSENT_REQUIRED` with one `blockingItems` entry (type PERSON, `reasonCode` a
          `ShareBlockReason`); the UI offers the one-click (re)send `POST /people/{id}/consent/requests`.
        - **Off-limits guard.** The first move into a client-facing stage re-runs the off-limits check of
          `POST /job-orders/{id}/applications` (a rule created later, or a company change, is caught):
          409 `OFF_LIMITS` unless the application already has `offLimitsOverrideReason` or a MANAGER/ADMIN
          sends one in this request (a consultant sending it gets 403 `FORBIDDEN`). The consent guard
          has no override.
        - **Exposure.** The first move into a client-facing stage writes a `candidate_exposure` row
          (channel PIPELINE) for the job order's account; see `GET /people/{id}/exposure`.
        - This is the only operation that changes an application's stage: bulk `CHANGE_STATUS` does not
          cover applications, and any later bulk stage move must apply the same guards per record.
        - **Warnings.** The response may carry `warnings` (non-blocking), e.g. the person was already
          presented to this account for another job order.
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: pipeline / backend-pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StageChangeRequest' }
      responses:
        '200':
          description: Stage changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
