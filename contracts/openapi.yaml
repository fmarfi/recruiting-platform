      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Off-limits]
      operationId: getOffLimitsRule
      summary: One rule
      x-roles: [CONSULTANT, MANAGER, ADMIN]
      x-owner: accounts / backend-accounts
      responses:
