      summary: Record the invoice state of an instalment (finance; no invoice is issued by the platform)
      description: |
        Allowed moves: NOT_DUE → DUE (manual, e.g. EXPENSES), DUE → INVOICED (needs `einvoiceRef`,
        `invoicedOn`, `invoicedAmount`), INVOICED → PAID (needs `paidOn`), any unpaid → CANCELLED (needs
