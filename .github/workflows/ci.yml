name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        run: mvn -B verify

  openapi-lint:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint contracts/openapi.yaml
        run: |
          if [ -f contracts/openapi.yaml ]; then
            npx -y @redocly/cli@1 lint contracts/openapi.yaml
          else
            echo "contracts/openapi.yaml not present yet, skipping"
          fi

  testcontainers:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest   # GitHub-hosted runners include Docker
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pre-pull pgvector image
        run: docker pull pgvector/pgvector:0.8.7-pg17
      - name: Run integration tests
        # *IT classes run only under the `integration` Maven profile (failsafe); none exist in the skeleton yet.
        run: mvn -B verify -Pintegration
