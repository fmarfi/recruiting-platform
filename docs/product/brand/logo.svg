<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96" role="img" aria-labelledby="t d">
  <title id="t">Mihenk</title>
  <desc id="d">Mihenk monogram: a geometric M on a midnight touchstone with a brass streak, beside the Mihenk wordmark. Draft: wordmark is live text, outline before shipping.</desc>
  <!-- Monogram: touchstone slab -->
  <rect x="4" y="8" width="80" height="80" rx="14" fill="#14233D"/>
  <!-- Geometric M, even stroke, sharp joins -->
  <polyline points="24,63 24,29 44,51 64,29 64,63" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- Brass streak: the mark gold leaves on a touchstone -->
  <line x1="25" y1="76" x2="63" y2="72" stroke="#C49A4E" stroke-width="4" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="104" y="58" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="42" font-weight="600" letter-spacing="0.2" fill="#14233D">Mihenk</text>
  <!-- Tagline -->
  <text x="106" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.9" fill="#5B616C">EXECUTIVE SEARCH, PROVEN</text>
</svg>
