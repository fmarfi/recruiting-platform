# Base config. Secrets come ONLY from environment variables (see .env.example).
spring:
  application:
    name: recruiting-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recruiting}
    username: ${DB_USER:recruiting}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:no-reply@recruiting.local}
