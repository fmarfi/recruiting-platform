# Base config. Secrets come ONLY from environment variables (see .env.example).
spring:
  application:
    name: recruiting-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recruiting}
    username: ${DB_USER:recruiting}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # the service enforces 10 MB per file (413 PAYLOAD_TOO_LARGE); the container limits stay above it
      max-file-size: 12MB
      max-request-size: 620MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false # a mail outage must not mark the app as down

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:no-reply@recruiting.local}
  files:
    store: ${FILES_STORE:local} # local volume now, s3 later (devops)
    local-root: ${FILES_LOCAL_ROOT:${java.io.tmpdir}/recruiting-files}
