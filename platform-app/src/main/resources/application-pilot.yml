# Pilot environment. No defaults for secrets: the app must fail fast if they are missing.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
app:
  base-url: ${APP_BASE_URL}
server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
logging:
  level:
    root: INFO
